{ level:2, y:2016, n:22, origN:2, round:3, display:"제3회 2번", verified:true, q:"로샤 검사(Rorschach Test)나 다면적 인성검사(MMPI)와 같은 진단적 심리검사는 그 결과가 일치하지 않을 수 있다. 그 이유에 대해 간략히 설명하시오. 5점(08, 10, 16년 기출)", points:5, keypoints:[{label:"검사 결과 불일치 이유",min:3,pool:[{t:"검사마다 측정하는 심리기능의 측면과 수준이 다르다",ac:["다른 측면","상이한 수준"]},{t:"반응방식과 측정방법의 차이로 방법효과가 생긴다",ac:["측정방법 차이","방법효과"]},{t:"상황·동기·방어·검사태도 같은 상태요인의 영향을 다르게 받는다",ac:["검사태도","상황요인"]},{t:"성격은 복합적이고 맥락에 따라 표현이 달라진다",ac:["성격 복합성","개인차"]}]}], explain:"서로 다른 검사는 같은 사람을 평가해도 자극과 반응형식, 측정수준이 다르다. 따라서 결과의 차이를 오류로만 보지 말고 생활사와 면담정보를 포함해 통합해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:23, origN:3, round:3, display:"제3회 3번", verified:true, q:"심리평가 보고서를 작성할 때 심리검사 결과와 생활사적 정보를 통합하는 중요한 이유에 대해 기술하시오. 5점(05, 12년 기출)", points:5, keypoints:[{label:"검사결과와 생활사 정보를 통합하는 이유",min:3,pool:[{t:"검사점수의 의미를 개인의 실제 맥락에서 해석할 수 있다",ac:["생활맥락","맥락적 해석"]},{t:"한 자료원에 의존할 때 생길 수 있는 오류를 줄인다",ac:["오류 감소","교차검증"]},{t:"증상·성격·기능에 대한 종합적 사례이해와 치료계획에 도움된다",ac:["종합적 이해","치료계획"]}]}], explain:"심리검사는 구조화된 자료를 제공하지만 점수만으로 개인을 충분히 설명할 수 없다. 발달사·의뢰사유·현재 생활맥락과 결합하면 검사결과의 의미를 확인하고 모순을 점검하며 사례개념화를 더 타당하게 만들 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “심리검사=주관적, 생활사=객관적” 이분법은 부정확해 수정."] },

{ level:2, y:2016, n:24, origN:4, round:3, display:"제3회 4번", verified:true, q:"접수면접에서 다루어야 할 내용을 5가지 쓰시오 5점(20년 기출)", points:5, keypoints:[{label:"접수면접에서 다룰 내용 5가지",min:5,pool:[{t:"기본 인적정보",ac:["기본정보"]},{t:"주호소와 의뢰사유",ac:["주 호소","의뢰사유"]},{t:"외모·행동·정신상태 관찰",ac:["외모 및 행동","행동관찰"]},{t:"현재 스트레스와 촉발요인",ac:["스트레스 원인","촉발요인"]},{t:"심리사회적 지지체계",ac:["지원체계","사회적 지지"]},{t:"최근 주요 기능상태",ac:["기능상태"]},{t:"문제 관련 개인사·가족관계",ac:["개인사","가족관계"]},{t:"초기 진단가설과 평가계획",ac:["진단평가","평가계획"]}]}], explain:"접수면접은 기본정보와 주호소를 확인하고 현재 기능과 위험도, 생활스트레스, 지지체계와 관련 병력을 파악해 이후 평가와 상담의 방향을 세우는 단계다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:25, origN:5, round:3, display:"제3회 5번", verified:true, q:"정신분석 치료에서는 이상적인 목표에 도달하게 될 때 치료를 종결하게 된다. 정신분석적 치료의 이상적인 치료 목표를 설명하시오. 6점", points:6, keypoints:[{label:"정신분석적 치료의 이상적 목표",min:3,pool:[{t:"무의식적 갈등을 의식화하고 통찰한다",ac:["무의식적 갈등","통찰"]},{t:"부적절하고 경직된 방어를 보다 성숙하게 변화시킨다",ac:["방어기제 변화","성숙한 방어"]},{t:"증상 감소를 넘어 성격구조와 관계패턴의 지속적 변화를 추구한다",ac:["성격구조 변화","관계패턴 변화"]}]}], explain:"정신분석적 치료는 증상 제거만이 아니라 반복되는 무의식적 갈등과 관계패턴을 이해하고 통합하여 보다 유연한 방어와 안정적인 성격기능을 형성하는 것을 이상적 목표로 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:26, origN:6, round:3, display:"제3회 6번", verified:true, q:"강박장애의 심리적 치료방법으로서 노출 및 반응방지법(ERP)의 원리 및 시행순서를 기술하시오. 5점\n(11, 19년 기출)", points:5, keypoints:[{label:"ERP의 원리",min:2,pool:[{t:"불안을 유발하는 강박사고·상황에 계획적으로 노출한다",ac:["노출","exposure"]},{t:"불안을 줄이기 위해 하던 강박행동·의식을 하지 않도록 반응을 방지한다",ac:["반응방지","response prevention"]}]},{label:"시행순서",min:2,pool:[{t:"불안위계와 표적 강박을 정하고 반복적으로 노출",ac:["불안위계","반복 노출"]},{t:"강박행동을 지연·중단하고 충분히 머물며 새로운 학습을 형성",ac:["강박행동 중단","반응방지"]}]}], explain:"ERP는 강박장애의 핵심 행동치료로, 두려운 자극이나 생각을 회피하지 않고 접하면서 강박행동으로 불안을 중화하지 않도록 한다. 반복을 통해 불안을 견디는 능력과 위협에 대한 새로운 학습을 형성한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “강박사고가 근거 없음을 깨닫게 함”보다 노출과 반응방지를 통한 새로운 학습에 초점을 맞춰 정리."] },

{ level:2, y:2016, n:27, origN:7, round:3, display:"제3회 7번", verified:true, q:"아동상담에서 놀이의 치료적 기능을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"놀이의 치료적 기능 3가지",min:3,pool:[{t:"치료자와의 관계·라포 형성",ac:["관계형성","라포"]},{t:"감정·욕구·갈등을 언어 대신 직접적·상징적으로 표현",ac:["자기노출","상징적 표현"]},{t:"감정을 안전하게 표현·재경험하며 정화와 문제해결을 촉진",ac:["치유","정화","카타르시스"]}]}], explain:"놀이는 아동에게 자연스러운 의사소통 수단이다. 치료관계를 만들고 말로 표현하기 어려운 경험을 상징적으로 드러내며, 감정을 안전하게 다루고 새로운 해결방식을 연습하도록 돕는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:28, origN:8, round:3, display:"제3회 8번", verified:true, q:"다음 보기의 내담자의 진술에 대한 상담자의 반응은 각각 어떤 개입기술에 해당하는지 ( ) 안에 쓰시오. 4점(13년 기출)\n내담자: 지난밤 저는 너무 황당한 꿈을 꾸었습니다. 아버지와 함께 숲에서 사냥을 하고 있었는데요. 갑자기 바위 뒤편에서 커다란 물체가 튀어나오는 거예요. 저는 순간 사슴인 줄 알고 너무 놀라서 방아쇠를 당겼어요. 어렴풋이 물체가 쓰러진 듯 보여 두근거리는 마음을 부여잡고 서서히 다가갔어요. 그런데 가까이 가보니 쓰러진 물체는 사슴이 아닌 아버지였어요. 아버지가 숨을 멈추고 죽어있는 모습을 보니 너무 황당하고 두려워서 잠에서 깨어났는데 등에서는 식은땀이 흐르더라고요\n(1) “당신은 지난밤 꿈으로 인해 정말 많이 놀랐나 보군요.” ( )\n(2) “황당하고 두려웠다는 것은 구체적으로 어떤 죄책감이 들었다는 의미인가요?” ( )\n(3) “평소 아버지를 미워했나요?” ( )\n(4) “아버지에 대한 적개심이 총을 오작동 하도록 만든 것은 아닌가요?” ( )", points:4, keypoints:[{label:"개입기술 구분",min:4,pool:[{t:"감정을 되돌려 주는 반응은 반영",ac:["반영"]},{t:"의미를 구체적으로 확인하는 반응은 명료화",ac:["명료화"]},{t:"말·감정·행동의 불일치나 회피를 제시하는 것은 직면",ac:["직면"]},{t:"숨은 의미나 관계를 잠정적으로 연결하는 것은 해석",ac:["해석"]}]}], explain:"네 반응의 이름은 반영, 명료화, 직면, 해석이다. 다만 실제 상담에서는 꿈의 내용에서 적개심이나 죄책감을 단정하지 않고 내담자가 검토할 수 있는 가설 수준으로 제시하는 것이 더 적절하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 직면·해석 문구는 의미를 단정하는 경향이 있어 해설에서 주의점 병기."] },

{ level:2, y:2016, n:29, origN:9, round:3, display:"제3회 9번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점\n이건 정말 믿을 수가 없어요. 선생님, 지난번 상담을 받을 때 남편이 집에 일찍 들어오겠다고 약속했었잖아요? 그런데 정말로 남편이 제시간에 맞춰 집에 오더라고요. 그렇게 약속을 잘 지킬 줄 몰랐는데 정말 깜짝 놀랐다니까요.\n보기에서 내담자의 말에 대한 상담자의 공감적 반응을 적절히 제시하시오.\n공감적 반응\n반영적 반응\n정의\n예시", points:5, keypoints:[{label:"공감적 반응의 핵심",min:2,pool:[{t:"남편이 약속을 실제로 지킨 것이 예상 밖이라 놀랐다는 감정을 반영",ac:["놀랐음","뜻밖"]},{t:"그 경험이 내담자에게 어떤 의미였는지 내담자 중심의 말로 되돌려 준다",ac:["감정 반영","의미 반영"]}]}], explain:"공감반응은 상담자의 놀람이나 기쁨을 앞세우기보다 내담자가 느낀 뜻밖의 놀람과 그 의미를 정확히 반영하는 것이 핵심이다. 예: “남편이 실제로 약속을 지키는 모습을 보니 예상 밖이어서 정말 놀라셨군요.”", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료 예시의 “상담자인 저도 정말 놀랍고 기쁘네요”는 상담자 감정을 앞세워 공감 예시로는 덜 적절해 수정."] },

{ level:2, y:2016, n:30, origN:10, round:3, display:"제3회 10번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점(11년 기출)\n만약 이번 학기에 전 과목에서 A학점을 받지 못한다면, 이번 학기는 실패한 것이나 다름없어.\n(1) 벡(Beck)의 인지치료에서 보기의 내용과 관련된 인지적 오류의 유형을 제시하시오.\n(2) 위의 인지적 오류를 수정하는 데 가장 보편적으로 사용되는 치료기법을 쓰고 간략히 설명하시오.", points:5, keypoints:[{label:"인지적 오류",min:1,pool:[{t:"이분법적 사고",ac:["흑백논리","양극적 사고"]}]},{label:"수정기법",min:1,pool:[{t:"척도화 기법: 성공·실패를 0/100처럼 둘로 나누지 않고 연속선상 정도로 평가",ac:["척도화","연속선 기법","continuum"]}]}], explain:"“전 과목 A가 아니면 완전한 실패”라는 판단은 중간 가능성을 배제하는 이분법적 사고다. 척도화나 연속선 기법으로 성취를 여러 수준으로 나누어 평가하면 흑백논리를 완화할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:31, origN:11, round:3, display:"제3회 11번", verified:true, q:"실존치료에서는 정상적 불안과 신경증적 불안을 구분하고 있다. 그 중 정상적 불안의 특징을 3가지 쓰시오. 6점\n정상적 불안(=실존적 불안)\n신경증적 불안", points:6, keypoints:[{label:"정상적·실존적 불안의 특징 3가지",min:3,pool:[{t:"실제 상황과 위협의 정도에 비교적 부합한다",ac:["상황에 부합","적절한 수준"]},{t:"억압되기보다 의식적으로 직면할 수 있다",ac:["억압되지 않음","직면 가능"]},{t:"성장·창조적 변화와 결단의 계기로 활용될 수 있다",ac:["창조적","성장 촉진"]}]}], explain:"실존치료에서 정상적 불안은 삶의 불확실성과 책임에 대한 자연스러운 반응으로, 상황에 비례하고 회피·억압되지 않으며 성장과 선택의 동력이 될 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:32, origN:12, round:3, display:"제3회 12번", verified:true, q:"적성검사와 흥미검사의 공통점과 차이점을 설명하시오. 4점\n(1) 공통점\n(2) 차이점\n적성검사\n흥미검사", points:4, keypoints:[{label:"공통점",min:1,pool:[{t:"둘 다 진로·직업 선택과 자기이해를 위한 정보를 제공한다",ac:["진로 선택","자기이해"]}]},{label:"차이점",min:2,pool:[{t:"적성검사는 특정 과제나 직업에서의 잠재적 수행능력·학습가능성을 평가",ac:["적성","수행능력"]},{t:"흥미검사는 활동·직업영역에 대한 선호와 관심을 평가",ac:["흥미","선호","관심"]}]}], explain:"적성은 “잘할 가능성”에, 흥미는 “무엇을 좋아하고 선호하는가”에 더 가깝다. 두 결과는 진로상담에서 상호보완적으로 사용하며 어느 하나가 직업선택을 결정하지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:33, origN:13, round:3, display:"제3회 13번", verified:true, q:"카우프만 검사(K-ABC)가 다른 개인용 지능검사와 구별되는 특징을 3가지 쓰시오. 3점", points:3, keypoints:[{label:"K-ABC의 구별되는 특징 3가지",min:3,pool:[{t:"순차처리와 동시처리 등 인지처리과정을 중심으로 평가",ac:["인지처리과정","순차처리","동시처리"]},{t:"습득도 척도로 후천적으로 학습된 지식을 별도로 평가",ac:["습득도","후천적 지식"]},{t:"인지처리 프로파일을 교육적 처치와 연결하기 쉽도록 구성",ac:["교육적 처치","처리과정 중심"]},{t:"발달수준에 따라 적용 하위검사가 달라진다",ac:["연령별 하위검사","발달수준"]}]}], explain:"K-ABC는 단일 IQ보다 인지처리 방식과 습득된 지식을 구분해 보는 데 초점을 두며, 결과를 아동의 학습과 교육계획에 연결하려는 특징이 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:34, origN:14, round:3, display:"제3회 14번", verified:true, q:"웩슬러 지능검사의 결과에서 언어성 지능이 동작성 지능에 비해 유의미하게 낮은 경우의 해석과 그 예를 쓰시오. 5점(05년 기출) - 구판 기준", points:5, keypoints:[{label:"언어성 지능이 동작성보다 유의하게 낮을 때의 해석",min:2,pool:[{t:"언어적 지식·청각언어 처리의 상대적 약점 가능성을 가설로 세운다",ac:["언어적 약점","청각언어 처리 약점"]},{t:"점수차만으로 학습장애·성격장애·좌반구 손상 등을 진단하지 않고 소검사 프로파일과 병력·신경심리검사를 함께 본다",ac:["추가평가","점수차만으로 진단 금지"]}]},{label:"가능한 예",min:1,pool:[{t:"언어발달·교육경험의 제한이나 특정 언어·학습 문제에서 상대적 언어성 약점이 나타날 수 있다",ac:["언어발달","교육경험","학습 문제"]}]}], explain:"구판 Wechsler에서 VIQ<PIQ 차이는 언어성 기능의 상대적 약점을 탐색하는 단서로 사용할 수 있었지만, 단순한 IQ 차이만으로 특정 뇌손상이나 정신장애를 진단하는 것은 타당하지 않다. 현재는 지표·소검사와 임상정보를 통합해 해석한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “15점 이상이면 언어능력 결함, 좌반구 손상/반사회성 성격장애” 식의 진단적 단정은 현대적 해석 기준에서 과도하여 수정."] },

{ level:2, y:2016, n:35, origN:15, round:3, display:"제3회 15번", verified:true, q:"MMPI 2개 척도에 대한 분석에서 6-8/8-6 유형의 일반적인 특징 5가지와 가능성 있는 장애 진단명 2가지를 쓰시오. 7점(07, 10년 기출)\n(1) 6-8/8-6 유형의 일반적인 특징 5가지\n(2) 가능성 있는 장애 진단명:", points:7, keypoints:[{label:"6-8/8-6 코드유형의 특징 5가지",min:5,pool:[{t:"의심과 피해적 사고가 두드러질 수 있다",ac:["피해사고","의심"]},{t:"기이한 사고·지각경험이나 현실검증의 어려움이 나타날 수 있다",ac:["기이한 사고","현실검증"]},{t:"사회적 소외와 대인관계 불신이 나타날 수 있다",ac:["사회적 소외","대인 불신"]},{t:"불안·긴장과 정서적 혼란이 심할 수 있다",ac:["정서적 혼란","불안"]},{t:"심한 스트레스에서 사고와 기능이 더 와해될 수 있다",ac:["스트레스 시 악화","기능 와해"]}]},{label:"임상적으로 고려할 수 있는 장애범주 2가지",min:2,pool:[{t:"조현병 스펙트럼 및 기타 정신병적 장애 가능성을 감별",ac:["조현병 스펙트럼","정신병적 장애"]},{t:"편집성 성격특성 또는 관련 성격병리를 감별",ac:["편집성 성격","paranoid personality"]}]}], explain:"6(Pa)-8(Sc) 상승은 피해적 사고, 대인불신, 소외감, 기이한 경험 등 심한 정신병리 가능성을 시사할 수 있다. 그러나 코드유형은 진단명이 아니므로 면담과 현실검증, 기능수준, 증상 기간을 종합해 감별한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료 진단명은 “가능성” 수준으로 유지하고 코드만으로 확정하지 않도록 해설 보정."] },

{ level:2, y:2016, n:36, origN:16, round:3, display:"제3회 16번", verified:true, q:"KPI-C와 KPRC의 한 척도에 대한 설명이다. 어느 척도에 대한 설명인지 해당 척도명을 쓰시오. 3점\n여러 가지 심리적인 문제에 대한 아동의 대처능력이나 적응잠재력을 평가하기 위한 것으로, 내적·외적 스트레스에 융통성 있고 적절하게 대처하는 개인의 전반적인 능력을 측정한다.", points:3, keypoints:[{label:"척도명",min:1,pool:[{t:"자아탄력성 척도(ERS)",ac:["자아탄력성","ERS"]}]}], explain:"내·외적 스트레스에 융통성 있게 대처하고 적응할 수 있는 전반적 잠재력을 평가하는 설명은 KPI-C/KPRC의 자아탄력성(ERS) 척도에 해당한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:37, origN:17, round:3, display:"제3회 17번", verified:true, q:"흔히 일반 종합심리검사(Full Battery)에서 사용하는 검사 중 신경심리검사로서의 역할을 할 수 있는 검사를 2가지 쓰시오. 4점", points:4, keypoints:[{label:"Full Battery 중 신경심리적 역할을 할 수 있는 검사 2가지",min:2,pool:[{t:"Wechsler 지능검사: 전반적 인지능력과 지표별 인지기능의 상대적 강·약점 평가",ac:["WAIS","웩슬러 지능검사"]},{t:"Bender-Gestalt Test: 시지각·시각운동 통합과 일부 신경학적 이상 선별에 활용",ac:["BGT","벤더게슈탈트"]}]}], explain:"종합심리검사에 포함되는 Wechsler 지능검사와 BGT는 신경심리적 기능에 관한 정보를 제공할 수 있다. 다만 이 검사들만으로 뇌손상을 확정하지 않고 필요하면 전문 신경심리검사를 추가한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:38, origN:18, round:3, display:"제3회 18번", verified:true, q:"만성 정신질환자에 대한 재활개입 방법을 3가지 쓰고, 각각에 대해 설명하시오. 6점(09, 13년 기출)", points:6, keypoints:[{label:"만성 정신질환 재활개입 3가지",min:3,pool:[{t:"사회기술훈련: 의사소통·대인관계·문제해결 기술을 연습",ac:["사회기술훈련"]},{t:"환자교육·질병관리: 증상·약물·재발징후와 자기관리 교육",ac:["환자교육","질병관리"]},{t:"가족교육·가족개입: 질병이해와 의사소통·대처를 향상",ac:["가족교육","가족치료"]},{t:"직업재활: 직업기능과 취업·직장적응을 지원",ac:["직업재활"]}]}], explain:"정신사회재활은 증상만 다루지 않고 실제 생활기능과 사회참여를 높이는 데 초점을 둔다. 사회기술, 질병관리, 가족개입, 직업재활 등을 개인의 기능평가와 목표에 맞게 조합한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:39, origN:19, round:3, display:"제3회 19번", verified:true, q:"자살 위험성이 높은 내담자에 대해 상담자가 할 수 있는 조치방법을 3가지 기술하시오. 6점\n내담자는 상담에 앞서 비밀보장에 대한 동의를 고하였고, 이에 대해 상담자는 비밀보장에 관한 사항을 내담자에게 충분히 설명해 주었다. 이후 상담이 진행될수록 내담자는 구체적인 자살 계획을 밝히는 등 이미 자살 위험도가 상당히 높은 수준에 도달한 것으로 나타났다.", points:6, keypoints:[{label:"자살위험이 높은 내담자에 대한 조치 3가지",min:3,pool:[{t:"즉각적인 위험도를 평가하고 혼자 두지 않으며 안전을 확보한다",ac:["혼자 두지 않음","안전 확보"]},{t:"가족·보호자 등 안전을 도울 수 있는 사람과 연결한다",ac:["가족에게 알림","보호자 연결"]},{t:"자해수단에 대한 접근을 줄이고 안전계획을 세운다",ac:["위험물 접근 제한","안전계획"]},{t:"정신건강의학과·응급의료 등 적절한 전문치료로 즉시 연계한다",ac:["정신건강의학과 연계","응급의료","전문가 연계"]}]}], explain:"구체적인 자살계획 등 고위험 신호가 있으면 비밀보장보다 생명과 안전이 우선될 수 있다. 위험도를 즉시 평가하고 혼자 두지 않으며, 지지자와 전문치료를 연결하고 가능한 자해수단 접근을 줄이는 등 적극적인 안전조치를 취한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:40, origN:20, round:3, display:"제3회 20번", verified:true, q:"심리상담자가 준수해야 할 윤리적인 의무 중 ‘이중관계 지양’에 대해 설명하시오. 5점(10년 기출)", points:5, keypoints:[{label:"이중관계 지양의 의미",min:3,pool:[{t:"상담관계 외에 금전·친밀·성적·사업 등 추가 관계가 겹치는 상황을 말한다",ac:["이중관계","다중관계"]},{t:"객관성·전문적 판단을 해치거나 착취·손상의 위험이 있는 이중관계를 피한다",ac:["객관성 저해","착취 위험","손상 위험"]},{t:"불가피하거나 위험이 예상되면 경계를 명확히 하고 수퍼비전·의뢰 등으로 보호조치를 한다",ac:["경계 설정","수퍼비전","의뢰"]}]}], explain:"모든 다중관계가 자동으로 비윤리적인 것은 아니지만, 객관성·역량을 훼손하거나 착취·손상 위험을 만들 수 있는 관계는 피해야 한다. 위험이 있으면 경계를 분명히 하고 수퍼비전이나 적절한 의뢰를 고려한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “이중관계는 모두 피해야 함”을 손상·객관성 위험 중심의 윤리적 표현으로 정교화."] },

{ level:2, y:2017, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"아동심리치료에 있어서 고려해야 할 아동의 특성을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"아동심리치료에서 고려할 특성 3가지",min:3,pool:[{t:"보호자·가족의 통제와 참여가 치료에 큰 영향을 준다",ac:["보호자 영향","부모 참여"]},{t:"언어적 표현이 제한되어 행동화나 놀이로 표현하기 쉽다",ac:["행동화","언어발달 미숙"]},{t:"인지·정서조절·대처능력이 발달 중이라 발달수준에 맞춘 개입이 필요하다",ac:["인지능력 부족","대처능력 부족","발달수준"]}]}], explain:"아동치료는 성인과 달리 발달수준, 보호자와 가족체계의 영향, 언어 대신 놀이·행동으로 표현하는 특성을 함께 고려해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:2, origN:2, round:1, display:"제1회 2번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점\n검사자는 뇌졸중 환자를 대상으로 글자 지우기 검사를 실시하였다.\n그런데 환자는 시야 좌측의 글자를 다 못 지우는 것이었다.\n(1) 보기의 사례와 같은 현상을 무엇이라 지칭하는가?;\n(2) 뇌의 어느 반구의 손상인가?:\n(3) 이와 같은 현상을 평가할 수 있는 검사 종류를 한 가지만 쓰시오.:", points:6, keypoints:[{label:"현상",min:1,pool:[{t:"편측무시",ac:["반측공간무시","unilateral neglect"]}]},{label:"주로 관련되는 반구",min:1,pool:[{t:"우반구 손상",ac:["우측 두정엽","right hemisphere"]}]},{label:"평가검사 예",min:1,pool:[{t:"선 이등분 검사",ac:["line bisection"]},{t:"글자·별 지우기 검사",ac:["cancellation test","지우기 검사"]}]}], explain:"좌측 공간의 자극을 지속적으로 누락하는 것은 편측무시를 시사하며, 특히 우반구 손상에서 좌측 무시가 흔하다. 선 이등분이나 지우기 과제로 평가할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:3, origN:3, round:1, display:"제1회 3번", verified:true, q:"MMPI 2개의 척도에 대한 분석에서 4-9/9-4 척도의 양상을 5가지 기술하시오. 5점\n(06, 08, 11, 15년 기출)", points:5, keypoints:[{label:"4-9/9-4 상승의 대표 특징 5가지",min:5,pool:[{t:"충동적이고 행동화하기 쉽다",ac:["충동성","행동화"]},{t:"반항적·공격적 행동 경향",ac:["반항적","공격적"]},{t:"규범 위반·반사회적 행동 경향",ac:["규범 위반","반사회적 행동"]},{t:"자기중심적이고 책임감이 낮다",ac:["자기중심적","무책임"]},{t:"합리화를 사용하기 쉽다",ac:["합리화"]}]}], explain:"4(Pd)-9(Ma) 상승은 충동성, 자극추구, 반항, 행동화 같은 외현화 특성을 시사할 수 있다. 코드유형만으로 반사회성 성격장애나 양극성장애를 진단하지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “양극성 장애 진단가능”은 정답 포인트에서 제외."] },

{ level:2, y:2017, n:4, origN:4, round:1, display:"제1회 4번", verified:true, q:"기능성 기억장애와 기질성 기억장애의 예를 한 가지씩 쓰고 차이점을 설명하시오. 5점\n(1) 기능성 기억장애와 기질성 기억장애의 예\n기능성 기억장애의 예\n기질성 기억장애의 예\n(2) 차이점\n기능성 기억장애\n기질성 기억장애", points:5, keypoints:[{label:"기능성 기억장애 예와 특징",min:2,pool:[{t:"심리적 충격과 관련된 기억상실 등 심리적 요인에 의한 기억장애",ac:["해리성 기억상실","심리적 요인"]},{t:"명확한 구조적 뇌병변 없이 특정 기억이 선택적으로 손상될 수 있다",ac:["뇌병변 없음","선택적 기억상실"]}]},{label:"기질성 기억장애 예와 특징",min:2,pool:[{t:"뇌손상·신경학적 질환 이후의 기억저하",ac:["뇌손상","신경학적 질환"]},{t:"신경인지기능 손상과 함께 지속적·불완전한 회복을 보일 수 있다",ac:["기질성","신경인지 손상"]}]}], explain:"기능성 기억장애는 심리적 요인과 관련되고 명확한 신경학적 병변이 확인되지 않는 경우를, 기질성 기억장애는 뇌질환·손상과 관련된 기억기능 저하를 말한다. 실제 감별에는 신경학적 검사와 일관성 평가가 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:5, origN:5, round:1, display:"제1회 5번", verified:true, q:"Kadushin(1985)이 제시한 슈퍼비전의 기능 3가지 분류에 따라 괄호 안에 들어갈 알맞은 말을 쓰시오. 6점\nA기능은 상담자가 내담자와의 작업에 관한 탐색과 숙고를 통해 상담자의 기술, 이해, 능력, 전문적 정체감을 발달시키는 것을 의미한다.\nB기능은 상담자가 슈퍼바이저가 제공하는 수용과 확인을 통해 상담 작업의 정서적 효과를 처리하고 보고하여 풀 수 있도록 해준다.\nC기능은 슈퍼비전의 질적 통제를 제공하는 것으로 슈퍼바이저는 내담자의 요구가 명확히 정의된 윤리적, 전문적 실천의 규준 내에서 언급되고 있는가를 분명히 하기 위해 상담자를 조력한다.", points:6, keypoints:[{label:"Kadushin의 수퍼비전 기능 3가지",min:3,pool:[{t:"교육적 기능: 지식·기술과 전문적 정체성 발달",ac:["교육적 기능"]},{t:"지지적 기능: 상담업무의 정서적 부담을 다루고 사기를 지지",ac:["지지적 기능"]},{t:"행정적·관리적 기능: 서비스의 질과 규정·윤리 준수를 관리",ac:["행정적 기능","관리적 기능"]}]}], explain:"Kadushin은 수퍼비전을 교육적, 지지적, 행정적 기능으로 구분했다. 실제 수퍼비전에서는 세 기능이 분리되어 있기보다 함께 작동한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:6, origN:6, round:1, display:"제1회 6번", verified:false, q:"다음 보기의 사례를 읽고 물음에 답하시오. 2점\n내담자: 나는 도움이 안 되는 사람이에요.\n상담자: 그렇게 생각하세요? 도움이 안 되는 사람이라고요? 정말 비참한 기분이겠네요.\n내담자: 제 친구가 어제 저한테 그렇게 말했어요.\n상담자: 그 친구가 당신을 쓸모없는 사람이라고 말했다고요?\n보기의 사례에서 상담자가 보여주려고 하는 것은 무엇인가?", points:2, keypoints:[{label:"상담자가 사용한 기법",min:1,pool:[{t:"재진술·명료화: 내담자의 말을 되짚어 의미를 분명히 한다",ac:["재진술","명료화","바꾸어 말하기"]}]}], explain:"시험 대비: 원자료는 ‘부정적 역기능적 인지도식’을 정답으로 제시한다. 따라서 실제 시험 재현을 우선한다면 이 표현을 기억해 둘 필요가 있다.\\n\\n실제 이해: 제시된 상담자의 발화 자체는 내담자의 말을 되짚어 의미를 분명히 하는 재진술·명료화로도 읽힌다. 원자료 정답과 관찰 가능한 상담기법 사이에 충돌이 있어 정답 확정을 보류한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 “부정적 역기능적 인지도식”을 답으로 제시하지만 외부 강의자료에서는 “재진술”로 설명되어 출처 간 충돌. 최종 정답 확정 보류."] },

{ level:2, y:2017, n:7, origN:7, round:1, display:"제1회 7번", verified:true, q:"상담 과정에서 내담자의 주요 호소문제가 명확해지면 상담의 구체적인 목표를 설정하게 된다.\n상담 목표 설정 시 지켜야 할 기준을 5가지 제시하시오. 5점(11년 기출)", points:5, keypoints:[{label:"상담목표 설정 기준 5가지",min:5,pool:[{t:"내담자의 가치와 욕구에 부합한다",ac:["내담자 가치"]},{t:"능력과 환경을 고려해 현실적이다",ac:["현실적 목표"]},{t:"구체적이고 검증 가능한 행동·결과로 표현된다",ac:["구체적","검증 가능"]},{t:"적절한 기간과 범위가 정해져 있다",ac:["기간 설정"]},{t:"실제 생활에서 의미 있는 변화로 나타난다",ac:["실제적 변화"]},{t:"과정이 아니라 달성할 결과로 진술한다",ac:["결과로 진술"]}]}], explain:"좋은 상담목표는 내담자에게 의미 있고 현실적이며, 달성 여부를 확인할 수 있을 만큼 구체적이어야 한다. 기간과 결과를 명확히 하면 상담의 방향과 평가가 쉬워진다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"바람직한 상담 종결을 위해 상담관계를 마무리하면서 해야 할 일을 3가지 쓰시오. 6점(13년 기출)", points:6, keypoints:[{label:"바람직한 종결에서 할 일 3가지",min:3,pool:[{t:"상담과정과 목표달성·변화를 함께 평가",ac:["과정 평가","목표 달성 평가"]},{t:"종결과 이별에 대한 감정을 다룬다",ac:["이별감정"]},{t:"변화를 유지할 계획과 재발대처를 점검한다",ac:["유지 계획","재발대처"]},{t:"필요 시 다시 도움을 요청할 수 있음을 안내한다",ac:["재상담 가능"]},{t:"추수상담 여부와 방법을 합의한다",ac:["추수상담"]}]}], explain:"종결에서는 무엇이 변했는지 함께 평가하고 이별감정을 다루며, 상담 이후 변화유지와 재발대처 계획을 세우는 것이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"전화로 어떤 여성이 다급한 목소리로 자신이 방금 강간을 당했다고 보고하면서 두려워하고 있다. 상담자로서 취할 조치 방법을 5가지 기술하시오. 5점", points:5, keypoints:[{label:"성폭력 직후 상담자의 조치 5가지",min:5,pool:[{t:"즉각적인 신체적 안전과 응급의료 필요를 확인한다",ac:["안전 확인","응급의료"]},{t:"비난하지 않고 심리적으로 지지하며 선택권을 존중한다",ac:["심리적 지지","선택권 존중"]},{t:"원하면 증거보존과 의료검진에 관한 정보를 제공한다",ac:["증거보존","의료검진"]},{t:"신뢰할 수 있는 보호자·지지자와 연결한다",ac:["지지자 연결"]},{t:"성폭력 전문기관·의료·법률 지원 정보를 제공한다",ac:["전문기관 연계","법률 지원"]}]}], explain:"성폭력 직후에는 피해자의 안전과 의료적 필요를 우선 확인하고, 통제감을 회복할 수 있도록 선택권을 존중하며 비난 없는 지지를 제공해야 한다. 신고나 증거보존 절차도 강요가 아니라 정보와 선택지로 안내한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"심리치료의 이론과 기법은 매우 다양하다. 그러나 그와 같은 이론과 기법에도 치료효과를 가지는 공통요인이 존재한다. 심리치료 효과를 가져오는 공통적인 치료요인을 3가지 쓰시오. 6점(11년 기출)", points:6, keypoints:[{label:"심리치료의 공통요인 3가지",min:3,pool:[{t:"신뢰와 협력에 기반한 치료적 관계",ac:["치료관계","치료적 동맹"]},{t:"문제에 대한 새로운 이해·의미·통찰을 얻음",ac:["통찰","이해"]},{t:"감정 표현과 정서적 해소",ac:["정화","감정 표현"]},{t:"변화에 대한 기대와 희망",ac:["희망","기대"]}]}], explain:"치료이론이 달라도 긍정적인 치료관계, 문제에 대한 새로운 이해, 감정의 안전한 표현, 변화에 대한 기대 같은 공통요인이 치료성과에 기여할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:11, origN:11, round:1, display:"제1회 11번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점(03, 07, 08년 기출)\nA씨는 20세 남성으로, 재수를 하여 올해 3월에 대학에 입학했다. 재수를 시작한 지 한 달 만에 기분이 우울하고 가슴이 두근거리며, 두통, 소화불량, 불면증을 보였다. 또한 매사에 짜증이 나고 집중력이 저하되어 공부를 하는데 지장이 초래되었다. 올해 자신이 원하던 대학교에 입학해서도 그와 같은 증상이 지속되었고, 동네 의원을 방문하였으나 별다른 내과적 이상소견이 발견되지 않았다. 의사의 추천으로 심리상담소를 찾게 되어 MMPI, BDI, K-WAIS 검사를 받게 되었고, MMPI에서 L(52), F(58), K(60), Hs(59), D(75), Hy(58) Pd(62), Mf(35), Pa(54), Pt(66), Sc(46), Ma(48), Si(59), BDI에서 23점, K-WAIS의 언어성 IQ 125, 동작성 IQ 94, 전체 IQ 114의 결과점수를 보였다.\n재수생. 집중력 저하. 불면증. 우울. 가슴 두근거림.\n동네 의원 진료결과 내과적 이상소견 없음.\nMMPI : L(52), F(58), K(60) D(75), Mf(35), Pt(66).\nBDI 23점\nK-WAIS : 언어성 IQ 125, 동작성 IQ 94, 전체 IQ 114\n내담자의 정신장애 및 감별진단을 요하는 정신장애 유형을 제시하고, 각각의 장애에 대한 임상적 양상을 기술하시오.\n(1) 내담자의 정신장애 유형 및 임상적 양상\n(2) 감별진단을 요하는 정신장애 및 임상적 양상", points:6, keypoints:[{label:"우선 고려할 진단가설",min:1,pool:[{t:"주요우울장애 또는 우울삽화 가능성",ac:["주요우울장애","우울삽화"]}]},{label:"근거",min:3,pool:[{t:"지속되는 우울감·불면·집중저하·짜증과 기능손상",ac:["우울감","불면","집중력 저하"]},{t:"MMPI 2(D) 상승과 BDI의 높은 우울증상 점수",ac:["D척도 상승","BDI 23"]},{t:"내과적 이상이 확인되지 않았지만 신체적 불안·우울 증상이 지속",ac:["신체증상","내과적 이상 없음"]}]},{label:"감별할 상태",min:1,pool:[{t:"범불안장애 등 불안장애를 감별",ac:["범불안장애","불안장애"]}]}], explain:"사례는 우울증상이 장기간 지속되고 기능을 방해하므로 우울장애를 우선 가설로 둘 수 있다. 불안과 신체증상도 뚜렷해 불안장애를 감별해야 한다. 지능지수 차이는 진단근거로 사용하지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 VIQ-PIQ 차이를 우울 진단 근거처럼 사용하지만 정답 포인트에서 제외."] },

{ level:2, y:2017, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"K-WISC-IV의 4가지 지표와 각 지표별 소검사를 1개씩 쓰시오. 4점", points:4, keypoints:[{label:"K-WISC-IV 4지표와 소검사 예",min:4,pool:[{t:"언어이해(VCI): 공통성·어휘·이해 중 하나",ac:["VCI","언어이해"]},{t:"지각추론(PRI): 토막짜기·행렬추리·공통그림찾기 중 하나",ac:["PRI","지각추론"]},{t:"작업기억(WMI): 숫자·순차연결 중 하나",ac:["WMI","작업기억"]},{t:"처리속도(PSI): 동형찾기·기호쓰기 중 하나",ac:["PSI","처리속도"]}]}], explain:"K-WISC-IV는 언어이해, 지각추론, 작업기억, 처리속도의 네 지표로 구성된다. 각 지표명과 해당 핵심 소검사 한 가지를 정확히 짝지어 쓰면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"조현병 양성 증상을 보이는 환자를 대상으로 임상심리사가 수행할 수 있는 적절한 대처방법을 3가지 기술하시오. 6점 (20년 기출)", points:6, keypoints:[{label:"조현병 양성증상에 대한 대처 3가지",min:3,pool:[{t:"망상에 논쟁하거나 동조하지 않고 정서와 안전에 초점을 둔다",ac:["망상 논쟁하지 않음","망상 동조하지 않음"]},{t:"환각·환청의 내용과 정서반응, 행동명령 여부와 통제가능성을 차분히 평가한다",ac:["환청 평가","명령환청","통제가능성"]},{t:"와해된 행동의 위험성을 평가하고 단순하고 명확하게 구조화한다",ac:["위험성 평가","행동 구조화"]}]}], explain:"정신병적 경험을 직접 논박하거나 강화하기보다 환자의 감정과 안전을 확인하고, 환청의 명령성·행동통제 가능성, 와해행동의 위험도를 평가하는 것이 중요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"집단치료의 치료적 요인을 5가지 기술하시오. 5점(09, 12, 13, 14, 17, 18년 기출)", points:5, keypoints:[{label:"집단치료의 치료적 요인 5가지",min:5,pool:[{t:"이타심",ac:["이타심"]},{t:"모방행동",ac:["모방행동"]},{t:"집단응집력",ac:["집단응집력"]},{t:"정화",ac:["정화","카타르시스"]},{t:"보편성",ac:["보편성"]},{t:"희망의 고취",ac:["희망 고취"]}]}], explain:"집단치료에서는 서로 도움을 주는 이타심, 타인을 통한 학습, 집단응집력, 감정의 정화, 문제의 보편성 인식, 희망의 고취 등이 대표적인 치료요인이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"파괴적 행동문제를 보이는 청소년을 대상으로 행동치료를 수행할 때 행동원리에 의한 정적 강화의 수준을 높여야 하는 이유를 3가지 쓰시오. 6점(11년 기출)", points:6, keypoints:[{label:"정적강화를 높여야 하는 이유 3가지",min:3,pool:[{t:"바람직한 행동 직후 강화하면 기대행동의 빈도를 높일 수 있다",ac:["바람직한 행동 증가","정적강화"]},{t:"처벌 중심 접근은 반항·공격성이 높은 청소년에게 효과가 제한되거나 부작용이 있을 수 있다",ac:["처벌 효과 제한"]},{t:"역기능적 환경에서 우연히 강화된 부적응행동을 대체행동 강화로 바꿀 수 있다",ac:["대체행동 강화","부적응행동 강화 수정"]}]}], explain:"파괴적 행동에서는 처벌을 늘리는 것보다 구체적인 바람직한 행동을 정의하고 즉각적·일관되게 강화하는 것이 대체행동을 학습시키는 데 중요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:16, origN:16, round:1, display:"제1회 16번", verified:false, q:"다음 보기의 MMPI 상승척도쌍을 보고 물음에 답하시오. 5점\nA. 1-2-3 Code Type B. 3-4 Code Type C. 7-8-9 Code Type D. 2-7-3 Code Type\n보기의 4가지 상승척도쌍 가운데 가장 응급한 사례로 다루어야 하는 것을 고르고, 그 이유를 쓰시오.\n(1) 응급한 사례로 다루어야 하는 상승척도쌍:\n(2) 이유", points:5, keypoints:[{label:"시험에서 요구하는 코드유형",min:1,pool:[{t:"C. 7-8-9 코드유형",ac:["7-8-9","C"]}]},{label:"원자료가 제시하는 이유",min:2,pool:[{t:"높은 정신병리와 현실검증 저하 가능성을 시사",ac:["현실검증 저하","정신병리"]},{t:"흥분·충동성·기이한 사고가 함께 나타날 가능성을 고려",ac:["흥분","충동성","기이한 사고"]}]}], explain:"시험 대비: 원자료의 정답은 C, 7-8-9 코드유형이며 높은 정신병리, 현실검증 저하, 흥분·충동성 가능성을 이유로 든다.\\n\\n실제 이해: 응급도는 MMPI 코드만으로 결정하지 않는다. 현재 자살·타해 위험, 심한 흥분, 현실검증, 의식상태와 행동통제 가능성을 직접 평가해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ “가장 응급한 사례”를 MMPI 코드유형만으로 결정하는 문항 자체가 임상적으로 과도한 단순화. 시험 정답은 보존하되 verified 보류."] },

{ level:2, y:2017, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"MMPI 임상척도 중 9번 척도의 T점수가 27점일 때 임상적 양상을 2가지 쓰시오. 4점", points:4, keypoints:[{label:"척도 9(Ma)가 매우 낮을 때 고려할 양상 2가지",min:2,pool:[{t:"낮은 활력과 정신운동성 저하·무기력",ac:["무기력","정신운동성 지체"]},{t:"우울감·피로·흥미저하 가능성",ac:["우울","피로","흥미저하"]}]}], explain:"척도 9(Ma)의 매우 낮은 점수는 낮은 활성수준, 피로와 무기력, 우울한 정서와 관련될 수 있다. 단독 저점만으로 우울장애를 진단하지 않고 전체 프로파일과 면담을 함께 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:["배점 오인식 교정: T점수 27을 points로 잘못 읽은 값을 실제 배점 4점으로 수정."] },

{ level:2, y:2017, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"행동치료의 노출치료법을 통해 환자가 가지게 되는 인지적 측면의 치료효과를 3가지 쓰시오. 6점\n(12년 기출)", points:6, keypoints:[{label:"노출치료의 인지적 치료효과 3가지",min:3,pool:[{t:"공포상황이 예상만큼 위험하지 않다는 현실적 재평가",ac:["현실적 인식","위협 재평가"]},{t:"반복노출을 통해 불안을 견딜 수 있다는 학습",ac:["불안 견딤","불안 감소"]},{t:"스스로 대처할 수 있다는 자기효능감 증가",ac:["자기효능감","대처 자신감"]}]}], explain:"노출치료는 단순히 불안을 줄이는 것뿐 아니라 “이 상황은 예상만큼 위험하지 않다”, “불안은 견딜 수 있다”, “나는 대처할 수 있다”는 새로운 학습을 형성한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:19, origN:19, round:1, display:"제1회 19번", verified:true, q:"망상을 보이는 편집증적 내담자의 평가를 위한 면담 시 주의사항을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"망상 내담자 면담 주의사항 3가지",min:3,pool:[{t:"망상내용을 논리로 강제로 깨뜨리거나 논쟁하지 않는다",ac:["망상 논쟁 금지"]},{t:"망상에 동의하지 않으면서 그로 인한 감정과 고통은 공감한다",ac:["정서 공감","망상 동조 금지"]},{t:"사실·지각과 해석을 구분하도록 현실검증을 돕는다",ac:["현실검증","사실과 해석 구분"]},{t:"위험행동·명령성 경험 등 안전을 평가한다",ac:["안전 평가","위험성 평가"]}]}], explain:"망상 면담에서는 믿음을 직접 공격하면 치료동맹이 악화될 수 있다. 내용에 동조하지 않되 경험의 고통을 인정하고 사실과 해석을 구분하도록 돕고 안전을 평가한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:20, origN:1, round:3, display:"제3회 1번", verified:true, q:"심리평가를 위한 자료원 중 면담, 행동관찰과 비교한 심리검사의 장점을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"심리검사의 장점 3가지",min:3,pool:[{t:"표준화된 절차로 비교적 객관적이고 정량화된 정보를 제공",ac:["표준화","객관적 정보"]},{t:"규준과 비교해 개인의 위치와 특성을 파악할 수 있다",ac:["규준 비교"]},{t:"면담에서 직접 드러나기 어려운 영역을 구조화해 탐색할 수 있다",ac:["간접 측정","잠재 특성"]}]}], explain:"심리검사는 표준화와 규준을 통해 면담·관찰보다 체계적인 비교자료를 제공하고, 직접 관찰하기 어려운 심리구성개념을 간접적으로 측정할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:21, origN:2, round:3, display:"제3회 2번", verified:true, q:"상담자가 상담 시 내담자와의 관계에 대해 알고 있어야 할 윤리문제에 대한 기본원칙을 쓰고, 행동지침을 5가지 기술하시오. 7점(06, 12년 기출", points:7, keypoints:[{label:"기본 윤리원칙",min:1,pool:[{t:"내담자의 복지와 자율성을 존중하고 해를 피하며 공정하고 성실하게 전문서비스를 제공한다",ac:["자율성","선행","무해성","정의","성실"]}]},{label:"행동지침 5가지",min:5,pool:[{t:"상담자의 개인적 욕구가 상담에 미치는 영향을 자각",ac:["개인적 욕구 자각"]},{t:"욕구충족을 위해 내담자를 이용하지 않는다",ac:["착취 금지"]},{t:"손상 위험이 있는 이중·다중관계를 피한다",ac:["이중관계","다중관계"]},{t:"자신의 가치관과 태도가 내담자에게 미치는 영향을 점검",ac:["가치관 점검"]},{t:"비밀보장과 그 한계를 준수·설명한다",ac:["비밀보장"]}]}], explain:"상담윤리는 자율성·선행·무해성·정의·성실 같은 원칙을 실제 관계에서 구현하는 것이다. 특히 권력차를 이용한 착취, 위험한 이중관계, 가치 강요와 부당한 정보공개를 피해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:22, origN:3, round:3, display:"제3회 3번", verified:true, q:"로샤 검사(Rorschach)의 구조적 요약에 제시되는 형태질 종류 3가지를 쓰시오. 6점", points:6, keypoints:[{label:"구조적 요약의 형태질 관련 3종",min:3,pool:[{t:"FQx: 전체 반응의 형태질 분포",ac:["FQx"]},{t:"MQual: 인간운동(M) 반응의 형태질 분포",ac:["MQual"]},{t:"W+D: 전체반응(W)과 보통부분반응(D)의 형태질 분포",ac:["W+D"]}]}], explain:"Exner 구조적 요약에는 전체 형태질 분포(FQx), 인간운동반응의 형태질(MQual), W와 D 반응의 형태질을 묶어 보는 W+D가 포함된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:23, origN:4, round:3, display:"제3회 4번", verified:false, q:"다음은 50대 여성 내담자의 웩슬러 지능검사(K-WAIS) 결과이다. 이를 토대로 다음의 물음에 답하시오. 8점\n하위검사명\n평가치\n하위검사명\n평가치\n기본지식\n8\n빠진 곳 찾기\n5\n숫자 외우기\n6\n차례 맞추기\n6\n어휘문제\n10\n토막짜기\n5\n산수문제\n7\n모양맞추기\n6\n이해문제\n8\n바꿔쓰기\n5\n공통성 문제\n9\n(1) 정신과적 진단의 종류 2가지와 함께 감별진단을 고려해야 하는 사항을 4가지 기술하시오.\n(2) 내담자가 신경학적 검사상 특별한 소견이 없이 최근 남편의 외도로 인해 스트레스를 받았다고\n가정할 때, 이 내담자에게서 나타난 숫자 외우기 및 산수문제 점수의 상대적 저하와 함께 동작성\n지능의 전반적 저하를 설명하시오.", points:8, keypoints:[{label:"원자료가 제시한 진단가설",min:2,pool:[{t:"주요우울장애 가능성",ac:["주요우울장애"]},{t:"범불안장애 가능성",ac:["범불안장애"]}]},{label:"감별에서 확인할 사항",min:3,pool:[{t:"불안·우울·외상·강박 등 현재 증상과 기간을 직접 평가",ac:["증상 기간","불안 우울 평가"]},{t:"주의집중 저하가 정서적 스트레스와 관련된 상태효과인지 평가",ac:["스트레스","주의집중"]},{t:"신경학적·의학적 원인과 약물·수면 등 다른 원인을 감별",ac:["신경학적 원인","의학적 원인"]}]}], explain:"시험 대비: 원자료는 K-WAIS 프로파일을 근거로 주요우울장애와 범불안장애를 진단가설로 제시한다.\\n\\n실제 이해: 지능검사 하위검사 점수만으로 정신과적 진단을 확정할 수 없다. 정서상태, 증상기간, 기능손상, 의학·신경학적 원인을 별도로 평가해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 지능검사 표만으로 정신과 진단 2가지를 요구하고 감별항목도 서로 뒤섞여 있어 content validity가 낮음. verified 보류."] },

{ level:2, y:2017, n:24, origN:5, round:3, display:"제3회 5번", verified:true, q:"집단상담의 일반적인 치료적 요인을 5가지 기술하시오. 5점(09, 12, 13, 14, 17, 18년 기출)", points:5, keypoints:[{label:"집단치료의 치료적 요인 5가지",min:5,pool:[{t:"이타심",ac:["이타심"]},{t:"모방행동",ac:["모방행동"]},{t:"집단응집력",ac:["집단응집력"]},{t:"정화",ac:["정화"]},{t:"보편성",ac:["보편성"]},{t:"희망의 고취",ac:["희망 고취"]}]}], explain:"집단치료의 대표적 공통 치료요인으로 이타심, 모방, 응집력, 정화, 보편성, 희망 등이 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:25, origN:6, round:3, display:"제3회 6번", verified:true, q:"사티어(Satir)가 의사소통 가족치료를 통해 제시한 의사소통의 5가지 유형을 쓰시오. 5점", points:5, keypoints:[{label:"Satir 의사소통 유형 5가지",min:5,pool:[{t:"회유형",ac:["회유형","placating"]},{t:"비난형",ac:["비난형","blaming"]},{t:"초이성형",ac:["초이성형","computing"]},{t:"산만형",ac:["산만형","irrelevant"]},{t:"일치형",ac:["일치형","congruent"]}]}], explain:"Satir는 스트레스 상황에서 나타나는 불일치 의사소통을 회유·비난·초이성·산만형으로 설명하고, 자신·타인·상황을 함께 존중하는 일치형을 건강한 의사소통으로 보았다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:26, origN:7, round:3, display:"제3회 7번", verified:true, q:"아동 평가에서 특정 문제영역이 아닌 전반적인 광범위한 문제영역에 대해 보호자의 보고를 토대로 평가할 수 있는 평정척도가 있다. 그에 해당하는 평정척도를 2가지 쓰시오 4점(12년 기출)", points:4, keypoints:[{label:"보호자 보고 광범위 평정척도 2가지",min:2,pool:[{t:"K-CBCL",ac:["CBCL","아동청소년 행동평가척도"]},{t:"KPRC",ac:["아동인성평정척도"]}]}], explain:"K-CBCL과 KPRC는 보호자 보고를 통해 아동의 다양한 정서·행동 문제를 광범위하게 평가할 수 있는 척도다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:27, origN:8, round:3, display:"제3회 8번", verified:true, q:"개인의 취약성과 환경적 스트레스가 상호작용하여 정신장애로 발병한다고 보는 통합적인 모델 명칭을 쓰고, 이 모델에서 개인의 취약성에 해당하는 정신장애 발생 원인을 2가지 쓰시오. 5점\n(1) 모델명\n(2) 개인의 취약성 요인", points:5, keypoints:[{label:"모델명",min:1,pool:[{t:"취약성-스트레스 모델",ac:["vulnerability-stress model"]}]},{label:"개인의 취약성 요인 2가지",min:2,pool:[{t:"유전적·생물학적 소인",ac:["유전적 요인","생물학적 요인"]},{t:"기질·인지양식·심리적 특성 등 개인 내적 취약성",ac:["기질","심리적 특성","인지적 취약성"]}]}], explain:"취약성-스트레스 모델은 개인의 생물학적·심리적 취약성과 환경 스트레스가 상호작용해 장애 발생 위험을 높인다고 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:28, origN:9, round:3, display:"제3회 9번", verified:true, q:"최근 인터넷 중독이 사회적 관심으로 대두되고 있다. 인터넷 중독이 의심되는 내담자로 하여금 인터넷 중독에서 벗어날 수 있도록 일반적으로 추천하는 방법을 4가지만 쓰시오. 4점(03, 20년 기출)", points:4, keypoints:[{label:"인터넷 사용조절 방법 4가지",min:4,pool:[{t:"현재 사용패턴을 기록하고 반대되는 새로운 일정으로 재구성",ac:["반대로 실행하기","사용패턴 기록"]},{t:"외적 중지자나 알람·일정 같은 종료 신호를 사용",ac:["외적 중지자","알람"]},{t:"총 사용시간과 시간대를 구체적으로 제한",ac:["사용시간 목표","시간 제한"]},{t:"문제가 되는 특정 앱·사이트 사용을 제한하거나 차단",ac:["응용프로그램 제한","사이트 차단"]},{t:"대체활동과 오프라인 일정을 늘린다",ac:["대체활동"]}]}], explain:"사용시간을 단순히 참는 방식보다 패턴을 측정하고 구체적 시간계획, 종료 신호, 문제 앱 제한, 대체활동을 함께 설계하는 것이 행동조절에 도움이 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:29, origN:10, round:3, display:"제3회 10번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 8점\n40대 남성인 A씨는 오염에 대한 생각으로 반복적인 손 씻기 행동을 보이고 있다. A씨도 그와 같은 생각이 부적절하다는 것을 인식하고 있지만 잘 통제되지 않은 채 반복적으로 의식에 떠올라 고통을 호소하고 있다.\n(1) A씨의 주요 증상을 토대로 진단명을 쓰시오.\n(2) 적절한 치료기법을 쓰시오.\n(3) 치료과정을 4단계로 약술하시오.", points:8, keypoints:[{label:"진단명",min:1,pool:[{t:"강박장애",ac:["OCD"]}]},{label:"치료기법",min:1,pool:[{t:"노출 및 반응방지(ERP)",ac:["ERP"]}]},{label:"치료과정 핵심",min:3,pool:[{t:"오염 자극이나 강박사고를 유발하는 상황에 계획적으로 노출",ac:["노출"]},{t:"불안을 중화하기 위한 손씻기 등 강박행동을 하지 않도록 반응방지",ac:["반응방지"]},{t:"반복연습과 과제·재발예방으로 새로운 학습을 유지",ac:["반복 연습","재발예방"]}]}], explain:"오염사고와 반복적 손씻기는 강박장애의 전형적 형태다. ERP에서는 오염자극을 회피하지 않고 접하면서 손씻기 같은 강박행동을 하지 않아도 불안이 견딜 수 있고 예상한 재앙이 일어나지 않는다는 새로운 학습을 형성한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 4단계 중 “비극적 결말 상상”은 일부 변형 절차일 수 있으나 ERP의 필수 핵심으로 보지 않아 채점 포인트에서 제외."] },

{ level:2, y:2017, n:30, origN:11, round:3, display:"제3회 11번", verified:true, q:"MMPI나 BDI와 같은 객관적 자기보고형 검사의 장점과 단점을 각각 3가지 쓰시오. 6점(09년 기출)\n(1) 장점\n(2) 단점", points:6, keypoints:[{label:"객관적 자기보고검사의 장점 3가지",min:3,pool:[{t:"표준화와 규준이 있어 신뢰도·타당도를 검토할 수 있다",ac:["표준화","신뢰도","타당도"]},{t:"시행·채점이 비교적 효율적이고 경제적이다",ac:["경제적","채점 용이"]},{t:"대규모 비교와 반복측정이 쉽다",ac:["반복측정","비교 용이"]}]},{label:"단점 3가지",min:3,pool:[{t:"사회적 바람직성·묵인 등 반응경향의 영향을 받을 수 있다",ac:["반응경향","사회적 바람직성"]},{t:"의도적 과장·축소·왜곡 가능성이 있다",ac:["반응 왜곡","증상 과장"]},{t:"문항에 포함되지 않은 독특한 개인경험은 포착하기 어렵다",ac:["문항 제한","개별성 제한"]}]}], explain:"객관적 자기보고검사는 표준화와 효율성이 강점이지만 자기보고라는 특성 때문에 반응경향과 의도적 왜곡, 문항범위의 제한을 함께 고려해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:31, origN:12, round:3, display:"제3회 12번", verified:true, q:"소크라테스식 대화의 특징을 3가지 제시하고, 소크라테스식 대화의 구체적인 예를 2가지 쓰시오. 5점\n(14년 기출)\n(1) 소크라테스식 대화의 특징\n(2) 구체적인 예", points:5, keypoints:[{label:"소크라테스식 대화 특징 3가지",min:3,pool:[{t:"신중한 질문으로 증거와 대안을 탐색한다",ac:["증거 탐색","대안 탐색"]},{t:"내담자가 자신의 경험과 생각을 구체적으로 검토하도록 한다",ac:["경험 구체화","자기검토"]},{t:"치료자가 결론을 강요하지 않는 협력적·비판단적 탐구다",ac:["협력적 탐구","비판단적"]}]},{label:"질문 예 2가지",min:2,pool:[{t:"그 생각을 지지하는 증거와 반대하는 증거는 무엇인가?",ac:["근거가 무엇인가","반대 증거"]},{t:"다르게 설명할 수 있는 가능성은 무엇인가?",ac:["대안적 설명","다른 가능성"]},{t:"그 믿음이 100% 사실이 아니라면 어느 정도인가?",ac:["척도화","정도 평가"]}]}], explain:"소크라테스식 대화는 상담자가 정답을 가르치기보다 질문을 통해 내담자가 증거와 대안을 스스로 검토하도록 하는 협력적 방법이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:32, origN:13, round:3, display:"제3회 13번", verified:false, q:"심리적 응급처치의 방법을 5단계로 구분하여 설명하시오. 5점", points:5, keypoints:[{label:"원자료가 제시하는 5단계",min:5,pool:[{t:"사건 전 준비 단계",ac:["사건 전 단계"]},{t:"충격 단계: 즉각적 안전·기본욕구 확인",ac:["충격 단계"]},{t:"구출 단계: 상태평가와 고위험군 연계",ac:["구출 단계"]},{t:"회복 단계: 회복서비스와 적응 점검",ac:["회복 단계"]},{t:"재통합 단계: 장기적 기능회복과 사회복귀 지원",ac:["재통합 단계"]}]}], explain:"시험 대비: 원자료의 5단계는 사건 전 준비 → 충격 → 구출 → 회복 → 재통합이다.\\n\\n실제 이해: 이 순서는 특정 재난·위기개입의 시간경과 모형으로 이해하는 편이 안전하다. 오늘날 모든 심리적 응급처치(PFA)가 동일한 ‘표준 5단계’를 사용한다고 일반화해서는 안 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ “심리적 응급처치(PFA)의 표준 5단계”로 일반화하기에는 체계마다 용어가 달라 verified 보류."] },

{ level:2, y:2017, n:33, origN:14, round:3, display:"제3회 14번", verified:true, q:"인간중심 상담에서 로저스(Rogers)가 강조한 치료적 조건, 즉 내담자의 변화를 촉진하는 치료자의 태도를 3가지 쓰시오. 6점(08, 10, 14, 18년 기출)", points:6, keypoints:[{label:"Rogers의 치료적 태도 3가지",min:3,pool:[{t:"무조건적 긍정적 존중",ac:["무조건적 긍정적 존중","수용"]},{t:"공감적 이해",ac:["공감","공감적 이해"]},{t:"진실성·일치성",ac:["진실성","일치성","congruence"]}]}], explain:"Rogers는 치료자가 진실하게 관계하고, 내담자를 조건 없이 존중하며, 내담자의 경험세계를 공감적으로 이해하는 세 조건을 변화촉진의 핵심으로 보았다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:34, origN:15, round:3, display:"제3회 15번", verified:true, q:"방어기제의 의미를 쓰고, 방어기제의 유형을 4가지 간략히 설명하시오. 6점(04, 07, 10년 기출)\n(1) 방어기제의 의미", points:6, keypoints:[{label:"방어기제의 의미",min:1,pool:[{t:"불안과 내적갈등을 줄이기 위해 자아가 주로 무의식적으로 사용하는 심리적 방식",ac:["무의식적 방어","불안 감소"]}]},{label:"방어기제 예 4가지",min:4,pool:[{t:"합리화: 실제 동기 대신 그럴듯한 이유로 행동을 정당화",ac:["합리화"]},{t:"투사: 자신의 받아들이기 어려운 감정·충동을 타인에게 돌림",ac:["투사"]},{t:"전치: 감정을 원래 대상보다 덜 위협적인 대상으로 옮김",ac:["전치"]},{t:"반동형성: 받아들이기 어려운 충동과 반대되는 태도·행동을 보임",ac:["반동형성"]},{t:"승화: 충동을 사회적으로 수용되는 활동으로 전환",ac:["승화"]},{t:"유머: 고통스러운 내용을 유머로 다루며 현실을 유지",ac:["유머"]}]}], explain:"방어기제는 불안과 내적 갈등을 조절하는 심리과정이다. 방어의 종류에 따라 현실왜곡 정도와 적응성이 다르며, 성숙한 방어는 현실을 비교적 유지하면서 감정을 조절한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:35, origN:16, round:3, display:"제3회 16번", verified:true, q:"MMPI 임상척도 중 척도 4와 척도 6이 상승되어 있고 척도 5가 이들 척도보다 10점 이상 낮거나 T점수 50점 이하로 하락되어 있는 형태의 명칭을 쓰시오. 3점", points:10, keypoints:[{label:"프로파일 명칭",min:1,pool:[{t:"수동-공격형 V 또는 Scarlett O’Hara V",ac:["수동-공격형 V","Scarlett O’Hara V","스칼렛 오하라 V"]}]}], explain:"구 MMPI 해석 문헌에서는 4와 6이 높고 5가 낮은 특정 V자형 프로파일을 “Scarlett O’Hara V” 또는 수동-공격형 V로 부르기도 했다. 이는 역사적 프로파일 명칭으로 이해해야 하며 현대 진단명은 아니다.", source:"임상심리사 2급 실기 기출자료", review_notes:["역사적·성별 고정관념이 반영된 구식 명칭이므로 현대 임상적 진단표현으로 사용하지 않도록 주석."] },

{ level:2, y:2017, n:36, origN:17, round:3, display:"제3회 17번", verified:true, q:"건강심리학의 발달배경을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"건강심리학 발달배경 3가지",min:3,pool:[{t:"급성 감염성 질환 중심에서 만성질환 중심으로 질병양상이 변화",ac:["만성질환 증가"]},{t:"수명연장과 삶의 질·예방에 대한 관심 증가",ac:["수명 연장","삶의 질"]},{t:"행동·생활습관이 건강과 질병에 미치는 영향의 중요성 증가",ac:["생활습관","건강행동"]},{t:"의료기술 발전과 의료비·건강서비스 수요 증가",ac:["의료비","건강서비스"]}]}], explain:"만성질환과 생활습관 관련 질환이 늘고 평균수명이 연장되면서, 질병치료뿐 아니라 예방·건강행동·삶의 질을 다루는 심리학적 접근의 필요성이 커졌다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2017, n:37, origN:18, round:3, display:"제3회 18번", verified:true, q:"심리평가의 최종보고서에 반드시 포함되어야 할 내용을 5가지만 쓰시오. 5점(10년 기출)", points:5, keypoints:[{label:"심리평가 최종보고서의 필수 내용 5가지",min:5,pool:[{t:"내담자 기본정보",ac:["내담자 정보"]},{t:"의뢰이유와 평가질문",ac:["의뢰이유"]},{t:"사용한 평가도구와 절차",ac:["평가도구","평가절차"]},{t:"행동관찰과 면담정보",ac:["행동관찰"]},{t:"검사결과와 해석",ac:["평가 결과","해석"]},{t:"생활사·맥락과 검사결과의 통합",ac:["생활사 통합","통합해석"]},{t:"요약·진단적 인상·권고사항",ac:["요약","권고"]}]}], explain:"평가보고서는 누가 왜 의뢰되었고 어떤 절차를 사용했는지, 관찰과 검사에서 무엇이 나왔는지, 이를 생활사와 어떻게 통합했는지, 그리고 임상적으로 어떤 권고가 필요한지를 명확히 제시해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"로샤검사(Rorschach)의 특수점수에서 특수내용의 종류를 3가지 쓰고, 각각에 대해 설명하시오. 6점", points:6, keypoints:[{label:"로샤 특수내용 3가지",min:3,pool:[{t:"추상적 내용(AB): 인간의 정서·감각·추상적 경험을 나타내는 내용",ac:["추상적 내용","AB"]},{t:"공격적 운동(AG): 운동반응에서 분명한 공격적 상호작용이 표현됨",ac:["공격적 운동","AG"]},{t:"협조적 운동(COP): 둘 이상의 대상이 협조적 상호작용을 함",ac:["협조적 운동","COP"]}]}], explain:"로샤의 특수점수 가운데 특수내용은 반응 내용과 상호작용의 질을 부호화한다. 추상적 내용은 정서·감각·추상개념을, AG는 공격적 행동을, COP는 협조적 상호작용을 나타낸다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:2, origN:2, round:1, display:"제1회 2번", verified:true, q:"재활모형에서 손상, 장애, 핸디캡의 의미를 쓰고, 개입방법상의 차이점을 설명하시오. 5점\n(10, 13년 기출)\n(1) 의미\n(2) 개입방법상의 차이점\n(3) 치료 측면", points:5, keypoints:[{label:"세 개념 정의",min:3,pool:[{t:"손상(Impairment): 심리·생리·해부학적 구조나 기능의 손실 또는 이상",ac:["손상","impairment"]},{t:"장애(Disability): 손상으로 인해 정상적 활동 수행능력이 제한된 상태",ac:["장애","disability"]},{t:"핸디캡(Handicap): 손상·장애로 연령·성·사회문화적 역할 수행에서 불이익이 생긴 상태",ac:["핸디캡","handicap","사회적 불이익"]}]},{label:"개입수준 차이",min:3,pool:[{t:"손상은 기관·신체기능 차원의 치료와 기능회복에 초점",ac:["기관 차원","기능회복"]},{t:"장애는 개인의 활동능력과 재활에 초점",ac:["개인 차원","개인능력"]},{t:"핸디캡은 환경·사회체계와 역할장벽의 조정에 초점",ac:["사회 차원","환경 조정"]}]}], explain:"재활모형은 문제를 손상-장애-핸디캡의 서로 다른 수준으로 구분한다. 따라서 개입도 신체·기능 회복, 개인의 활동능력 향상, 사회적 장벽 완화로 나뉜다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:3, origN:3, round:1, display:"제1회 3번", verified:true, q:"해결중심 가족치료에서 사용하는 해결 지향적 질문유형을 3가지 쓰고, 각각에 대해 설명하시오. 6점", points:6, keypoints:[{label:"해결지향적 질문 3가지",min:3,pool:[{t:"예외질문: 문제가 덜하거나 없었던 예외상황과 이미 성공한 대처를 찾는다",ac:["예외질문"]},{t:"기적질문: 문제가 해결된 미래를 상상해 원하는 변화를 구체화한다",ac:["기적질문"]},{t:"척도질문: 0~10 등의 숫자로 현재상태·진전·희망·동기를 구체화한다",ac:["척도질문"]}]}], explain:"해결중심 가족치료의 질문은 문제 원인보다 이미 존재하는 해결의 단서와 원하는 미래를 찾도록 돕는다. 예외질문은 성공경험, 기적질문은 목표상태, 척도질문은 변화 정도를 구체화한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:4, origN:4, round:1, display:"제1회 4번", verified:true, q:"집단치료의 치료적 요인을 5가지 기술하시오. 5점(13, 14, 15, 17년기출)- 이모집정보희", points:5, keypoints:[{label:"집단치료 치료요인 5가지",min:5,pool:[{t:"이타심",ac:["이타심"]},{t:"모방행동",ac:["모방행동"]},{t:"집단응집력",ac:["집단응집력"]},{t:"정화",ac:["정화","카타르시스"]},{t:"보편성",ac:["보편성"]},{t:"희망의 고취",ac:["희망 고취"]}]}], explain:"집단치료에서는 서로 도움을 주는 이타심, 타인을 통한 학습, 집단응집력, 감정의 정화, 문제의 보편성 인식, 희망의 고취 등이 대표적 치료요인이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:5, origN:5, round:1, display:"제1회 5번", verified:true, q:"기질 및 성격검사(TCI)의 하위척도를 이루는 4가지 기질과 3가지 성격을 쓰고, 각각에 대해 설명하시오. 7점\n(1) 4가지 기질\n(2) 3가지 성격", points:7, keypoints:[{label:"TCI 기질 4가지",min:4,pool:[{t:"자극추구(NS): 새롭고 보상적인 자극에 접근하고 탐색하는 경향",ac:["자극추구","NS"]},{t:"위험회피(HA): 처벌·위험 신호에 민감해 행동을 억제하는 경향",ac:["위험회피","HA"]},{t:"사회적 민감성(RD): 사회적 보상과 애착 신호에 민감한 경향",ac:["사회적 민감성","RD","보상의존"]},{t:"인내력(P): 보상이 지연되거나 어려움이 있어도 행동을 지속하는 경향",ac:["인내력","P"]}]},{label:"TCI 성격 3가지",min:3,pool:[{t:"자율성(SD): 목표에 맞게 자기행동을 조절하고 책임지는 능력",ac:["자율성","SD"]},{t:"연대감(CO): 타인을 수용하고 협력하는 능력",ac:["연대감","CO"]},{t:"자기초월(ST): 자신을 넘어 자연·우주와의 연결감을 경험하는 경향",ac:["자기초월","ST"]}]}], explain:"TCI는 비교적 자동적·정서적 반응경향인 네 기질과, 경험과 학습을 통해 성숙해지는 세 성격차원을 구분한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:6, origN:6, round:1, display:"제1회 6번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 10점(04, 09, 13년 기출)\n서울시 마포구에 사는 A씨는 30대 중반의 전업주부로, 결혼 후 직장을 그만두고 별다른 사회활동을 하지 않고 있다. 결혼 후 몇 년이 지나 남편이 회사 일을 이유로 거의 매일 늦게 귀가하고, 주말에도 집에 머무는 경우가 극히 드물었다. A씨는 자신의 사회경력으로부터도 자신이 꿈꾸던 결혼생활로부터도 멀어지게 되었다고 생각하면서, 자신이 사회와 무관한 존재, 더 이상 아무런 가치도 없는 존재로 전락해 버렸다는 생각을 떨칠 수 없었다. 그와 같은 생각은 날이 갈수록 더해졌고, 이제는 하루 중 거의 대부분의 시간을 우울한 기분으로 보내야 했다. 결국 A씨는 더 이상 아무런 의미가 없다는 생각에 자살할 결심을 하게 되었다.\n(1) 주요 우울증 삽화의 진단 기준에서 주요 우울증상을 3가지 기술하시오.\n①\n자살 위험도 평가\n자살 예방의 대처방법", points:10, keypoints:[{label:"주요우울삽화 증상 예 3가지",min:3,pool:[{t:"거의 매일 지속되는 우울한 기분",ac:["우울한 기분"]},{t:"거의 모든 활동에서 흥미나 즐거움의 현저한 감소",ac:["흥미 감소","즐거움 상실"]},{t:"유의한 체중·식욕 변화",ac:["체중 변화","식욕 변화"]},{t:"불면 또는 과수면",ac:["불면","과수면"]},{t:"정신운동 초조 또는 지체",ac:["정신운동"]},{t:"피로 또는 활력 상실",ac:["피로","활력 상실"]},{t:"무가치감 또는 과도한 죄책감",ac:["무가치감","죄책감"]},{t:"사고·집중력 저하 또는 우유부단",ac:["집중력 저하","우유부단"]},{t:"반복되는 죽음 생각·자살사고 또는 시도",ac:["자살사고","죽음 생각"]}]},{label:"자살위험 평가",min:3,pool:[{t:"현재 자살사고와 의도를 직접 확인한다",ac:["자살 의도","자살사고"]},{t:"구체적 계획·수단 접근성·준비행동·과거 시도를 평가한다",ac:["자살 계획","수단 접근","과거 시도"]},{t:"보호요인과 지지체계, 현재 혼자 있는지와 즉각적 안전을 평가한다",ac:["보호요인","지지체계","안전 평가"]}]},{label:"안전조치",min:3,pool:[{t:"고위험이면 혼자 두지 않고 안전한 환경을 확보한다",ac:["혼자 두지 않음","안전 확보"]},{t:"동의와 법적·윤리적 범위에서 가족·지지자와 연결한다",ac:["가족에게 알림","지지자 연결"]},{t:"정신건강의학과·응급실·위기서비스 등 전문기관으로 즉시 연계한다",ac:["응급실","전문기관 연계","위기서비스"]}]}], explain:"사례에서는 주요우울삽화 증상과 함께 구체적 자살 결심이 제시되어 있으므로 진단문항보다 안전평가가 우선이다. 자살사고·계획·수단·과거 시도와 보호요인을 직접 확인하고 고위험이면 즉각적인 보호와 전문서비스 연계를 시행한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:7, origN:7, round:1, display:"제1회 7번", verified:true, q:"상담자의 윤리적 책임에는 내담자와 이중관계를 맺지 않는 것이 있다. 이중관계의 의미와 이를 피해야 하는 이유에 대해 구체적으로 예를 들어 설명하시오. 5점\n이중관계 의미:\n이를 피해야 하는 이유:\n구체적인 예:", points:5, keypoints:[{label:"이중관계 의미",min:1,pool:[{t:"상담관계 외에 거래·친교·사업·성적 관계 등 다른 역할관계를 동시에 맺는 것",ac:["이중관계","다중관계"]}]},{label:"피해야 하는 이유",min:3,pool:[{t:"권력차 때문에 내담자 착취나 부당한 영향 위험이 생길 수 있다",ac:["착취 위험","권력차"]},{t:"객관적 판단과 치료적 경계가 흐려져 상담효과가 손상될 수 있다",ac:["경계 손상","객관성 저하"]},{t:"전이·역전이 및 이해충돌이 심화될 수 있다",ac:["전이 역전이","이해충돌"]}]}], explain:"이중·다중관계가 모두 자동으로 비윤리적인 것은 아니지만, 상담자의 영향력과 권력차 때문에 착취·이해충돌·전문적 판단 손상 위험이 크면 피해야 한다. 성적 관계와 같은 중대한 경계침해는 특히 금지된다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “이중관계는 모두 피해야 한다”는 표현을 위험성과 윤리적 판단 중심으로 정교화."] },

{ level:2, y:2018, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"단기상담에 적합한 내담자의 특성 4가지를 기술하시오. 4점(15년 기출)", points:4, keypoints:[{label:"단기상담 적합 특성 4가지",min:4,pool:[{t:"주호소가 비교적 구체적이고 범위가 제한되어 있다",ac:["구체적 문제","제한된 문제"]},{t:"전반적 기능과 자아강도가 비교적 양호하다",ac:["기능 양호","자아강도"]},{t:"변화동기와 상담목표가 분명하다",ac:["변화동기","목표 명확"]},{t:"사회적 지지체계가 있다",ac:["사회적 지지"]},{t:"문제가 발달적·상황적 적응과 관련되어 있다",ac:["발달적 문제","상황적 문제"]}]}], explain:"단기상담은 문제 초점이 분명하고 전반적 기능이 유지되며 변화동기와 지지체계가 있는 내담자에게 더 적합하다. 심각하고 만성적인 성격병리나 복합위기는 더 긴 평가와 개입이 필요할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"지능을 평가할 때의 주요쟁점으로 임상적 접근과 개념적 접근에 대해 설명하시오. 6점\n임상적 접근\n개념적 접근", points:6, keypoints:[{label:"임상적 접근",min:2,pool:[{t:"검사점수와 실제 수행을 통해 지능을 측정·기술하는 실용적 접근",ac:["임상적 접근","검사도구"]},{t:"지능을 측정 가능한 능력으로 보고 개인차 평가와 예측에 초점을 둔다",ac:["개인차","측정 가능"]}]},{label:"개념적 접근",min:2,pool:[{t:"지능이 무엇인지 이론적으로 정의하고 구성요소와 구조를 연구하는 접근",ac:["개념적 접근","지능 정의"]},{t:"지능을 가설적 구성개념으로 보고 이론모형과 분석방법에 초점을 둔다",ac:["구성개념","이론모형"]}]}], explain:"임상적 접근은 실제 검사로 지능을 어떻게 측정하고 해석할지에 초점을 두고, 개념적 접근은 지능의 본질과 구조를 이론적으로 정의하는 데 초점을 둔다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"인간중심치료에서 로저스(Rogers)가 제시한 내담자의 긍정적 성격변화를 위한 치료의 필요충분조건을 5가지 쓰시오. 5점", points:5, keypoints:[{label:"Rogers 변화조건 5가지",min:5,pool:[{t:"치료자와 내담자가 심리적 접촉 상태에 있다",ac:["심리적 접촉"]},{t:"내담자가 불일치·취약·불안 상태에 있다",ac:["내담자 불일치"]},{t:"치료자가 관계에서 일치성·진실성을 보인다",ac:["일치성","진실성"]},{t:"치료자가 내담자에게 무조건적 긍정적 존중을 경험한다",ac:["무조건적 긍정적 존중"]},{t:"치료자가 내담자의 내적 참조틀을 공감적으로 이해한다",ac:["공감적 이해"]},{t:"치료자의 공감과 긍정적 존중이 최소한 어느 정도 내담자에게 전달된다",ac:["전달"]}]}], explain:"Rogers는 성격변화를 위한 여섯 조건을 제시했다. 문항이 5가지를 요구하므로 그중 다섯 가지를 정확히 쓰면 되지만, 완전한 이해를 위해 여섯 조건을 모두 제시한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:11, origN:11, round:1, display:"제1회 11번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점(06, 13년 기출)\nA군은 만 7세 4개월로 올해 대구에 있는 00초등학교에 갓 입학하였다. A군은 초등학교에 입학하기 이전 유치원 선생님의 보살핌으로 별다른 문제를 보이지 않았었다. 그러나 초등학교에 입학하면서 수업에 집중하지 못한 채 수업 시간 중에도 돌아다니는 모습을 보였고 학업성과도 저조한 것으로 나타났다. 또한, 같은 반 아이들도 A군에게 가깝게 다가가기를 거부하였다. A군의 어머니는 A군의 특이한 성향을 의식하여 그동안 어느 정도 과잉보호를 한 점을 인정하였다.\n다음은 A군에 대한 KEDI-WISC 프로파일이다. 이를 토대로 임상심리사가 할 수 있는 자문이나 치료적 개입에 대한 조언을 5가지 기술하시오.\n하위검사명\n평가치\n하위검사명\n평가치\n상식\n3\n빠진 곳 찾기\n6\n공통성\n8\n기호쓰기\n6\n산수\n4\n차례 맞추기\n6\n어휘\n9\n토막 짜기\n9\n이해\n9\n모양 맞추기\n8\n숫자\n6\n미로(보충)\n7\n언어성 IQ : 79 동작성 IQ : 78\n전체 IQ : 76", points:5, keypoints:[{label:"평가·자문 포인트 5가지",min:5,pool:[{t:"IQ 76은 경계선 범위의 인지기능 가능성을 시사하므로 학업·적응기능을 추가평가한다",ac:["경계선 지능","적응기능 평가"]},{t:"주의집중·과잉행동 문제는 ADHD 가능성을 가설로 두고 다정보원 평가한다",ac:["ADHD","다정보원 평가"]},{t:"학업저조는 학습장애 여부를 학업성취검사와 발달력으로 평가한다",ac:["학습장애","학업성취검사"]},{t:"진단이 확인되면 행동중재·학교환경 조정과 필요 시 약물평가를 연계한다",ac:["행동치료","환경 조정","약물평가"]},{t:"부모의 과잉보호와 또래관계를 고려해 부모훈련·사회기술지원 등을 제공한다",ac:["부모훈련","사회기술"]}]}], explain:"지능검사 하위점수만으로 ADHD나 학습장애를 진단할 수 없다. 사례의 행동관찰과 낮은 전반적 지적수준을 바탕으로 ADHD·학습문제를 가설로 두고, 부모·교사 보고와 학업성취·적응기능을 함께 평가한 뒤 개입을 결정한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 WISC 하위점수만으로 ADHD/학습장애를 다소 단정적으로 연결함. 진단가설·추가평가 수준으로 완화."] },

{ level:2, y:2018, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"바이너(Weiner)는 심리검사를 객관적 검사와 투사적 검사로 구분하고 로샤검사(Rorschach Test)를 투사적 검사로 분류하는 것에 대해 불만을 제기하였다. 그 이유를 2가지 기술하시오. 4점", points:4, keypoints:[{label:"Weiner의 비판 이유 2가지",min:2,pool:[{t:"로샤 반응은 모두 투사로 설명되는 것이 아니며 형태질·결정인 등 비투사적 구조특성도 체계적으로 해석한다",ac:["비투사 반응","비투사적 특성"]},{t:"“투사검사”라는 명칭은 로샤를 전적으로 주관적이고 비표준화된 검사처럼 오해하게 만들 수 있다",ac:["주관적 검사 오명","투사검사 명칭"]}]}], explain:"Weiner는 로샤를 단순한 투사검사로만 보는 데 반대했다. 로샤에는 투사적 의미뿐 아니라 반응의 지각·인지적 구조를 표준화해 해석하는 요소가 있고, “투사검사”라는 명칭이 검사 전체를 지나치게 주관적인 것으로 오해하게 만들 수 있기 때문이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"집단상담의 집단과정에서 집단구성 시 현실적 고려사항을 5가지 쓰시오. 5점", points:5, keypoints:[{label:"집단구성 현실적 고려 5가지",min:5,pool:[{t:"집단목표와 구성원 특성에 따른 동질·이질성 결정",ac:["동질집단","이질집단"]},{t:"집단 크기 결정",ac:["집단 크기"]},{t:"회기 빈도·시간·전체 기간 결정",ac:["회기 빈도","회기 시간"]},{t:"개방집단 또는 폐쇄집단 여부 결정",ac:["개방집단","폐쇄집단"]},{t:"안전하고 사생활이 보장되는 장소와 좌석배치 결정",ac:["장소","좌석배치"]}]}], explain:"집단구성에서는 치료목표와 대상 특성을 먼저 고려하고, 구성원의 동질성, 인원수, 회기 구조, 개방성, 물리적 환경을 현실적으로 설계해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"벡(Beck)의 인지적 오류 6가지를 쓰고, 각각에 대해 설명 6점(07, 15, 18년 기출)", points:6, keypoints:[{label:"인지적 오류 6가지",min:6,pool:[{t:"임의적 추론: 충분한 근거 없이 부정적 결론을 내림",ac:["임의적 추론"]},{t:"과도한 일반화: 한두 사건을 광범위한 규칙으로 확대함",ac:["과도한 일반화","과잉일반화"]},{t:"이분법적 사고: 중간 가능성을 배제하고 흑백으로 판단함",ac:["이분법적 사고","흑백논리"]},{t:"재앙화: 가능한 결과를 최악의 재앙으로 과장함",ac:["재앙화"]},{t:"개인화: 자신과 직접 관련 없는 사건을 자신 탓으로 돌림",ac:["개인화"]},{t:"선택적 추상화: 전체 맥락에서 일부 부정적 정보만 선택해 결론냄",ac:["선택적 추상화"]}]}], explain:"인지적 오류는 정보처리 과정에서 반복되는 편향이다. 각 명칭만 암기하기보다 어떤 방식으로 증거를 왜곡하거나 선택하는지를 함께 설명해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"정신과 병동에 입원해 있는 A씨는 만성 조현병 환자이다. 임상심리사는 이 환자에게 인사하는 기술을 가르치고자 한다. 이를 위한 토큰경제(Token Economy)의 활용방법을 5단계로 구분하여 설명하시오. 5점", points:5, keypoints:[{label:"토큰경제 활용 단계 5가지",min:5,pool:[{t:"구체적이고 관찰 가능한 표적행동을 선정한다",ac:["표적행동 선정"]},{t:"표적행동의 기초선과 빈도를 측정한다",ac:["기초선","행동 측정"]},{t:"토큰으로 교환할 수 있는 강화물을 선정한다",ac:["강화물 선정"]},{t:"어떤 행동에 몇 토큰, 어떤 강화물에 몇 토큰인지 교환규칙을 정한다",ac:["교환규칙","상관표"]},{t:"행동변화와 토큰 사용을 기록하고 필요에 따라 계획을 조정한다",ac:["진전 기록","계획 조정"]}]}], explain:"토큰경제는 목표행동을 명확히 정의하고, 그 행동 직후 토큰을 제공한 뒤 토큰을 실제 강화물과 교환하도록 하는 체계다. 목표·강화물·교환규칙·기록이 일관되어야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점\n고등학교 3학년인 A양은 자신의 키에 비해 몸무게가 현저히 덜 나가는 상태임에도 불구하고 자신은 더욱 날씬해져야 한다고 생각하고 있으며 실제로 음식을 먹고 싶은 마음도 없다. A양의 부모는 걱정스러운 마음에 A양에게 억지로 음식을 권하기도 하나, A양은 먹는 둥 마는 둥하다가 자신의 방으로 돌아와서는 토해내는 경우가 대부분이다. A양은 집에서는 물론 밖에서도 음식 먹는 자리를 피했으며 그로 인해 자주 어지러움과 피곤함을 느끼고 최근 몇 달 동안 월경도 멈춘 상태이다. A양은 병원에 가 보자는 부모의 걱정이 부담스러워 자신의 신체적인 문제를 일절 말하지 않고 있으며 점점 더 야위어가는 자신의 모습에 오히려 만족스러워하고 있다.\n보기에는 A양의 증상을 토대로 유추 가능한 진단명을 쓰고, 그 구체적인 진단기준을 기술하시오.\n(1) 진단명:\n(2) 진단기준", points:6, keypoints:[{label:"진단명",min:1,pool:[{t:"신경성 식욕부진증",ac:["신경성 식욕부진증","anorexia nervosa"]}]},{label:"핵심 진단기준",min:3,pool:[{t:"필요량보다 에너지 섭취를 제한해 연령·성·발달수준·신체건강에 비해 현저한 저체중이 된다",ac:["현저한 저체중","섭취 제한"]},{t:"체중 증가·비만에 대한 극심한 두려움 또는 체중 증가를 방해하는 지속적 행동이 있다",ac:["체중 증가 두려움","체중 증가 방해"]},{t:"체중·체형 경험의 왜곡, 자기평가에 체중·체형이 과도한 영향, 또는 저체중의 심각성에 대한 인식 부족이 있다",ac:["체형 왜곡","저체중 심각성 인식 부족"]}]}], explain:"사례는 현저한 저체중, 체중 증가에 대한 지속적 회피행동, 체형에 대한 왜곡된 자기평가를 보여 신경성 식욕부진증을 시사한다. 무월경은 흔한 신체적 결과일 수 있지만 DSM-5에서는 필수 진단기준이 아니다.", source:"임상심리사 2급 실기 기출자료", review_notes:["DSM-5에서 무월경 기준이 삭제되었음을 반영."] },

{ level:2, y:2018, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"공포증 환자를 대상으로 체계적 둔감법을 실시하고자 한다. 체계적 둔감법의 3단계 과정을 순서대로 쓰고, 각 단계에 대해 간략히 설명하시오. 6점(09, 10, 15년 기출)", points:6, keypoints:[{label:"체계적 둔감법 3단계",min:3,pool:[{t:"이완훈련을 통해 불안과 양립하기 어려운 이완반응을 학습한다",ac:["이완훈련","근육이완"]},{t:"불안유발 자극을 낮은 수준부터 높은 수준까지 위계화한다",ac:["불안위계","위계목록"]},{t:"이완상태에서 위계의 낮은 항목부터 점진적으로 노출한다",ac:["점진적 노출","둔감화"]}]}], explain:"체계적 둔감법은 이완반응을 학습한 뒤 불안위계를 만들고, 낮은 불안자극부터 단계적으로 노출해 불안반응을 약화시키는 절차다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"어떤 환자에게 MMPI를 실시한 결과 L척도와 K척도의 T점수가 70 이상으로 높게 나타났다. 방어적 성향이 강하여 검사결과를 해석하기 어려울 정도였으나, 이 환자에게 심리검사는 꼭 필요한 것으로 판단되었다. 이때 임상심리사가 취할 수 있는 방법을 2가지로 구분하여 설명하시오. 4점 (20년 기출)", points:4, keypoints:[{label:"방어가 극단적일 때",min:1,pool:[{t:"프로파일의 타당성이 심하게 손상되면 임상척도 해석을 보류하고 재검사·추가평가를 고려한다",ac:["해석 보류","재검사"]}]},{label:"방어가 있으나 해석 가능할 때",min:1,pool:[{t:"방어적 반응양식을 명시하고 임상척도를 잠정적으로 해석하며 면담·다른 자료와 교차검증한다",ac:["잠정적 해석","방어 고려","교차검증"]}]}], explain:"L과 K가 매우 높으면 자신을 지나치게 긍정적으로 제시했을 가능성을 먼저 검토해야 한다. 타당도가 심하게 손상되면 프로파일 해석을 보류하고, 제한적으로 해석 가능하다면 방어성을 전제로 다른 평가자료와 교차검증한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:19, origN:1, round:3, display:"제3회 1번", verified:true, q:"엘리스(Ellis)가 제시한 비합리적인 신념을 5가지 쓰시오. 5점(12, 14년)", points:5, keypoints:[{label:"비합리적 신념 5가지",min:5,pool:[{t:"중요한 모든 사람에게 사랑과 인정을 받아야 한다",ac:["사랑과 인정"]},{t:"모든 면에서 유능하고 성공해야 가치가 있다",ac:["유능","성취"]},{t:"일이 원하는 대로 되지 않으면 끔찍하고 견딜 수 없다",ac:["끔찍함","견딜 수 없다"]},{t:"어려움과 책임을 직면하기보다 피하는 것이 더 쉽다",ac:["책임 회피","회피"]},{t:"스스로보다 더 강한 사람에게 의존해야 한다",ac:["의존"]},{t:"나쁜 사람은 반드시 비난·처벌받아야 한다",ac:["비난","처벌"]},{t:"과거 경험이 현재를 결정하며 바꾸기 어렵다",ac:["과거 결정론"]}]}], explain:"Ellis는 당위적 요구, 파국화, 낮은 좌절내성, 자기·타인에 대한 전면평가 등을 비합리적 신념의 핵심으로 보았다. 문항에서는 대표 예시 다섯 가지를 정확히 제시하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:20, origN:2, round:3, display:"제3회 2번", verified:true, q:"벡(Beck)의 인지적 오류 4가지를 쓰고, 각각에 대해 설명하시오. 8점(07, 15, 18년 기출)", points:8, keypoints:[{label:"인지적 오류 4가지",min:4,pool:[{t:"임의적 추론: 충분한 근거 없이 결론을 내림",ac:["임의적 추론"]},{t:"과도한 일반화: 제한된 사건을 광범위한 규칙으로 확대함",ac:["과도한 일반화","과잉일반화"]},{t:"이분법적 사고: 중간범주 없이 흑백으로 판단함",ac:["이분법적 사고","흑백논리"]},{t:"재앙화: 미래 결과를 최악으로 과장함",ac:["재앙화"]},{t:"개인화: 외부사건을 부당하게 자신과 연결함",ac:["개인화"]},{t:"선택적 추상화: 전체 맥락 중 일부 정보만 선택함",ac:["선택적 추상화"]}]}], explain:"인지적 오류는 자동적 사고에 반복되는 정보처리 편향이다. 문제에서 네 가지를 요구하므로 여섯 예시 중 네 가지를 명칭과 의미가 일치하도록 쓰면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:21, origN:3, round:3, display:"제3회 3번", verified:true, q:"자기표현훈련이 필요한 내담자의 특성을 5가지 쓰고, 자기표현훈련을 통해 내담자가 인식해야 할 사항을 2가지 쓰시오. 9점(10년 기출)\n(1) 자기표현훈련이 필요한 내담자의 특성\n(2) 자기표현훈련을 통해 내담자가 인식해야 할 사항", points:9, keypoints:[{label:"자기표현훈련이 필요한 특성 5가지",min:5,pool:[{t:"타인의 시선을 지나치게 의식해 자기의견 표현을 피한다",ac:["시선 회피","의견 표현 회피"]},{t:"타인의 잘못이나 부당한 요구를 지적하기 어렵다",ac:["거절 어려움","잘못 지적 어려움"]},{t:"불만·욕구·감정 표현을 주저한다",ac:["불만 표현 주저","감정 표현 어려움"]},{t:"지배적인 사람에게 반대의견을 말하지 못한다",ac:["반박 못함","반대의견 어려움"]},{t:"지나치게 사과하거나 자기비난을 감수한다",ac:["지나친 사과","자기비난"]}]},{label:"인식해야 할 권리 2가지",min:2,pool:[{t:"자신의 생각·감정·욕구를 표현할 권리가 있다",ac:["표현할 권리"]},{t:"스스로 선택하고 결정할 권리가 있다",ac:["결정할 권리"]},{t:"부당한 요구를 거절하고 경계를 지킬 권리가 있다",ac:["거절할 권리","경계"]},{t:"타인의 권리를 침해하지 않는 범위에서 자신의 권리를 주장할 수 있다",ac:["기본 권리"]}]}], explain:"자기표현훈련은 수동적 또는 공격적 반응 대신 자신과 타인의 권리를 모두 존중하면서 생각·감정·요구를 직접 표현하도록 돕는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:22, origN:4, round:3, display:"제3회 4번", verified:true, q:"인간중심상담에서 로저스(Rogers)가 강조하는 치료자의 특성을 3가지 쓰시오. 3점\n(08, 10, 14, 17년 기출)", points:3, keypoints:[{label:"Rogers 치료자 특성 3가지",min:3,pool:[{t:"무조건적 긍정적 존중",ac:["무조건적 긍정적 존중","수용"]},{t:"공감적 이해",ac:["공감적 이해","공감"]},{t:"일치성·진실성",ac:["일치성","진실성"]}]}], explain:"인간중심상담에서 치료자는 내담자를 조건 없이 존중하고, 내담자의 경험세계를 공감적으로 이해하며, 관계 안에서 가식 없이 진실하게 존재해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:23, origN:5, round:3, display:"제3회 5번", verified:true, q:"해석의 기법과 상담과정 간의 관계에서 상담초기, 중기, 후기의 해석기법을 각 단계별로 쓰시오. 3점", points:3, keypoints:[{label:"상담단계별 해석기법",min:3,pool:[{t:"상담초기에는 감정반영 등 비교적 덜 위협적인 반응을 중심으로 한다",ac:["초기 감정반영","감정의 반영"]},{t:"상담중기에는 명료화와 직면을 활용해 패턴을 탐색한다",ac:["중기 명료화","중기 직면"]},{t:"상담후기에는 관계와 반복패턴에 대한 보다 구체적인 해석을 제공할 수 있다",ac:["후기 해석","구체적 해석"]}]}], explain:"해석은 치료동맹과 내담자의 준비도에 맞춰 점진적으로 깊어져야 한다. 초기에는 반영과 명료화가 중심이고, 충분한 자료와 관계가 형성된 뒤 직면과 구체적 해석을 사용한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["단계 구분은 교재적 설명이며 모든 상담에서 기계적으로 동일한 순서를 적용하는 것은 아님."] },

{ level:2, y:2018, n:24, origN:6, round:3, display:"제3회 6번", verified:true, q:"내담자의 반응을 해석할 때의 주의사항을 5가지 쓰시오. 5점(06, 08, 11, 15년 기출)", points:5, keypoints:[{label:"해석 시 주의사항 5가지",min:5,pool:[{t:"내담자가 받아들일 준비가 되었을 때 조심스럽게 제시한다",ac:["준비도"]},{t:"충분한 자료와 내담자 이해가 형성되기 전에 성급히 해석하지 않는다",ac:["성급한 해석 금지"]},{t:"해석을 단정적 사실이 아니라 가설로 제시한다",ac:["가설로 제시","단정 금지"]},{t:"내담자의 반응을 확인하고 이해 수준에 맞춘다",ac:["반응 확인"]},{t:"가능하면 내담자가 스스로 의미와 패턴을 발견하도록 돕는다",ac:["스스로 해석","자기발견"]}]}], explain:"좋은 해석은 정확성뿐 아니라 시기와 전달방식이 중요하다. 충분한 자료와 치료관계를 바탕으로 가설적으로 제시하고, 내담자의 반응을 확인하며 자기이해로 연결해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:25, origN:7, round:3, display:"제3회 7번", verified:true, q:"오포드(Orford)가 제시한 자조집단의 1차적 기능을 5가지 쓰시오. 5점", points:5, keypoints:[{label:"자조집단 1차적 기능 5가지",min:5,pool:[{t:"문제해결에 실제적 도움을 제공한다",ac:["문제 해결 도움"]},{t:"변화와 문제해결에 대한 동기를 높인다",ac:["동기부여"]},{t:"정서적 지지를 제공한다",ac:["정서적 지지"]},{t:"경험에 기반한 중요정보를 교환한다",ac:["정보 제공"]},{t:"사회적 관계와 소속감을 제공한다",ac:["사교관계","소속감"]},{t:"구성원이 다른 사람을 도울 기회를 제공한다",ac:["돕는 기회","상호원조"]}]}], explain:"자조집단은 비슷한 경험을 가진 사람들이 상호원조를 통해 정보, 정서적 지지, 문제해결 도움, 변화동기와 사회적 관계를 제공하는 데 핵심 기능이 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:26, origN:8, round:3, display:"제3회 8번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 3점(03, 05, 12, 14년 기출)\n“이건 정말 믿을 수가 없어요. 선생님, 지난번 상담을 받을 때 남편이 집에 일찍 들어오겠다고 약속했었잖아요?\n그런데 정말로 남편이 제시간에 맞춰 집에 오더라고요. 그렇게 약속을 잘 지킬 줄 몰랐는데 정말 깜짝 놀랐다니까요.”\n보기에서 내담자의 말에 대한 상담자의 반영적 반응을 적절히 제시하시오.:\n보기에서 내담자의 말에 대한 상담자의 공감적 반응을 적절히 제시하시오.:", points:3, keypoints:[{label:"반영적 반응",min:1,pool:[{t:"남편이 약속을 실제로 지킨 것이 예상 밖이라 많이 놀랐다는 감정을 반영한다",ac:["예상 밖이라 놀랐","무척 놀랐"]}]},{label:"공감적 반응",min:1,pool:[{t:"약속을 지킨 남편을 보며 놀람과 함께 안도·기쁨도 느꼈을 것 같다고 내담자의 경험을 이해해 표현한다",ac:["안도","기쁨","마음이 놓"]}]}], explain:"반영은 내담자가 표현한 핵심 감정과 의미를 정확히 되돌려 주는 반응이고, 공감은 그 경험의 맥락과 정서를 한 단계 깊게 이해해 표현하는 것이다. 상담자 자신의 기쁨을 앞세우기보다 내담자의 경험에 초점을 맞춘다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료 공감 예시의 “상담자인 저도 정말 놀랍고 기쁘네요”는 상담자 자기감정 중심이므로 수정."] },

{ level:2, y:2018, n:27, origN:9, round:3, display:"제3회 9번", verified:true, q:"행동치료기법 중 토큰 이코노미(Token Economy)의 장점을 3가지 쓰시오. 6점(12년 기출)", points:6, keypoints:[{label:"토큰경제 장점 3가지",min:3,pool:[{t:"목표행동 직후 토큰을 줄 수 있어 강화 지연을 줄인다",ac:["즉각적 강화","강화 지연 예방"]},{t:"토큰을 여러 강화물과 교환할 수 있어 강화효과와 선택권을 높인다",ac:["다양한 강화물","교환 가능"]},{t:"가볍고 표준화된 토큰을 사용해 제공·기록·관리하기 쉽다",ac:["관리 용이","기록 용이"]},{t:"토큰을 모아 더 큰 강화물로 교환할 수 있어 행동유지를 돕는다",ac:["토큰 저장","누적"]}]}], explain:"토큰은 즉시 제공할 수 있고 여러 후속 강화물과 교환 가능해 실제 강화물 제공이 늦어지는 문제를 줄인다. 체계적인 기록과 관리가 쉬운 것도 장점이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:28, origN:10, round:3, display:"제3회 10번", verified:true, q:"순환성장애(Cyclothymic Disorder)의 진단기준을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"순환성장애 진단기준 3가지",min:3,pool:[{t:"성인은 최소 2년, 아동·청소년은 최소 1년 동안 경조증 기준에는 못 미치는 경조증상과 주요우울삽화 기준에는 못 미치는 우울증상이 반복된다",ac:["2년","1년","경조증상","우울증상"]},{t:"해당 기간의 적어도 절반 동안 증상이 있고 연속 2개월 이상 증상이 없었던 기간이 없다",ac:["절반 이상","2개월"]},{t:"주요우울삽화·조증삽화·경조증삽화의 전체 기준을 충족한 적이 없다",ac:["주요우울삽화 없음","조증삽화 없음","경조증삽화 없음"]}]}], explain:"순환성장애는 완전한 조증·경조증·주요우울삽화에는 못 미치는 기분증상이 만성적으로 반복되는 상태다. 성인에서는 2년, 아동·청소년에서는 1년의 지속기간이 요구되며 증상이 기간의 절반 이상 존재해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:29, origN:11, round:3, display:"제3회 11번", verified:true, q:"다음은 38세 미혼 여성의 다면적인성검사(MMPI) 결과이다. 이를 토대로 수검자의 임상적 특징, 가능한 진단명, 주로 사용하는 방어기제에 대해 간략히 기술하시오. 8점(12년 기출)\nL(76) F(42) K(80) 1(85) 2(60) 3(78) 4(62) 5(42) 6(53) 7(60) 8(56) 9(42) 0(50)\n(1) 임상적 특징\n타당도 척도의 ‘V’ 코드유형:\n임상척도:\n(2) 진단명:\n(3) 방어기제:", points:8, keypoints:[{label:"프로파일 특징",min:3,pool:[{t:"L과 K가 높고 F가 낮아 자신을 지나치게 긍정적으로 보이려는 방어적 반응양식을 시사한다",ac:["L K 상승","F 낮음","방어적"]},{t:"1(Hs)과 3(Hy)가 높아 신체증상 호소와 심리적 갈등의 신체화 가능성을 시사한다",ac:["1-3 상승","신체화"]},{t:"심리적 문제를 인정하기보다 억압·부인하고 타인의 관심을 구하는 양상이 나타날 수 있다",ac:["부인","억압","관심 욕구"]}]},{label:"진단적 해석",min:1,pool:[{t:"전환증상장애나 신체증상 관련 문제를 감별할 수 있으나 MMPI 코드만으로 진단하지 않는다",ac:["전환장애 감별","신체증상장애 감별"]}]},{label:"방어기제",min:2,pool:[{t:"부인",ac:["부인"]},{t:"억압",ac:["억압"]}]}], explain:"1-3 상승과 방어적인 타당도척도는 신체적 호소와 심리적 문제의 최소화 가능성을 시사할 수 있다. 다만 MMPI 코드유형은 진단명이 아니므로 전환장애를 확정하지 않고 증상과 의학적 평가를 통해 감별해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “진단명: 전환장애” 단정은 진단가설 수준으로 완화."] },

{ level:2, y:2018, n:30, origN:12, round:3, display:"제3회 12번", verified:true, q:"MMPI-2의 성격병리 5요인척도(PSY-5척도)를 쓰시오. 5점", points:5, keypoints:[{label:"PSY-5 척도 5가지",min:5,pool:[{t:"공격성(AGGR)",ac:["공격성","AGGR"]},{t:"정신증적 경험(PSYC)",ac:["정신증","PSYC"]},{t:"통제결여(DISC)",ac:["통제결여","DISC"]},{t:"부정적 정서성/신경증(NEGE)",ac:["부정적 정서성","NEGE"]},{t:"내향성/낮은 긍정적 정서성(INTR)",ac:["내향성","INTR"]}]}], explain:"MMPI-2 PSY-5는 공격성, 정신증적 경험, 통제결여, 부정적 정서성, 내향성/낮은 긍정적 정서성의 다섯 성격병리 차원을 평가한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:31, origN:13, round:3, display:"제3회 13번", verified:true, q:"내담자의 능력을 평가하는 지능검사를 시행할 때 내담자와 라포(Rapport)를 형성하는 것이 중요하다. 라포형성의 구체적인 방법을 4가지 기술하시오. 4점", points:4, keypoints:[{label:"라포형성 방법 4가지",min:4,pool:[{t:"검사의 목적과 절차를 이해하기 쉽게 설명해 불확실성을 줄인다",ac:["목적 설명","절차 설명"]},{t:"불안하거나 긴장한 수검자가 편안히 과제에 집중하도록 안정시킨다",ac:["불안 완화","안심"]},{t:"최선을 다하도록 격려하되 정답에 대한 단서나 과도한 피드백은 주지 않는다",ac:["격려","최선"]},{t:"차분하고 자연스럽게 과제를 제시하고 소검사 전환을 매끄럽게 한다",ac:["차분한 제시","소검사 연결"]},{t:"수검자의 흥미와 협조를 유지하되 표준화 절차를 지킨다",ac:["관심 유지","표준화"]}]}], explain:"지능검사의 라포는 친밀감 자체보다 수검자가 불필요한 불안을 줄이고 최선을 다하면서도 표준화된 조건을 유지하도록 돕는 것이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:32, origN:14, round:3, display:"제3회 14번", verified:true, q:"웩슬러지능검사의 양적 분석에 포함되어야 할 내용을 3가지 쓰시오. 6점(11, 13년 기출)\nK-WISC(구판)\nK-WISC-IV", points:6, keypoints:[{label:"웩슬러 양적 분석 3가지",min:3,pool:[{t:"전체지능 및 주요 지표점수를 확인한다",ac:["전체지능","지표점수"]},{t:"지표점수 간 유의한 차이와 강점·약점을 비교한다",ac:["지표 간 비교","강점 약점"]},{t:"소검사 환산점수의 분산과 상대적 강·약점을 분석한다",ac:["소검사 분산","소검사 프로파일"]},{t:"필요 시 병전기능 추정치와 현재수행을 비교한다",ac:["병전지능","병전기능"]}]}], explain:"현행 웩슬러 검사의 양적 분석은 전체지능과 지표점수, 지표 간 차이, 소검사 프로파일의 상대적 강·약점을 중심으로 한다. 구판의 VIQ-PIQ 비교는 현행판에서는 그대로 적용되지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 구판 K-WISC와 K-WISC-IV 설명을 현행 지표점수 중심으로 통합."] },

{ level:2, y:2018, n:33, origN:15, round:3, display:"제3회 15번", verified:true, q:"임상장면에서는 환자의 신경심리평가를 위해 종합심리검사인 풀배터리(Full Battery)를 실시한다. 이러한 풀배터리에는 보통 지능검사가 포함되는데, 풀배터리에 지능검사를 넣는 이유를 5가지 쓰시오. 5점", points:5, keypoints:[{label:"풀배터리에 지능검사를 포함하는 이유 5가지",min:5,pool:[{t:"전반적 인지능력과 현재 지적기능 수준을 파악한다",ac:["인지능력","지적기능"]},{t:"인지영역별 강점과 약점을 확인한다",ac:["강점 약점"]},{t:"주의·작업기억·처리속도 등 신경인지적 기능에 대한 기초자료를 제공한다",ac:["신경인지","작업기억","처리속도"]},{t:"다른 검사결과와 행동관찰을 해석할 기준점과 맥락을 제공한다",ac:["해석 기준","맥락"]},{t:"발달·학습·신경학적 문제와 정서적 문제의 감별가설을 세우는 데 도움을 준다",ac:["감별진단","신경학적 문제"]},{t:"치료·교육·재활 계획을 세우는 데 필요한 기능수준을 제공한다",ac:["치료계획","재활계획"]}]}], explain:"지능검사는 단순 IQ 산출보다 전반적 인지수준과 영역별 강·약점을 파악하고, 다른 검사와 행동관찰을 통합해 진단가설과 치료·재활 계획을 세우는 데 기초자료를 제공한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “성격적 특성 파악”은 지능검사의 직접 목적이 아니므로 채점 핵심에서 제외."] },

{ level:2, y:2018, n:34, origN:16, round:3, display:"제3회 16번", verified:true, q:"사회기술훈련을 집단으로 시행하는 경우의 장점을 3가지 쓰시오. 6점(08년 기출)", points:6, keypoints:[{label:"집단 사회기술훈련 장점 3가지",min:3,pool:[{t:"구성원끼리 실제 사회적 상호작용과 역할연습을 반복할 수 있다",ac:["상호작용 연습","역할연습"]},{t:"동료와 치료자로부터 즉각적인 피드백과 강화가 가능하다",ac:["피드백","강화"]},{t:"구성원끼리 모델링하고 서로 격려·도움받을 수 있다",ac:["모델링","상호지지"]},{t:"다양한 사람과 기술을 연습해 실제 생활로의 일반화를 촉진한다",ac:["일반화"]}]}], explain:"집단형 사회기술훈련은 실제 사람을 대상으로 반복연습하고 피드백·모델링·강화를 받을 수 있다는 점이 장점이다. 다양한 구성원과 연습하므로 일상생활로 일반화하기도 쉽다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2018, n:35, origN:17, round:3, display:"제3회 17번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 8점(04, 08년 기출)\n서울시 마포구의 00초등학교 5학년 학생인 김모양은 평소 또래 친구들과 어울리지 못하고 집단따돌림을 당하던 중\n7일 전 자신이 거주하는 곳에서 뛰어내려 스스로 목숨을 끊었다. 같은 학생들은 집단따돌림에 대한 가담여부를 떠나 김모양의 자살 소식을 듣고 실의에 잠겼으며 심지어 김모양의 죽음에 대해 죄책감까지 느끼게 되었다. 김모양의 담임선생님은 이러한 사실을 교장선생님께 전하였고 교장선생님은 아이들의 심리적 안정을 위해 임상심리사를 학교로 초대하였다.\n(1) 보기의 내용과 관련된 임상심리사의 주요역할 및 기능에 대해 기술하시오.\n(2) 임상심리사가 학생들을 도울 수 있는 방법을 구체적으로 4가지 기술하시오.", points:8, keypoints:[{label:"임상심리사의 주요 역할",min:3,pool:[{t:"학생들의 애도·불안·죄책감·외상반응을 평가하고 상담·위기개입을 제공한다",ac:["위기개입","상담"]},{t:"자살위험이 높은 학생을 선별해 즉시 안전평가와 전문기관 연계를 시행한다",ac:["자살위험 평가","고위험군 선별"]},{t:"교사·학교관리자에게 학생 반응과 대응원칙을 자문한다",ac:["교사 자문","학교 자문"]}]},{label:"구체적 지원방법 4가지",min:4,pool:[{t:"고위험·고통이 큰 학생에게 개별상담 및 안전계획을 제공한다",ac:["개별상담","안전계획"]},{t:"필요한 학생에게 집단적 애도·회복 지원을 제공하되 강제적 감정표출은 피한다",ac:["집단지원","애도지원"]},{t:"가족·교사에게 정상적 애도반응과 위험신호에 대한 정보를 제공한다",ac:["교육자료","위험신호 교육"]},{t:"지속적 치료가 필요한 학생을 지역 정신건강·의료기관과 연계한다",ac:["지역사회 연계","의료기관 연계"]}]}], explain:"학생 자살 이후 학교 개입에서는 모든 학생을 동일하게 치료하기보다 자연스러운 애도반응을 지지하면서 고위험군을 선별하는 것이 중요하다. 모방위험과 죄책감, 자살사고를 평가하고 필요한 학생만 집중 치료로 연결한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “정신역동·행동·CBT·인간중심치료 활용” 나열보다 사후개입(postvention)과 안전평가 중심으로 수정."] },

{ level:2, y:2018, n:36, origN:18, round:3, display:"제3회 18번", verified:true, q:"성폭행 사건과 관련하여 그 피해자로 지목된 한 여성이 수사기관에 의해 성폭력상담소에 의뢰되었다. 그러나 정작 피해자는 자신의 성 피해 사실을 부인하고 있다. 전문상담사로서 자문을 한다고 가정할 때 적절한 자문내용 및 조치방법을 기술하시오. 5점\n(1) 자문내용\n(2) 조치방법", points:5, keypoints:[{label:"자문·조치 핵심 5가지",min:5,pool:[{t:"피해 사실을 인정하도록 강요하거나 추궁하지 않고 현재의 부정·혼란을 존중한다",ac:["강요하지 않음","부정 존중"]},{t:"피해자의 신체적 안전과 즉각적 의료·법적 필요를 먼저 확인한다",ac:["안전 확인","의료적 필요"]},{t:"상담의 선택권과 속도, 주도권을 가능한 한 피해자에게 돌려준다",ac:["선택권","주도권"]},{t:"감정을 말하도록 압박하지 않고 표현할 준비가 되었을 때 수용적으로 돕는다",ac:["감정표현 강요 금지","수용"]},{t:"신뢰관계를 형성하고 필요한 전문기관·법률·의료 지원 정보를 제공한다",ac:["치료관계","전문기관 연계"]}]}], explain:"성폭력 피해 직후 부정은 여러 가능한 반응 중 하나이며 이를 곧바로 특정 단계로 단정하거나 사실인정을 강요해서는 안 된다. 안전과 선택권을 우선하고, 피해자가 준비된 범위에서 경험과 감정을 다루며 필요한 지원서비스에 연결한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “부정단계”, “위기개입은 유일한 개입”은 지나친 단정이므로 수정."] },

{ level:2, y:2019, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"성인을 대상으로 한 심리치료와 구분되는 아동심리치료의 특징을 5가지 기술하시오. 5점", points:5, keypoints:[{label:"아동심리치료 특징 5가지",min:5,pool:[{t:"언어·인지·정서 발달수준에 맞춰 개입한다",ac:["발달수준"]},{t:"초기 라포와 치료동기 형성이 특히 중요하다",ac:["라포","치료동기"]},{t:"놀이·미술·활동 등 비언어적 매체를 활용한다",ac:["놀이","미술"]},{t:"가족·학교·발달환경을 함께 고려하는 통합적 접근이 필요하다",ac:["통합적 접근","환경"]},{t:"부모·교사 등 보호자와 협력하는 경우가 많다",ac:["부모 협조","교사 협조"]}]}], explain:"아동치료는 성인보다 발달수준과 환경의 영향이 크고 언어적 자기보고가 제한될 수 있어 놀이·미술 등의 매체와 부모·교사 협력이 중요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:2, origN:2, round:1, display:"제1회 2번", verified:true, q:"다음은 상담장면에서 상담자가 내담자에 대한 비밀보장을 할 수 없는 예외적인 경우에 해당한다. 각각의 질문에 답하시오. 6점\n(1) 내담자의 자살계획을 알게 된 경우 대처방법을 3가지 쓰시오.\n(2) 내담자의 타살계획을 알게 된 경우 대처방법을 3가지 쓰시오.", points:6, keypoints:[{label:"자살위험 시 조치 3가지",min:3,pool:[{t:"자살사고·계획·수단·준비행동·과거 시도 등 위험도를 즉시 평가한다",ac:["자살위험 평가","자살계획"]},{t:"고위험이면 혼자 두지 않고 위험수단 접근을 제한해 안전을 확보한다",ac:["혼자 두지 않음","수단 제한"]},{t:"필요한 범위에서 가족·지지자에게 알리고 응급·전문서비스에 연계한다",ac:["가족에게 알림","응급 연계"]}]},{label:"타해위험 시 조치 3가지",min:3,pool:[{t:"비밀보장의 한계와 예외를 설명하고 타해의 구체성·의도·수단·접근성을 평가한다",ac:["비밀보장 예외","타해위험 평가"]},{t:"법적·윤리적 기준에 따라 잠재적 피해자 보호에 필요한 조치를 취한다",ac:["피해자 보호"]},{t:"경찰·응급의료·정신건강 전문가 등 적절한 기관에 즉시 연계한다",ac:["경찰","전문기관 연계"]}]}], explain:"자살·타해 계획은 비밀보장보다 안전이 우선되는 대표적 예외다. 다만 무조건적 공개가 아니라 위험의 심각성, 법적 의무, 최소필요정보 원칙에 따라 보호조치를 시행한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["구체적 통지의무는 관할 법·윤리규정에 따라 달라질 수 있어 “항상 잠재적 피해자에게 알린다”로 단정하지 않음."] },

{ level:2, y:2019, n:3, origN:3, round:1, display:"제1회 3번", verified:true, q:"DSM-5 진단 기준에 따른 특정공포증(Specific Phobia)의 하위유형을 3가지만 쓰고, 각각에 대해 간략히 설명하시오. 6점 - 자동상혈", points:6, keypoints:[{label:"특정공포증 하위유형 3가지",min:3,pool:[{t:"동물형: 동물이나 곤충에 대한 공포",ac:["동물형"]},{t:"자연환경형: 고소·폭풍·물 등 자연환경에 대한 공포",ac:["자연환경형"]},{t:"혈액-주사-손상형: 피·주사·침습적 처치에 대한 공포",ac:["혈액-주사-손상형","혈액 주사 상처형"]},{t:"상황형: 비행기·엘리베이터·밀폐공간 등 특정 상황에 대한 공포",ac:["상황형"]},{t:"기타형: 질식·구토·큰 소리 등 다른 특정 자극에 대한 공포",ac:["기타형"]}]}], explain:"DSM-5의 특정공포증은 동물형, 자연환경형, 혈액-주사-손상형, 상황형, 기타형으로 기술한다. 문항은 이 중 세 가지와 대표 자극을 제시하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:4, origN:4, round:1, display:"제1회 4번", verified:true, q:"다음 보기에서 설명하는 내용이 공통적으로 어떤 가족치료 이론에 관한 것인지를 쓰시오. 3점\n헤일리가 제안한 가족치료 모델\n인간행동의 원인보다는 해결방법에 초점\n가족이 호소하는 문제를 해결하기 위한 다양한 전략을 모색\n단기치료에 해당하며, ~인척 하기, 증상처방 등 역설적 방법을 활용\n정답:", points:3, keypoints:[{label:"가족치료 이론",min:1,pool:[{t:"전략적 가족치료",ac:["전략적 가족치료","Haley","헤일리"]}]}], explain:"문제의 원인 탐색보다 현재의 상호작용과 해결전략에 초점을 두고, 지시·역설적 개입·증상처방 등을 사용하는 것은 전략적 가족치료의 특징이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:5, origN:5, round:1, display:"제1회 5번", verified:true, q:"집단치료의 치료적 요인을 6가지 기술하시오. 6점 (09, 12, 13, 14, 17, 18년 기출)이모집정보희", points:6, keypoints:[{label:"집단치료 치료요인 6가지",min:6,pool:[{t:"이타심",ac:["이타심"]},{t:"모방행동",ac:["모방행동"]},{t:"집단응집력",ac:["집단응집력"]},{t:"정화",ac:["정화","카타르시스"]},{t:"보편성",ac:["보편성"]},{t:"희망의 고취",ac:["희망의 고취","희망 고취"]}]}], explain:"집단치료의 대표적 치료요인으로 이타심, 모방행동, 응집력, 정화, 보편성, 희망의 고취가 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:6, origN:6, round:1, display:"제1회 6번", verified:true, q:"상담 슈퍼비전(Supervision)에서 회기 기록의 장점을 3가지 기술하시오. 6점", points:6, keypoints:[{label:"회기 기록 장점 3가지",min:3,pool:[{t:"슈퍼바이지가 자신의 개입·가정·판단을 되돌아보며 자기통찰을 높인다",ac:["자기통찰","개입 점검"]},{t:"슈퍼바이저가 실제 회기자료를 바탕으로 피드백하고 향후 전략을 계획할 수 있다",ac:["피드백","전략 수립"]},{t:"교육·평가·행정의 근거자료가 되어 발달과정을 추적할 수 있다",ac:["평가 자료","행정 자료"]}]}], explain:"회기 기록은 기억에 의존하지 않고 상담과정을 구체적으로 검토하게 하므로 자기성찰, 슈퍼비전 피드백, 교육·평가자료로 유용하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:7, origN:7, round:1, display:"제1회 7번", verified:true, q:"단회상담은 다른 일반적인 심리상담과 달리 극히 제한된 시간 내에 응급 상황을 처리해야 하는 경우가 많다. 이와 같은 상담에서 강조되는 원리 또는 기술을 5가지만 제시하시오. 5점(11, 15년 기출)", points:5, keypoints:[{label:"단회상담 원리 5가지",min:5,pool:[{t:"단회상담이 적절한지 신속히 평가하고 위기·응급상황을 우선 선별한다",ac:["적합성 평가","위기 선별"]},{t:"내담자가 이번 회기에서 원하는 것을 명확히 파악한다",ac:["wants","요구 파악"]},{t:"한 회기에서 달성 가능한 구체적·현실적 목표를 세운다",ac:["현실적 목표"]},{t:"필요에 따라 조언·정보제공·지시를 보다 적극적으로 사용할 수 있다",ac:["조언","지시"]},{t:"이론에 얽매이지 않고 문제와 자원에 맞춰 융통성 있게 개입한다",ac:["융통성","통합적"]},{t:"내담자의 변화동기와 이미 가진 자원을 적극 활용한다",ac:["변화동기","자원 활용"]}]}], explain:"단회상담은 제한된 시간 안에 안전과 핵심문제를 빠르게 파악하고, 내담자의 기대와 자원을 활용해 구체적 목표에 집중하는 적극적 접근이 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"만성정신질환자의 탈시설화 추세가 나타나게 된 배경을 3가지 기술하시오. 6점", points:6, keypoints:[{label:"탈시설화 배경 3가지",min:3,pool:[{t:"항정신병약물 등 정신약물치료의 발전으로 지역사회 생활 가능성이 높아졌다",ac:["정신약물","약물치료"]},{t:"대규모 정신병원 장기수용의 비용과 인권·생활의 질 문제에 대한 비판이 커졌다",ac:["운영비용","인권","삶의 질"]},{t:"지역사회 정신건강서비스 확대와 탈시설화 정책이 추진되었다",ac:["지역사회 서비스","탈시설화 정책"]}]}], explain:"탈시설화는 약물치료의 발전, 대형시설 장기수용의 경제적·인권적 한계, 지역사회 기반 정신건강정책의 확대가 함께 작용한 결과다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"심리검사의 신뢰도를 추정하는 방법을 3가지 쓰고, 각각에 대해 설명하시오. 6점", points:6, keypoints:[{label:"신뢰도 추정방법 3가지",min:3,pool:[{t:"검사-재검사 신뢰도: 같은 검사를 일정 간격을 두고 두 번 시행해 점수의 안정성을 본다",ac:["검사-재검사","test-retest"]},{t:"동형검사 신뢰도: 동등한 두 형태의 검사 점수 간 상관으로 동등성을 본다",ac:["동형검사","parallel forms"]},{t:"반분신뢰도: 한 검사의 문항을 둘로 나눠 두 부분 점수의 일치도를 본다",ac:["반분신뢰도","split-half"]},{t:"내적합치도: 문항들 간 일관성을 계수로 평가한다",ac:["내적합치도","Cronbach alpha"]}]}], explain:"신뢰도는 측정의 일관성이다. 시간에 따른 안정성은 검사-재검사, 검사형 간 동등성은 동형검사, 한 검사 내부의 일관성은 반분 또는 내적합치도로 추정한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"정신장애의 취약성-스트레스 모델에 대해 설명하시오. 5점(16년 기출)", points:5, keypoints:[{label:"취약성-스트레스 모델",min:3,pool:[{t:"취약성은 유전·생물학·인지·성격 등 장애 발생에 대한 개인의 소인이다",ac:["취약성","소인"]},{t:"스트레스는 심리적 부담을 유발하는 생활사건·환경요인이다",ac:["스트레스","환경요인"]},{t:"정신장애는 취약성과 스트레스가 상호작용해 역치를 넘을 때 발생할 가능성이 높아진다",ac:["상호작용","역치"]}]}], explain:"취약성-스트레스 모델은 같은 스트레스라도 개인의 취약성 수준과 보호요인에 따라 결과가 달라진다고 본다. 취약성과 환경 스트레스의 상호작용이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:11, origN:11, round:1, display:"제1회 11번", verified:false, q:"지능검사를 시행한 후 병전 지능을 추정할 수 있는 방법을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"병전지능 추정방법 3가지",min:3,pool:[{t:"교육수준·직업·연령 등 인구통계학적 정보를 이용한 추정",ac:["인구통계학적","교육수준","직업"]},{t:"읽기검사나 어휘 등 비교적 손상에 덜 민감한 결정성 언어능력을 활용한다",ac:["읽기검사","어휘","NART"]},{t:"현재 웩슬러 소검사 중 비교적 보존되는 수행과 인구통계 정보를 결합한 회귀식·추정공식을 사용한다",ac:["추정공식","회귀식","KPIE"]}]}], explain:"시험 대비: 원자료에서 요구하는 병전지능 추정 답을 확인하되, 특정 소검사 조합은 검사판본과 추정법에 따라 달라질 수 있음을 함께 기억한다.\\n\\n실제 이해: 병전지능은 교육·직업 등 인구통계 정보, 읽기·어휘 같은 상대적으로 보존되는 능력, 판본별 회귀식·추정공식을 종합해 추정한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “상식·어휘·토막짜기” 고정 답은 현대 WAIS-III/IV 병전지능 추정 연구와 불일치 가능. K-WAIS-IV KPIE는 어휘·상식·행렬추리·퍼즐과 인구통계 변인을 사용함."] },

{ level:2, y:2019, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"심리상담의 과정에서 내담자가 침묵을 지키는 이유를 4가지 기술하시오. 4점08, 10, 12, 15년 기출)", points:4, keypoints:[{label:"침묵 이유 4가지",min:4,pool:[{t:"상담초기 관계와 자기노출에 대한 불안·두려움이 있다",ac:["불안","두려움"]},{t:"상담자에게 분노·적대감·저항을 표현하고 있다",ac:["적대감","저항"]},{t:"지금까지 나온 내용을 생각하고 정리하고 있다",ac:["정리","음미"]},{t:"강한 감정표현 뒤 피로하거나 감정을 조절하는 중이다",ac:["감정 회복","피로"]},{t:"상담자의 반응이나 해석을 기다리고 있다",ac:["상담자 반응 기대"]},{t:"무엇을 말해야 할지 몰라 머뭇거린다",ac:["무슨 말을 해야 할지 모름"]}]}], explain:"침묵은 저항만을 뜻하지 않는다. 불안, 생각 정리, 감정조절, 상담자 반응을 기다림, 말할 내용을 찾는 과정 등 다양한 기능이 있으므로 맥락을 확인해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"상담 종결 상황의 3가지 유형을 쓰고, 각각에 대해 설명하시오. 6점", points:6, keypoints:[{label:"종결 유형 3가지",min:3,pool:[{t:"상담자에 의한 조기종결: 목표달성 전 상담자의 사정으로 중단하며 감정처리와 의뢰·대책을 마련한다",ac:["상담자 조기종결"]},{t:"내담자에 의한 조기종결: 내담자가 중단을 원할 때 이유와 긴장을 개방적으로 탐색하고 안전하게 마무리한다",ac:["내담자 조기종결"]},{t:"성공적 종결: 목표달성 후 상호합의로 종결하며 변화와 유지계획을 검토한다",ac:["성공적 종결","합의 종결"]}]}], explain:"종결은 누가 어떤 이유로 끝내는지에 따라 과제가 달라진다. 조기종결에서는 감정과 대안을 다루고, 성공적 종결에서는 변화의 의미와 유지·재발예방을 점검한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"로샤 검사(Rorschach Test)에서 반응영역의 기호 ‘D’, ‘Dd’, 'S'를 각각 설명하시오. 6점", points:6, keypoints:[{label:"Rorschach 반응영역",min:3,pool:[{t:"D: 비교적 흔하게 선택되는 반점의 부분영역을 사용한 반응",ac:["D","흔한 부분"]},{t:"Dd: 흔한 부분 D로 분류되지 않는 드물게 선택되는 부분영역을 사용한 반응",ac:["Dd","드문 부분"]},{t:"S: 잉크반점의 흰 공백영역을 반응에 사용한 경우 다른 영역기호와 함께 표기",ac:["S","공백반응"]}]}], explain:"반응영역은 수검자가 카드의 어느 부분을 사용했는지를 부호화한다. D는 흔한 부분, Dd는 드문 부분, S는 흰 공백영역의 사용을 뜻한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"초기면담 과정에서 포함되어야 할 내담자에 대한 행동관찰의 요소 4가지를 쓰시오. 4점 (13,16년 기출)", points:4, keypoints:[{label:"행동관찰 요소 4가지",min:4,pool:[{t:"외모·용모·위생·복장 등 전반적 모습",ac:["외모","용모"]},{t:"면담 태도와 협조성·눈맞춤·신체동작",ac:["면담 태도","신체동작"]},{t:"말의 속도·양·명료성 및 언어·비언어적 의사소통",ac:["말","의사소통"]},{t:"정서적 반응과 기분·정동의 적절성",ac:["정서적 반응","정동"]},{t:"사고의 논리성·이해력·주의집중 등 인지적 특징",ac:["사고력","이해력"]}]}], explain:"초기면담의 행동관찰은 외모, 태도, 운동행동, 말과 의사소통, 정서반응, 사고·인지상태처럼 직접 관찰 가능한 정보를 체계적으로 기록하는 것이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"행동평가의 평가요소로서 4가지 변인으로 불리는 ‘SORC’의 의미를 쓰고, 각각에 대해 간략히 설명하시오. 4점", points:4, keypoints:[{label:"SORC 4요소",min:4,pool:[{t:"S(Stimulus): 문제행동에 선행하는 환경적 자극·상황",ac:["Stimulus","선행자극"]},{t:"O(Organism): 생물학적 상태·인지·정서·학습사 등 개인 내 변인",ac:["Organism","유기체 변인"]},{t:"R(Response): 관찰·측정하려는 구체적 행동·정서·생리 반응",ac:["Response","반응"]},{t:"C(Consequence): 행동 뒤에 따라와 행동을 강화·약화시키는 결과",ac:["Consequence","결과"]}]}], explain:"SORC는 문제행동을 선행자극, 개인 특성, 반응, 결과의 기능적 관계로 분석하는 행동평가 틀이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"인지치료에서는 내담자의 자동적 사고를 수정하기 위해 소크라테스식 질문법을 사용한다. 소크라테스식 질문법을 사용할 때의 유의사항을 6가지 기술하시오. 6점(13, 16년 기출)", points:6, keypoints:[{label:"소크라테스식 질문 유의사항 6가지",min:6,pool:[{t:"내담자가 새로운 가능성을 발견하도록 여는 질문을 한다",ac:["새로운 가능성"]},{t:"질문이 실제 문제해결·학습에 도움이 되도록 한다",ac:["도움되는 질문"]},{t:"내담자를 능동적 탐구와 학습과정에 참여시킨다",ac:["학습 참여"]},{t:"내담자의 인지·정서 수준에 맞는 이해 가능한 질문을 한다",ac:["수준에 맞는 질문"]},{t:"상담자가 정해둔 결론으로 유도하는 질문을 피한다",ac:["유도질문 금지"]},{t:"선다형·심문식 질문을 남발하지 않고 열린 탐구를 유지한다",ac:["선다형 질문 금지","심문식 금지"]}]}], explain:"소크라테스식 질문은 정답을 유도하는 기술이 아니라 내담자가 증거와 대안을 스스로 검토하도록 돕는 협력적 탐구다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 4점\n올해 15세로 중학교 3학년인 A군은 평소 학교 친구들과 어울리지 못하며, 거의 매일 아침 등교시간마다 학교가기를 거부하고 있다. A군은 학교에서 아이들이 자신과 놀아주기는 커녕 괴롭히고 따돌린다면서, 학교에 가는 것이 죽고 싶을 만큼 싫다고 불평을 늘어놓았다. A군은 또래 아이들에 비해 골격이 크고 당당한 체구이며, 어려서부터 태권도를 좋아하여 현재까지 도장에 다니고 있다. 그러나 A군은 중학교에 진학한 이후 성적이 최하위권으로 떨어졌으며, 현재 A군의 담임선생님은 최근 실시한 집단지능검사의 결과와 함께 A군의 일반계 고등학교 진학이 어렵다는 이야기를 A군의 어머니에게 알려주었다고 한다. A군의 어머니는 자신의 아들이 담임선생님의 이야기처럼 고등학교 진학이 어려울 만큼 심각한 상태인지, A군이 학교생활에 적응하지 못하는 것을 어떻게 해결할 수 있을지 앞으로 A군을 어떠한 방식으로 훈육해야 할 것인지 등의 문제를 호소하고 있다. 심리평가를 위해 내원한 A군과 A군의 어머니가 내원했을 때 A군은 무표정한 표정에 약간 어눌한 말투를 보였으며 발음도 부정확했다. 또한 대답하는 것을 귀찮아하는 듯 매우 짧은 답변으로 일관했으며 자신의 문제들을 쉽게 포기하려는 모습을 보였다.\n보기의 내용에 제시된 내담자 A군의 문제와 관련하여 적절한 치료계획을 인지적 · 정서적 · 행동적 측면에서 4가지 기술하시오. 4점", points:4, keypoints:[{label:"인지적 개입",min:1,pool:[{t:"학교상황과 자신에 대한 비합리적·패배적 신념을 확인하고 근거를 검토해 보다 현실적인 사고로 수정한다",ac:["인지재구성","비합리적 신념 논박"]}]},{label:"정서적 개입",min:1,pool:[{t:"따돌림·학교거부와 관련된 불안·수치·분노·우울을 안전하게 표현하고 조절하도록 돕는다",ac:["감정표현","정서조절"]}]},{label:"행동적 개입",min:2,pool:[{t:"또래관계와 의사소통을 위한 사회기술훈련·역할연습을 실시한다",ac:["사회기술훈련","역할연습"]},{t:"학교복귀를 위한 단계적 노출·행동계획과 강화체계를 마련한다",ac:["학교복귀","단계적 노출","행동계획"]}]}], explain:"사례에는 따돌림, 학교거부, 학업저하, 발달·인지 문제 가능성이 함께 있어 단순 REBT 기법 네 개를 기계적으로 적용하기보다 정서안전, 인지적 재구성, 사회기술, 학교복귀계획을 통합해야 한다. 추가로 자살사고가 언급되므로 위험평가가 선행돼야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 REBT/자기교습/사회기술을 정답으로 제시하나 “죽고 싶다”는 표현이 있어 안전평가가 우선."] },

{ level:2, y:2019, n:19, origN:19, round:1, display:"제1회 19번", verified:true, q:"실존치료에서는 정상적 불안과 신경증적 불안을 구분하고 있다. 그 중 정상적 불안의 특징을 3가지 쓰시오. 6점(16년 기출)\n정상적 불안(=실존적 불안)\n신경증적 불안", points:6, keypoints:[{label:"정상적 불안 특징 3가지",min:3,pool:[{t:"직면한 위험이나 상황의 실제 위협에 비례한다",ac:["상황에 부합","비례"]},{t:"억압할 필요 없이 의식적으로 직면하고 다룰 수 있다",ac:["억압되지 않음","직면 가능"]},{t:"성장·창조·의미있는 선택을 촉진하는 방향으로 사용할 수 있다",ac:["창조적","성장 촉진"]}]}], explain:"실존치료에서 정상적 불안은 존재의 현실적 위협에 비례하며 회피·억압하기보다 직면할 수 있고, 삶의 선택과 성장을 촉진하는 신호로 활용될 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:20, origN:1, round:3, display:"제3회 1번", verified:true, q:"얄롬(Yalom)이 제시한 집단상담의 치료적 요인을 5가지 기술하시오. 5점\n(09, 12, 13, 14, 17, 18, 19년 기출)", points:5, keypoints:[{label:"Yalom 치료요인 5가지",min:5,pool:[{t:"희망의 고취",ac:["희망 고취"]},{t:"보편성",ac:["보편성"]},{t:"정보전달",ac:["정보전달"]},{t:"이타심",ac:["이타심"]},{t:"초기 가족집단의 교정적 재현",ac:["가족경험 교정"]},{t:"사회화 기술 발달",ac:["사회화 기술"]},{t:"모방행동",ac:["모방행동"]},{t:"대인관계 학습",ac:["대인관계 학습"]},{t:"집단응집력",ac:["집단응집력"]},{t:"정화",ac:["정화"]},{t:"실존적 요인",ac:["실존적 요인"]}]}], explain:"Yalom은 집단치료의 여러 치료요인을 제시했다. 문항에서는 그중 다섯 가지를 정확히 제시하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:21, origN:2, round:3, display:"제3회 2번", verified:true, q:"행동치료의 방법 중 용암법(Fading)과 조형법(Shaping)에 대해 설명하시오. 4점", points:4, keypoints:[{label:"용암법(Fading)",min:2,pool:[{t:"처음에는 행동을 쉽게 일으키는 강한 촉진자극을 사용한다",ac:["촉진자극"]},{t:"행동이 안정되면 촉진자극을 점차 줄여 자연적 자극이 행동을 통제하게 한다",ac:["촉진 제거","점진적 감소"]}]},{label:"조형법(Shaping)",min:2,pool:[{t:"목표행동에 가까운 근사행동을 단계적으로 선정한다",ac:["근사행동"]},{t:"더 가까운 행동만 선택적으로 강화해 최종 목표행동을 형성한다",ac:["차별강화","연속적 근사"]}]}], explain:"용암법은 보조자극을 점차 희미하게 만들어 자연적 단서가 행동을 통제하게 하는 방법이고, 조형법은 목표행동에 점점 가까운 근사반응을 차례로 강화해 새로운 행동을 만드는 방법이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:22, origN:3, round:3, display:"제3회 3번", verified:true, q:"강박장애의 심리적 치료방법으로서 노출 및 반응방지법(ERP)의 원리 및 시행순서를 기술하시오. 6점(11, 16년 기출)\n(1) 원리\n(2) 시행순서", points:6, keypoints:[{label:"ERP 원리",min:2,pool:[{t:"두려운 자극·강박사고 유발상황을 회피하지 않고 반복적으로 접하게 한다",ac:["노출"]},{t:"불안을 줄이기 위한 강박행동·중화행동을 하지 않도록 막는다",ac:["반응방지"]}]},{label:"시행순서",min:3,pool:[{t:"강박증상과 회피·의식을 평가하고 노출위계를 만든다",ac:["평가","노출위계"]},{t:"낮거나 적절한 수준의 상황부터 계획적으로 노출한다",ac:["계획적 노출"]},{t:"강박행동을 하지 않은 채 불안을 견디고 반복연습한다",ac:["강박행동 억제","반복연습"]}]}], explain:"ERP는 강박장애의 핵심 행동치료로, 강박사고를 유발하는 상황을 회피하지 않고 접하면서 중화행동을 하지 않아도 불안이 견딜 수 있고 예상한 재앙이 일어나지 않는다는 새로운 학습을 형성한다. 특정 90분이라는 시간은 필수 기준이 아니다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “90분 이상”을 필수 시행기준에서 제외."] },

{ level:2, y:2019, n:23, origN:4, round:3, display:"제3회 4번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점 (15년 기출)\n김대리는 업무능력이 뛰어나고 남보다 승진도 빠르다. 그러던 중 어느 날 사소한 실수를 저지르게 되었다. 상사와 동료들이 모두 괜찮다고 하였으나, 정작 김 대리 본인만은 자신이 실수를 저질렀다는 사실을 용납하기 어려웠다. 김대리는 “약간의 실수라도 저지른다면, 나의 회사생활은 끝이다.”라고 생각하고 있었던 것이다. 김대리는 이와 같은 심리적인 어려움으로 인해 이직까지 고려하고 있다.\n보기에 지시된 김 대리의 사례를 REBT의 ABCDE 치료모델에 맞추어 설명하시오.", points:5, keypoints:[{label:"ABCDE 적용",min:5,pool:[{t:"A 선행사건: 업무에서 사소한 실수를 한 사건",ac:["A","선행사건"]},{t:"B 비합리적 신념: 작은 실수도 용납할 수 없고 회사생활이 끝난다는 당위·파국화",ac:["B","비합리적 신념"]},{t:"C 결과: 불안·우울·자괴감과 회피·이직고려 등 정서·행동결과",ac:["C","결과"]},{t:"D 논박: 작은 실수가 곧 무능력·파멸을 뜻한다는 믿음의 논리·증거·실용성을 검토",ac:["D","논박"]},{t:"E 효과: 실수와 자신의 가치·능력을 구분하는 합리적 신념과 보다 적응적 행동을 형성",ac:["E","새 신념","효과"]}]}], explain:"REBT는 사건 A가 감정 C를 직접 만드는 것이 아니라 사건에 대한 신념 B가 핵심 매개라고 본다. 비합리적 신념을 논박 D하고 보다 합리적인 새로운 신념과 효과 E를 형성한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:24, origN:5, round:3, display:"제3회 5번", verified:true, q:"투사기법의 장점과 단점을 각각 3가지씩 기술하시오. 6점\n(1) 장점\n(2) 단점", points:6, keypoints:[{label:"투사기법 장점 3가지",min:3,pool:[{t:"언어표현이 제한된 아동이나 수검자의 경험을 간접적으로 탐색하는 데 활용할 수 있다",ac:["언어제한","아동"]},{t:"검사 의도가 명확하지 않아 의도적 반응관리의 영향을 줄일 가능성이 있다",ac:["반응관리 감소"]},{t:"풍부하고 개별적인 반응자료를 얻어 가설생성에 도움을 줄 수 있다",ac:["풍부한 자료","가설생성"]}]},{label:"투사기법 단점 3가지",min:3,pool:[{t:"시행·채점·해석의 표준화가 제한적인 도구가 있다",ac:["표준화 부족"]},{t:"규준자료가 부족하거나 대표성이 제한될 수 있다",ac:["규준 부족"]},{t:"신뢰도·타당도와 검사자 간 일치도가 충분하지 않은 경우가 있다",ac:["신뢰도","타당도"]}]}], explain:"투사기법은 구조화가 낮아 풍부한 개별자료를 얻는 장점이 있지만, 그만큼 표준화와 심리측정적 근거가 제한될 수 있어 단독 진단도구로 사용하기보다 다른 자료와 통합해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:25, origN:6, round:3, display:"제3회 6번", verified:true, q:"피아제(Piaget)의 인지발달이론에 의한 인지발달단계에서 전조작기, 구체적 조작기, 형식적 조작기에 해당하는 아동 및 청소년을 위한 상담의 특성 및 주의점을 발달단계별로 쓰시오. 6점(13년 기출)", points:6, keypoints:[{label:"전조작기 상담",min:2,pool:[{t:"구체적 언어와 놀이·그림·상징활동을 활용한다",ac:["놀이","상징활동"]},{t:"자기중심성과 논리적 조작의 한계를 고려해 추상적 설명을 피한다",ac:["자기중심성","추상적 설명 피함"]}]},{label:"구체적 조작기 상담",min:2,pool:[{t:"구체적 사건과 실제 예시를 사용해 사고와 감정을 다룬다",ac:["구체적 예시"]},{t:"역할연기·독서·문제해결활동처럼 현실적 관점전환을 돕는다",ac:["역할연기","관점전환"]}]},{label:"형식적 조작기 상담",min:2,pool:[{t:"가설·가치·미래 등 추상적 주제를 탐색할 수 있다",ac:["추상적 사고","가설"]},{t:"자의식·또래관계·정체성 민감성을 존중하며 협력적 관계를 형성한다",ac:["정체성","또래관계"]}]}], explain:"Piaget의 발달단계에 맞춰 상담의 언어와 매체를 조절해야 한다. 어린 아동은 놀이와 구체적 경험을, 청소년은 추상적 사고와 정체성·가치 탐색을 더 활용할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:26, origN:7, round:3, display:"제3회 7번", verified:true, q:"임상심리사의 윤리원칙으로서 유능성의 의미를 설명하고, 이를 위반하는 이유를 3가지 쓰시오. 5점(11, 16년 기출)\n(1) 유능성의 의미\n(2) 유능성의 원칙을 위반하는 이유", points:5, keypoints:[{label:"유능성 의미",min:2,pool:[{t:"자신의 지식·기술·훈련의 범위와 한계를 알고 그 범위 안에서 서비스를 제공한다",ac:["전문성 한계","훈련 범위"]},{t:"지속적 교육·수퍼비전·자문을 통해 역량을 유지하고 필요한 경우 의뢰한다",ac:["지속교육","수퍼비전","의뢰"]}]},{label:"위반 위험 3가지",min:3,pool:[{t:"개인적 심리문제·소진·건강문제가 전문적 판단을 손상시키는 경우",ac:["소진","개인적 문제"]},{t:"충분한 교육·수련 없이 특정 평가나 치료를 시행하는 경우",ac:["수련 부족","교육 부족"]},{t:"자신의 한계를 인정하지 않고 자문·의뢰·추가교육을 거부하는 경우",ac:["한계 부인","의뢰 거부"]}]}], explain:"유능성은 단순히 “실력이 좋다”는 뜻이 아니라 자신의 훈련범위와 한계를 인식하고 지속적으로 역량을 유지하며, 부족한 영역에서는 자문·수퍼비전·의뢰를 활용하는 윤리적 책임이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },
