<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임상심리사 실기 기출풀이</title>
<style>
:root{
  --sc:#B8842E;
  --paper:#EDF0EC; --surface:#FBFCFA; --surface-2:#F4F6F2;
  --ink:#1B211F; --ink-soft:#55605B; --ink-faint:#8A938E;
  --accent:#24564F; --accent-deep:#183B36; --accent-tint:#DCE8E4;
  --ochre:#B8842E; --ochre-tint:#F1E5CE;
  --good:#37795A; --good-tint:#DCEBE1;
  --miss:#AE4229; --miss-tint:#F2DDD5;
  --line:#D6DBD3; --line-soft:#E4E8E1;
  --radius:14px; --shadow:0 1px 2px rgba(24,59,54,.05),0 6px 24px rgba(24,59,54,.06);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.65;
  -webkit-font-smoothing:antialiased;font-size:15.5px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
textarea{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* layout */
.wrap{max-width:940px;margin:0 auto;padding:0 18px 80px}
header.top{padding:26px 0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.brand .sub{color:var(--ink-faint);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.tagline{color:var(--ink-soft);font-size:13px;margin:6px 0 0}

/* year tabs */
.levels{display:flex;gap:8px;margin:14px 0 2px}
.lvbtn{padding:8px 20px;border-radius:10px;font-size:15px;font-weight:800;
  background:var(--surface-2);color:var(--ink-soft);border:1.5px solid var(--line-soft);transition:.15s;letter-spacing:.5px}
.lvbtn.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.years{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.year{padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:700;
  background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-soft);transition:.15s}
.year[data-empty="1"]{opacity:.4;cursor:default}
.year.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.year.freq{color:var(--sc);border-color:var(--sc)}
.year.freq.active{background:var(--sc);color:#fff;border-color:var(--sc)}
.qbtn.hot{box-shadow:inset 0 0 0 2px var(--sc)}
.qtag.hot{background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
.freqyears{font-size:12px;font-weight:600;color:var(--ink-faint);margin:-4px 0 10px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;margin:16px 0 6px}
.stat{background:var(--surface);padding:12px 10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-faint);font-weight:600}
.exambar{margin:12px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.ex-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ex-head b{font-size:14px;font-weight:800}
.ex-head .muted{font-weight:600;color:var(--ink-faint);font-size:12px;margin-left:4px}
.pill{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:999px}
.p-pass{background:var(--good-tint);color:var(--good)}
.p-fail{background:var(--miss-tint);color:var(--miss)}
.track{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:999px;overflow:visible}
.track .fill{height:100%;border-radius:999px;transition:width .35s ease}
.track .passline{position:absolute;top:-4px;bottom:-4px;left:60%;width:2px;background:var(--accent-deep)}
.track .passline::after{content:"합격 60";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--accent-deep);white-space:nowrap}
.ex-sub{margin-top:12px;font-size:11.5px;color:var(--ink-faint);line-height:1.5}
.stat .accent{color:var(--accent)}

/* nav grid */
.navrow{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.navrow .lbl{font-size:12px;font-weight:700;color:var(--ink-faint)}
.grid{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.qbtn{width:34px;height:34px;border-radius:9px;font-size:13px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  font-variant-numeric:tabular-nums;position:relative;transition:.12s}
.qbtn:hover{border-color:var(--accent)}
.qbtn.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.qbtn.st-good{border-color:var(--good);color:var(--good)}
.qbtn.st-part{border-color:var(--ochre);color:var(--ochre)}
.qbtn.st-miss{border-color:var(--miss);color:var(--miss)}
.qbtn.cur.st-good,.qbtn.cur.st-part,.qbtn.cur.st-miss{color:#fff}
.qbtn .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface)}
.st-good .dot{background:var(--good)}.st-part .dot{background:var(--ochre)}.st-miss .dot{background:var(--miss)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tool{font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:6px 11px;border-radius:8px;border:1px solid var(--line)}
.tool:hover{border-color:var(--accent);color:var(--accent)}
.tool.on{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-deep)}

/* question card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px 24px 22px;margin-top:4px}
.qmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qnum{font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--accent);
  padding:4px 9px;border-radius:7px}
.qtag{font-size:11.5px;font-weight:700;color:var(--good);background:var(--good-tint);padding:3px 8px;border-radius:6px}
.qtext{font-size:17px;font-weight:600;line-height:1.6;letter-spacing:-.01em;margin:2px 0 4px;white-space:pre-wrap}
.qhint{font-size:12.5px;color:var(--ink-faint);margin-top:8px}

.answer{width:100%;min-height:150px;margin-top:16px;padding:14px 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface-2);font-size:15px;line-height:1.7;resize:vertical;color:var(--ink)}
.answer:focus{outline:none;border-color:var(--accent);background:#fff}
.answer:disabled{opacity:.7}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{font-size:14px;font-weight:700;padding:11px 18px;border-radius:10px;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.nav-lr{margin-left:auto;display:flex;gap:6px}
.nav-lr .btn{padding:11px 14px}

/* result */
.result{margin-top:18px;border-top:1px solid var(--line-soft);padding-top:18px;display:none}
.result.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scorewrap{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.score-ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;
  background:conic-gradient(var(--sc) calc(var(--p)*1%),var(--line-soft) 0);
  display:grid;place-items:center}
.score-ring i{width:60px;height:60px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-style:normal;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--sc)}
.verdict b{font-size:16px;font-weight:800;display:block}
.verdict span{font-size:13px;color:var(--ink-soft)}

.cov-title{font-size:12.5px;font-weight:800;color:var(--ink-faint);letter-spacing:.04em;margin:16px 0 8px}
.cov{display:flex;flex-direction:column;gap:6px}
.cov-item{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:9px 12px;border-radius:9px;background:var(--surface-2)}
.cov-item .mk{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.cov-item.hit .mk{background:var(--good-tint);color:var(--good)}
.cov-item.hit{background:var(--good-tint)}
.cov-item.no .mk{background:var(--miss-tint);color:var(--miss)}
.cov-item.no{background:var(--miss-tint)}
.cov-item.part .mk{background:var(--ochre-tint);color:var(--ochre)}
.cov-item.part{background:var(--ochre-tint)}
.cov-item .note-sm{font-style:normal;font-size:12px;color:var(--ink-faint);font-weight:600}
.cautions{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.caution-item{font-size:13px;line-height:1.6;background:var(--ochre-tint);color:#7A5310;border-radius:9px;padding:10px 13px}
.cov-item .tx{color:var(--ink)}
.feedback{margin-top:14px;font-size:14px;line-height:1.7;background:var(--accent-tint);border-radius:11px;padding:14px 16px;color:var(--accent-deep);white-space:pre-wrap}

/* model answer */
.model{margin-top:16px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:16px 18px}
.model h4{margin:0 0 8px;font-size:12.5px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.model pre{margin:0;font-family:inherit;font-size:14px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
.selfscore{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.selfscore .btn{flex:1;min-width:96px;text-align:center}
.sb-good{background:var(--good-tint);color:var(--good)}
.sb-part{background:var(--ochre-tint);color:var(--ochre)}
.sb-miss{background:var(--miss-tint);color:var(--miss)}
.selfscore .btn.sel{outline:2px solid currentColor;outline-offset:1px}

.empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.empty b{display:block;font-size:16px;color:var(--ink-soft);margin-bottom:6px}

footer{margin-top:26px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.6}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--miss);background:var(--miss-tint);border-radius:9px;padding:10px 13px;margin-top:12px;display:none}
.note.show{display:block}

@media(max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .card{padding:18px 16px}
  .qtext{font-size:16px}
  .nav-lr{width:100%;margin-left:0}
  .nav-lr .btn{flex:1}
}

button:focus-visible,
textarea:focus-visible,
select:focus-visible,
input:focus-visible{
  outline:3px solid rgba(184,132,46,.42);
  outline-offset:2px;
}
textarea{scroll-margin-top:96px;}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>임상심리사 실기 기출풀이</h1>
      <span class="sub">서술형 AI 채점</span>
    </div>
    <p class="tagline">문제를 읽고 답안을 서술하면, 모범답안의 핵심 채점항목 기준으로 채점합니다.</p>
    <div class="levels" id="levels"></div>
    <div class="years" id="years"></div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="exam"></div>

  <div class="navrow">
    <span class="lbl">문항</span>
    <div class="grid" id="grid"></div>
    <div class="toolbar">
      <button class="tool" id="filterWrong">틀린 문항만</button>
      <button class="tool" id="resetBtn">기록 초기화</button>
    </div>
  </div>

  <div id="stage"></div>

  <footer>
    개인 학습용 · 답안 기록은 이 브라우저에 저장됩니다 · 채점 결과는 참고용이며 실제 배점과 다를 수 있습니다 · 2급 2012~2022 기출자료 수록
  </footer>
</div>

<script>
window.QUESTIONS = [{ level:1, y:2025, n:1, verified:true,
  q:"Beck의 인지치료에서 가장 핵심이 되는 개념 3가지를 쓰시오.",
  keypoints:["자동적 사고","역기능적 인지도식(스키마)","인지적 오류"],
  explain:"Beck의 인지모델은 정서·행동 문제를 정보처리의 왜곡으로 설명하며, 세 개념은 서로 다른 층위에서 맞물린다. 역기능적 인지도식(스키마)은 초기 경험으로 형성된 자기·타인·세계에 대한 뿌리 깊은 신념 구조로, 평소엔 잠복해 있다가 스트레스 사건에서 활성화된다. 도식이 활성화되면 정보처리에 체계적 편향인 인지적 오류(흑백논리·과잉일반화·선택적 추상화·임의적 추론·의미 확대/축소 등)가 작동한다. 그 결과 상황마다 순간적으로 스쳐가는 부정적 자동적 사고가 떠오르고 이것이 증상으로 이어진다. 우울에서는 자동적 사고가 자기·세계·미래에 대한 부정적 관점, 즉 인지삼제로 나타난다. 치료는 접근이 쉬운 자동적 사고부터 다루고 점차 도식을 수정한다." },

{ level:1, y:2025, n:2, verified:true,
  q:"Big Five 성격 모델에서 NEO의 3가지를 제시하고 각각 설명하시오.",
  keypoints:["신경증(N)","외향성(E)","개방성(O)"],
  rubric:{ requireExplanation:true },
  explain:"5요인 모델(Big Five)은 성격을 개방성(O)·성실성(C)·외향성(E)·우호성(A)·신경증(N)의 다섯 축으로 기술하며 NEO-PI-R이 대표 측정도구다. 제시된 세 요인은: 신경증(N)은 부정 정서 경험 경향으로 높을수록 불안·우울·적대감·충동성·취약성이 크고 낮으면 정서적으로 안정적이다. 외향성(E)은 사회적 자극과 긍정 정서를 추구하는 정도로 높으면 사교적·활동적·자극추구적이고 낮으면 조용하고 독립적이다. 개방성(O)은 경험에 대한 개방성으로 높으면 상상력·심미성·호기심·다양성 추구가 크고 낮으면 관습적·실용적이다. 각 요인은 정상 성격의 연속 차원이며, 임상에서는 성격병리를 이해하는 틀로도 활용된다." },

{ level:1, y:2025, n:3, verified:true,
  q:"심리치료, 교육 및 임상 장면에서 지능검사를 활용하는 목적 5가지를 쓰시오.",
  keypoints:[{label:"지능검사 활용 목적 5가지", min:5, pool:[
    {t:"학업성취 예측·인지적 결함 파악(교육)", ac:["학업","학습","교육 장면","성취 예측","인지적 결함"]},
    {t:"치료적 개입을 위한 정보 제공", ac:["치료적 개입","개입 정보","치료 정보"]},
    {t:"신경학적·정신과적 문제의 감별진단", ac:["감별","신경학","정신과적","진단"]},
    {t:"성격·정서 특징 파악 및 치료목표 설정", ac:["성격","정서 특징","치료목표","목표 설정"]},
    {t:"검사 중 행동관찰 자료 확보", ac:["행동관찰","관찰 자료","행동 관찰"]},
    {t:"인지기능 변화·손상 효과 검증", ac:["인지기능 변화","손상","효과 검증","경과"]}
  ]}],
  explain:"지능검사는 단순 IQ 산출을 넘어 임상적 의사결정의 다목적 도구다. 교육 장면에서는 학습부진의 인지적 원인을 규명하고 학업성취를 예측한다. 치료 장면에서는 개인의 인지적 강·약점에 맞춘 개입 정보를 제공한다. 임상 장면에서는 뇌손상·치매·발달장애 등 신경학적·정신과적 문제의 감별진단에 쓰이고, 성격·정서적 특성과 강·약점을 파악해 진단과 치료목표를 설정한다. 검사 수행 중 태도·문제해결 양식 등 행동관찰 자료를 얻으며, 개입이나 손상 전후의 인지기능 변화를 추적한다. 즉 진단·예측·개입계획·경과평가 전 과정에 걸쳐 활용된다." },

{ level:1, y:2025, n:4, verified:true,
  q:"로샤검사의 특수지표 중 우울지표(DEPI) 6가지를 쓰시오.",
  keypoints:[
    {label:"FV+VF+V>0 이거나 FD>2", all:["FV+VF+V>0","FD>2"]},
    {label:"Col-Shd Blends>0 이거나 S>2", all:["Col-Shd Blends>0","S>2"]},
    {label:"3r+(2)/R<.44 이고 Fr+rF=0 또는 3r+(2)/R<.33", all:["3r+(2)/R<.44","Fr+rF=0","3r+(2)/R<.33"]},
    {label:"Afr<.46 이거나 Blends<4", all:["Afr<.46","Blends<4"]},
    {label:"Sum Shading>FM+m 이거나 SumC'>2", all:["Sum Shading>FM+m","SumC'>2"]},
    {label:"MOR>2 이거나 2AB+Art+Ay>3", all:["MOR>2","2AB+Art+Ay>3"]}
  ],

  explain:"VRIN(Variable Response Inconsistency, 무선반응 비일관성)은 MMPI-2에서 추가된 타당도 척도로, 내용상 유사하거나 상반된 문항 쌍에 대한 응답의 일관성을 본다. 문항을 읽지 않고 무작위로 응답하면 이런 쌍에서 모순된 답이 늘어 VRIN이 상승한다. MMPI-2에서는 49개 문항 쌍(67개 반응 쌍)으로 구성되며, 원점수가 일정 기준(약 13점, T≈80) 이상이면 프로파일 타당성을 의심한다. 해석은 F와 함께 한다. F와 VRIN이 동반 상승하면 무선반응일 가능성이 크고, F는 높은데 VRIN이 정상이면 무선반응이 아니라 실제 고통 호소나 의도적 과장(faking-bad) 가능성을 시사한다. 고정반응을 탐지하는 TRIN과 짝을 이뤄 반응 태도를 점검한다." },

  explain:"자아중심성 지표(Egocentricity Index)는 자기에 대한 관심·몰두 정도를 반영하는 구조변인으로, 공식은 [3×(Fr+rF)+Σ(2)]/R 이다. 주어진 값을 대입하면 분자는 3×(Fr+rF)+Σ(2) = 3×(2+3)+5 = 3×5+5 = 20, 분모는 R = 20 이므로 20/20 = 1.0 이다. 반사반응(Fr, rF)에 가중치 3을 주는 이유는 반사반응이 자기몰두·자기애의 강한 지표이기 때문이다. 값이 지나치게 높으면 자기중심성·자기애적 몰두를, 지나치게 낮으면 부정적 자기가치감을 시사한다. (자동 채점은 수치를 정확히 검증하지 못하므로 계산 결과는 모범답안 대조로 확인하세요.)" },

{ level:2, y:2011, n:8, verified:true, points:6,

{ level:2, y:2011, n:9, verified:true, points:5,

  explain:"사례의 A씨는 정신증적 증상을 뚜렷이 보인다. 자신이 신의 계시로 세상을 구원한다는 믿음은 과대망상이고, 악의 세력·병원 직원이 자신을 방해·추종한다는 믿음은 피해망상이다. 공상·기이한 생각과 비현실적 신념은 현실검증력의 손상을 시사하며, 오랜 무직·고립은 사회적 위축과 기능 저하를 보여준다. 특히 '뛰어내리면 구원된다'는 망상은 자살·자해 위험과 직결되므로 안전 확보가 우선되어야 한다. 이러한 양상은 조현병 등 정신병적 장애를 시사한다." },

  rubric:{ requireExplanation:true },
  explain:"'전 과목 A가 아니면 실패'라는 생각은 중간 지대를 인정하지 않고 전부 아니면 전무로 판단하는 이분법적 사고(흑백논리)에 해당한다. 이를 수정하는 대표적 기법은 척도화(scaling) 기법으로, 성패를 0/100의 두 극단이 아니라 연속선(예: 0~100%)에 놓고 실제 수행을 비율로 평가하게 해 중간 지대를 떠올리도록 돕는다. 이렇게 하면 'A가 아니면 완전한 실패'가 아니라 '몇 %는 잘한 부분이 있다'는 균형 잡힌 평가가 가능해진다. 소크라테스식 질문으로 증거를 검토하고 대안적 사고를 찾는 인지 재구성도 함께 사용한다." },

{ level:2, y:2012, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"A군 사례의 행동에 ABC 모델을 적용하고 치료 참여를 유도하는 방법을 기술하시오.", points:6, keypoints:[{label:"ABC 분석",min:3,pool:[{t:"A: 선행사건·상황을 구체적으로 파악한다",ac:["선행사건","A"]},{t:"B: 관찰 가능한 문제행동을 구체화한다",ac:["행동","B"]},{t:"C: 행동 뒤에 따르는 결과와 상호강화 패턴을 파악한다",ac:["후속결과","C"]}]},{label:"치료참여 유도",min:2,pool:[{t:"상호비난보다 반복되는 행동의 기능과 상호작용을 함께 이해하게 한다",ac:["상호작용","행동 기능"]},{t:"변화 가능한 구체적 목표를 협력적으로 설정한다",ac:["협력적 목표","변화 가능성"]}]}], explain:"행동적 ABC에서는 믿음(B)이 아니라 행동(Behavior)을 뜻하는 맥락이므로 선행사건-행동-결과의 기능적 관계를 분석한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"A군과 어머니의 호소문제에 대한 인지적·정서적·행동적 요소를 토대로 치료방향을 제언하시오.", points:9, keypoints:[{label:"인지적 개입",min:2,pool:[{t:"인지적 왜곡과 비합리적 신념을 확인한다",ac:["인지적 왜곡","비합리적 신념"]},{t:"보다 현실적이고 균형잡힌 생각으로 수정한다",ac:["합리적 신념","인지 재구성"]}]},{label:"정서적 개입",min:2,pool:[{t:"괴롭힘·실패 경험과 관련된 감정을 확인하고 표현하도록 돕는다",ac:["감정 확인","감정 표현"]},{t:"정서조절과 스트레스 대처기술을 가르친다",ac:["정서조절","대처기술"]}]},{label:"행동적 개입",min:2,pool:[{t:"회피 대신 적응적 행동을 단계적으로 연습한다",ac:["적응행동","단계적 연습"]},{t:"학교·가족 환경을 조정하고 사회기술·강화를 활용한다",ac:["환경 조정","사회기술","강화"]}]}], explain:"사례의 학교거부와 적응문제는 인지·정서·행동뿐 아니라 또래괴롭힘과 학업환경을 함께 평가해 다면적으로 개입해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"심리치료의 효과성을 검증하는 방법 2가지를 쓰고 설명하시오.", points:4, keypoints:[{label:"효과성 검증 2가지",min:2,pool:[{t:"통계적 유의성: 관찰된 변화가 우연일 가능성을 통계적으로 평가한다",ac:["통계적 유의성"]},{t:"임상적 유의성: 변화가 실제 기능과 증상에서 의미 있는 수준인지 평가한다",ac:["임상적 유의성"]}]}], explain:"통계적으로 유의한 차이가 반드시 환자에게 실질적으로 중요한 변화라는 뜻은 아니므로 두 관점을 함께 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:11, origN:11, round:1, display:"제1회 11번", verified:false, q:"MMPI 프로파일을 토대로 임상적 특징, 가능한 진단명, 방어기제를 기술하시오.", points:6, keypoints:[{label:"프로파일 해석",min:3,pool:[{t:"L·K가 높고 F가 낮아 방어적·좋게 보이려는 반응양식을 시사한다",ac:["방어적","좋게 보이려는"]},{t:"1-3 상승은 신체적 호소·부인·억압 경향을 시사할 수 있다",ac:["1-3","신체적 호소"]},{t:"부인과 억압을 방어기제로 가설화할 수 있다",ac:["부인","억압"]}]}], explain:"시험 대비: 원자료가 요구하는 방향은 1-3 상승쌍과 방어적 프로파일을 근거로 전환장애 가능성, 부인·억압 등의 방어기제를 기술하는 것이다.\\n\\n실제 이해: MMPI 코드타입만으로 전환장애를 진단할 수 없다. 1-3 상승은 신체적 호소와 부인·억압 경향을 가설화하는 자료이며, 진단은 증상기준·면담·의학적 평가를 함께 보아야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료-내용 충돌: 1-3 코드만으로 전환장애를 확정할 수 없음."] },

{ level:2, y:2012, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"심리평가 보고서에서 심리검사 결과와 생활사적 정보를 통합하는 이유를 기술하시오.", points:5, keypoints:[{label:"통합 이유",min:3,pool:[{t:"검사결과를 개인의 발달·환경 맥락에서 이해하기 위해",ac:["발달 맥락","환경 맥락"]},{t:"여러 자료원 간 일치·불일치를 확인해 해석오류를 줄이기 위해",ac:["자료원","해석오류"]},{t:"사례개념화와 권고의 타당성을 높이기 위해",ac:["사례개념화","권고"]}]}], explain:"심리검사를 단순히 주관적 자료, 생활사를 객관적 자료로 나누는 것은 부정확하다. 서로 다른 자료를 통합해 더 타당한 해석을 만드는 것이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “심리검사=주관적/생활사=객관적” 이분법 수정."] },

{ level:2, y:2012, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"아동 PTSD에서 성인과 차별되는 외상사건 재경험의 특징적 준거 3가지를 제시하시오.", points:6, keypoints:[{label:"아동 재경험 특징 3가지",min:3,pool:[{t:"외상 주제나 측면이 반복 놀이로 표현될 수 있다",ac:["반복 놀이","외상 주제"]},{t:"내용을 분명히 알아보기 어려운 무서운 꿈이 나타날 수 있다",ac:["무서운 꿈","악몽"]},{t:"해리반응이나 외상 재현이 놀이로 나타날 수 있다",ac:["해리반응","놀이 재현"]},{t:"침투적 기억이 반복적으로 떠오를 수 있다",ac:["침투적 기억"]}]}], explain:"아동은 외상 기억을 언어로 명확히 설명하기보다 놀이와 꿈, 행동적 재현으로 나타낼 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"재활모형에서 손상, 장애, 핸디캡의 의미와 개입방법의 예를 설명하시오.", points:5, keypoints:[{label:"세 개념",min:3,pool:[{t:"손상: 신체·심리 구조나 기능의 손실·이상",ac:["손상","impairment"]},{t:"장애: 손상으로 활동 수행능력이 제한된 상태",ac:["장애","disability"]},{t:"핸디캡: 역할수행과 사회참여에서 불이익이 생긴 상태",ac:["핸디캡","handicap","사회적 불이익"]}]},{label:"개입 수준",min:2,pool:[{t:"손상에는 의학·심리치료 등 기능손상 자체에 대한 개입",ac:["임상적 치료"]},{t:"장애에는 기능훈련·재활, 핸디캡에는 환경·사회체계 조정",ac:["기능훈련","사회체계"]}]}], explain:"구분은 손상 자체, 활동수행의 제한, 사회적 역할과 참여의 불이익이라는 서로 다른 수준을 설명한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"상담에서 내담자가 침묵을 지키는 이유 6가지를 기술하시오.", points:6, keypoints:[{label:"침묵의 이유 6가지",min:6,pool:[{t:"초기 관계에서 불안·두려움을 느낀다",ac:["불안","두려움"]},{t:"상담자에 대한 적대감·저항이 있다",ac:["적대감","저항"]},{t:"논의한 내용을 생각하고 정리한다",ac:["음미","정리"]},{t:"강한 감정표현 뒤 휴식·회복이 필요하다",ac:["감정표현","회복"]},{t:"상담자의 반응이나 해석을 기다린다",ac:["해석 기대","반응 기다림"]},{t:"무슨 말을 해야 할지 모른다",ac:["무슨 말","모름"]}]}], explain:"침묵은 저항만을 뜻하지 않고 사고정리, 감정처리, 불안, 관계시험 등 다양한 기능을 가질 수 있어 맥락적으로 탐색해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"현 병력(History of Present Illness)에 포함되어야 할 사항 5가지를 쓰시오.", points:5, keypoints:[{label:"현 병력 5가지",min:5,pool:[{t:"증상의 시작 시점과 발병 양상",ac:["발병 시점","시작"]},{t:"유발·악화·완화 요인",ac:["유발요인","악화요인"]},{t:"현재 평가를 받게 된 직접적 이유",ac:["내원 이유","평가 이유"]},{t:"증상 시작 당시 생활상황과 스트레스",ac:["생활상황","스트레스"]},{t:"증상의 경과와 현재 기능에 미친 영향",ac:["경과","기능 영향"]}]}], explain:"현 병력은 현재 문제의 발병, 경과, 유발요인, 기능영향과 내원 이유를 시간순으로 정리하는 것이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"엘리스가 제시한 비합리적 신념을 5가지 쓰시오.", points:5, keypoints:[{label:"비합리적 신념 5가지",min:5,pool:[{t:"모든 중요한 사람에게 사랑과 인정을 받아야 한다",ac:["사랑과 인정"]},{t:"모든 면에서 유능하고 성취적이어야 한다",ac:["유능","성취"]},{t:"원하는 대로 되지 않으면 끔찍하고 견딜 수 없다",ac:["끔찍","견딜 수 없다"]},{t:"어려움과 책임은 직면하기보다 피하는 것이 쉽다",ac:["회피","책임"]},{t:"자신보다 강한 타인에게 의존해야 한다",ac:["의존"]}]}], explain:"REBT는 이런 절대적 당위와 파국화, 낮은 좌절인내력을 비합리적 신념으로 보고 논박한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2012, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"상담의 윤리문제와 관련하여 상담자가 알고 있어야 할 행동지침 5가지를 기술하시오.", points:7, keypoints:[{label:"행동지침 5가지",min:5,pool:[{t:"개인적 욕구의 영향을 자각한다",ac:["개인적 욕구 자각"]},{t:"욕구충족을 위해 내담자를 이용하지 않는다",ac:["내담자 이용 금지"]},{t:"부적절한 다중관계를 피한다",ac:["다중관계","이중관계"]},{t:"자신의 태도·가치관의 영향을 점검한다",ac:["가치관 영향"]},{t:"비밀보장과 그 한계를 준수한다",ac:["비밀보장"]}]}], explain:"상담자는 개인적 욕구와 가치가 전문관계를 왜곡하지 않도록 점검하고 착취적 관계를 피하며 비밀보장을 지켜야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:13, origN:13, round:1, display:"제1회 13번", verified:false, q:"KEDI-WISC 프로파일을 토대로 임상심리사가 할 수 있는 자문이나 치료적 개입 조언 5가지를 기술하시오.", points:5, keypoints:[{label:"자문·개입",min:4,pool:[{t:"낮은 전반적 지적수준과 학업기능을 추가평가한다",ac:["학업기능","추가평가"]},{t:"주의집중 문제는 행동평정·면담 등으로 ADHD를 감별한다",ac:["ADHD 감별","행동평정"]},{t:"학습장애 가능성은 성취도검사와 교육자료로 확인한다",ac:["학습장애","성취도검사"]},{t:"부모의 과잉보호와 양육방식을 다루는 부모상담을 한다",ac:["부모상담","부모훈련"]},{t:"또래관계 개선을 위한 사회기술훈련을 고려한다",ac:["사회기술훈련","또래관계"]}]}], explain:"시험 대비: 원자료가 제시한 KEDI-WISC 프로파일을 바탕으로 지적수준·주의집중·학습문제·부모양육·또래관계에 관한 자문 및 개입을 제시한다.\\n\\n실제 이해: IQ와 일부 소검사 저점만으로 경계선지능, ADHD, 학습장애를 확정하지 않는다. 행동평정, 성취도검사, 면담, 발달력 등 추가자료로 감별한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료-내용 충돌: 단일 지능검사 프로파일로 ADHD·학습장애를 진단할 수 없음."] },

{ level:2, y:2013, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"재활모형에서 손상, 장애, 핸디캡의 의미와 개입방법상의 차이를 설명하시오.", points:5, keypoints:[{label:"세 개념",min:3,pool:[{t:"손상: 구조·기능의 손실이나 이상",ac:["손상","impairment"]},{t:"장애: 활동수행의 제한",ac:["장애","disability"]},{t:"핸디캡: 역할·사회참여에서의 불이익",ac:["핸디캡","사회적 불이익"]}]},{label:"개입",min:2,pool:[{t:"손상은 치료, 장애는 기능재활, 핸디캡은 환경·사회체계 조정을 강조한다",ac:["치료","기능재활","사회체계"]}]}], explain:"각 수준에 맞춰 기능손상 자체, 활동능력, 사회참여 환경을 구분해 개입한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"소크라테스식 질문법을 사용할 때 유의사항 6가지를 쓰시오.", points:6, keypoints:[{label:"유의사항 6가지",min:6,pool:[{t:"변화 가능성을 발견하게 하는 질문을 한다",ac:["변화 가능성"]},{t:"유용한 학습·성과를 얻도록 돕는 질문을 한다",ac:["성과","유용한 질문"]},{t:"내담자가 스스로 탐색하도록 참여시킨다",ac:["학습과정 참여"]},{t:"내담자의 인지수준과 현재 상태에 맞춘다",ac:["도움되는 수준","인지수준"]},{t:"정해진 결론으로 유도하지 않는다",ac:["유도질문 금지"]},{t:"불필요한 선다형 질문을 남용하지 않는다",ac:["선다형 질문"]}]}], explain:"소크라테스식 질문은 치료자의 결론을 주입하는 심문이 아니라 내담자가 스스로 증거와 대안을 탐색하도록 돕는 협력적 질문이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"자문의 정신건강 모델과 행동주의 모델의 차이점을 설명하시오.", points:4, keypoints:[{label:"정신건강 모델",min:2,pool:[{t:"피자문자의 문제해결능력을 강조한다",ac:["문제해결능력"]},{t:"자문가와 피자문자의 평등·협력관계를 강조한다",ac:["평등관계","협력"]}]},{label:"행동주의 모델",min:2,pool:[{t:"행동분석과 행동원리에 대한 전문지식을 중심으로 한다",ac:["행동분석","행동지식"]},{t:"역할분담이 비교적 명확하고 자문가의 전문성이 강조된다",ac:["역할 구분","전문성"]}]}], explain:"두 모델은 모두 협력할 수 있지만 정신건강 모델은 피자문자의 역량강화, 행동주의 모델은 행동기능분석과 구체적 개입설계에 더 무게를 둔다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"심리평가의 목적을 크게 3가지로 구분하시오.", points:6, keypoints:[{label:"심리평가 목적 3가지",min:3,pool:[{t:"임상적 진단과 문제의 명료화",ac:["임상적 진단","문제 명료화"]},{t:"인지·성격·자아기능 등 심리적 기능의 평가",ac:["자아기능","심리적 기능"]},{t:"치료계획 수립과 개입효과 평가",ac:["치료전략","치료계획","효과 평가"]}]}], explain:"심리평가는 진단명 결정만이 아니라 기능을 이해하고 치료방향과 변화정도를 판단하는 데 사용된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"피아제의 전조작기, 구체적 조작기, 형식적 조작기 아동·청소년 상담의 특성과 주의사항을 쓰시오.", points:6, keypoints:[{label:"전조작기",min:2,pool:[{t:"추상적 논리보다 놀이·그림·구체적 감각자료를 활용한다",ac:["놀이","구체적 자료"]},{t:"자기중심성과 제한된 관점수용을 고려한다",ac:["자기중심성"]}]},{label:"구체적 조작기",min:2,pool:[{t:"구체적 사례·역할연기·독서 등 현실적 자료를 활용한다",ac:["역할연기","독서치료","구체적 사례"]},{t:"타인의 관점을 이해하는 능력을 활용한다",ac:["관점수용"]}]},{label:"형식적 조작기",min:2,pool:[{t:"추상적 사고와 가설검토를 활용한다",ac:["추상적 사고","가설"]},{t:"자의식·또래영향과 정서적 민감성을 고려한다",ac:["자의식","또래","정서적 민감성"]}]}], explain:"상담방법은 발달수준에 맞춰 구체적 활동에서 추상적 대화로 점진적으로 확장해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2013, n:19, origN:19, round:1, display:"제1회 19번", verified:true, q:"벡의 사고기록지 5개 칼럼 내용을 쓰시오.", points:5, keypoints:[{label:"사고기록지 5개 칼럼",min:5,pool:[{t:"상황",ac:["상황"]},{t:"감정",ac:["감정"]},{t:"자동적 사고",ac:["자동적 사고"]},{t:"합리적 반응·대안적 사고",ac:["합리적 반응","대안적 사고"]},{t:"결과·재평가",ac:["결과","재평가"]}]}], explain:"사고기록지는 상황과 감정, 자동사고, 대안적 반응, 결과를 기록해 사고와 정서의 연결을 점검한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:1, origN:1, round:1, display:"1번", verified:true, q:"1. HTP검사에서 사람(Person) 그림을 통해 평가할 수 있는 측면 3가지를 쓰시오. 5점", points:5, keypoints:[{label:"사람 그림에서 평가 가능한 측면 3가지",min:3,pool:[{t:"현재의 자아상(자화상)",ac:["현재의 자아","자화상"]},{t:"이상적으로 바라는 자아상",ac:["이상적 자아","이상적인 자아"]},{t:"자신에게 영향을 미치는 중요한 타인",ac:["중요한 타인","중요 인물"]}]}], explain:"HTP의 사람 그림은 수검자가 자신을 어떻게 지각하는지뿐 아니라 이상적으로 되고 싶은 모습과 심리적으로 중요한 타인을 투영할 수 있다. 따라서 현재의 자아상, 이상적 자아상, 중요한 타인과 관련된 표상을 중심으로 기술하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:2, origN:2, round:1, display:"2번", verified:true, q:"2. 웩슬러 지능검사(WISC-III)의 언어성 소검사와 동작성 소검사를 각각 3가지씩 쓰고, 해당 소검사가 무엇을 측정하는지 기술하시오. 6점(08기출)", points:6, keypoints:[{label:"언어성 소검사 3가지와 측정 내용",min:3,pool:[{t:"상식(Information): 일반지식·장기기억·학습경험",ac:["상식 일반지식","상식 장기기억"]},{t:"공통성(Similarities): 언어적 개념형성·추상적 사고",ac:["공통성 개념형성","공통성 추상적 사고"]},{t:"산수(Arithmetic): 수리추론·주의집중·작업기억",ac:["산수 주의집중","산수 작업기억","산수 수리추론"]},{t:"어휘(Vocabulary): 어휘지식·언어발달·학습경험",ac:["어휘 어휘지식","어휘 언어발달"]},{t:"이해(Comprehension): 사회적 판단·실제적 지식의 적용",ac:["이해 사회적 판단","이해 실제적 지식"]},{t:"숫자(Digit Span): 청각적 주의집중·단기/작업기억",ac:["숫자 주의집중","숫자 단기기억","숫자 작업기억"]}]},{label:"동작성 소검사 3가지와 측정 내용",min:3,pool:[{t:"빠진 곳 찾기(Picture Completion): 시각적 주의·세부지각",ac:["빠진곳찾기 시각적 주의","빠진 곳 찾기 세부지각"]},{t:"기호쓰기(Coding): 처리속도·시각운동 협응·주의집중",ac:["기호쓰기 처리속도","기호쓰기 시각운동","기호쓰기 주의집중"]},{t:"차례 맞추기(Picture Arrangement): 사회적 상황의 이해·계열화",ac:["차례맞추기 계열화","차례 맞추기 사회적 상황"]},{t:"토막짜기(Block Design): 시공간 구성·비언어적 추론",ac:["토막짜기 시공간","토막짜기 구성능력"]},{t:"모양맞추기(Object Assembly): 시각적 부분-전체 통합·구성",ac:["모양맞추기 부분 전체","모양맞추기 시각적 구성"]},{t:"동형찾기(Symbol Search): 시각적 탐색·처리속도",ac:["동형찾기 처리속도","동형찾기 시각적 탐색"]},{t:"미로(Mazes): 계획능력·시각운동 통제",ac:["미로 계획능력","미로 시각운동"]}]}], explain:"WISC-III에서는 언어성 소검사와 동작성 소검사를 구분해 해석했다. 답안은 각 영역에서 세 소검사를 고르고, 단순히 검사명만 쓰지 말고 해당 소검사가 주로 요구하는 인지 기능을 짝지어 제시해야 한다. 원자료의 일부 측정 설명은 지나치게 단순하거나 부정확해 표준적인 해석으로 정리했다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 '상식=선천적 능력' 표현은 부정확하여 일반지식·학습경험·장기기억 중심으로 수정"] },

{ level:2, y:2014, n:3, origN:3, round:1, display:"3번", verified:true, q:"3. 웩슬러 지능검사(K-WAIS)의 언어성 소검사 중 기본지식(Information)이 측정하는 측면 5가지를 쓰시오. 5점", points:5, keypoints:[{label:"기본지식 소검사가 반영하는 측면 5가지",min:5,pool:[{t:"일반적·일상적 지식의 폭",ac:["일상지식의 범위","일반지식"]},{t:"과거의 학습경험과 학교교육",ac:["과거 학습","학교 교육"]},{t:"지적 호기심",ac:["지적호기심"]},{t:"환경·일상세계에 대한 관심",ac:["일상세계에 대한 관심","환경에 대한 관심"]},{t:"장기기억과 학습된 정보의 회상",ac:["장기기억","장기 기억"]}]}], explain:"기본지식 소검사는 학교교육과 일상 경험을 통해 축적된 일반지식을 얼마나 습득하고 장기기억에서 인출하는지를 본다. 따라서 지식의 폭, 교육·학습 경험, 지적 호기심과 환경에 대한 관심, 장기기억을 중심으로 답하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:4, origN:4, round:1, display:"4번", verified:true, q:"4. 경청의 행동 2가지를 설명하시오. 2점", points:2, keypoints:[{label:"경청 행동 2가지",min:2,pool:[{t:"비언어적 경청: 눈맞춤·끄덕임·표정·자세 등으로 관심을 전달",ac:["비언어적 경청","눈맞춤 끄덕임"]},{t:"언어적 경청: 짧은 언어적 격려·촉진 반응으로 계속 말하도록 돕기",ac:["언어적 경청","언어적 격려","최소 촉진"]}]}], explain:"경청은 말의 내용만 듣는 것이 아니라 비언어적 태도와 언어적 촉진을 함께 사용하는 과정이다. 비언어적 경청은 눈맞춤·표정·자세 등으로 관심을 전달하고, 언어적 경청은 '네', '그렇군요' 같은 짧은 반응으로 내담자의 표현을 촉진한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:5, origN:5, round:1, display:"5번", verified:true, q:"5. 다음 보기의 사례를 읽고 물음에 답하시오. 8점(04, 06년 기출)\n박모씨는 올해 53세로 중졸이며, 목수일로 생계를 유지하고 있다. 박모씨는 몇 달 전 오토바이를 타고 가다가 승용차와 충돌하여 의식을 잃고 병원으로 후송되었다. 다행히 40여 일 만에 의식을 회복했으나 이후로 어깨가 결리고, 사지가 아프며, 좀처럼 깊이 잠을 들 수 없다고 호소하였다.\n(1) 박모씨에게 나타날 수 있는 또 다른 증상들을 2가지 제시하시오.\n(2) 감별진단 2가지를 제시하시오(DSM-5 기준).\n(3) 심리검사 중 위스콘신 카드검사가 포함되었다. 이는 무엇을 확인하기 위한 것인가\n(4) 예후와 관련된 요인을 2가지 제시하시오.", points:8, keypoints:[{label:"(1) 추가로 나타날 수 있는 증상 2가지",min:2,pool:[{t:"외상 사건 전후에 대한 기억장애",ac:["기억상실","기억장애"]},{t:"불안·공포·무력감 같은 정서 증상",ac:["불안 공포","불안 무력감"]},{t:"주의집중력 저하",ac:["주의집중 저하","집중력 저하"]}]},{label:"(2) 감별진단 2가지",min:2,pool:[{t:"외상후스트레스장애(PTSD)",ac:["ptsd","외상 후 스트레스 장애"]},{t:"전환장애(기능성 신경학적 증상장애)",ac:["전환장애","기능성 신경학적 증상장애"]}]},{label:"(3) 위스콘신 카드분류검사의 평가 기능",min:1,pool:[{t:"추상적 개념형성 및 인지적 유연성·세트 전환 같은 집행기능",ac:["인지적 유연성","세트 전환","추상적 개념형성","집행기능"]}]},{label:"(4) 예후 관련 요인 2가지",min:2,pool:[{t:"의식상실의 유무와 지속시간·회복까지 걸린 시간",ac:["의식상실 시간","의식회복 시간"]},{t:"연령과 노화에 따른 인지기능 저하 가능성",ac:["연령","노화 인지기능"]}]}], explain:"이 사례는 교통사고와 장기간 의식상실 이후의 상태를 다루므로 외상 관련 증상과 신경인지적 후유증을 함께 살펴야 한다. 원자료가 제시한 감별진단은 PTSD와 전환장애이며, 이는 '확정 진단'이 아니라 배제·감별할 가능성으로 이해하는 것이 안전하다. WCST는 단순한 선택적 주의만이 아니라 추상적 개념형성, 규칙 전환, 인지적 유연성과 같은 집행기능 평가에 주로 사용된다. 예후는 의식상실의 정도·기간과 연령 등 신경학적 회복에 영향을 미치는 요인을 고려한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["감별진단은 원자료 답안을 유지하되 사례만으로 확정진단하지 않도록 표현 완화","WCST는 원자료의 '추상적 사고/선택적 주의'보다 집행기능·인지적 유연성·set shifting 중심으로 보정"] },

{ level:2, y:2014, n:6, origN:6, round:1, display:"6번", verified:true, q:"6 소크라테스식 대화의 특징을 3가지 제시하고, 소크라테스식 대화의 구체적인 예를 2가지 쓰시오. 5점(17년 기출)\n(1) 소크라테스식 대화의 특징\n(2) 구체적인 예", points:5, keypoints:[{label:"소크라테스식 대화의 특징 3가지",min:3,pool:[{t:"질문을 통해 대안적 관점·해결책을 스스로 탐색하게 한다",ac:["대안적 해결책 탐색","대안적 관점"]},{t:"내담자가 자신의 경험과 생각을 구체적으로 검토하도록 유도한다",ac:["경험을 자세히 진술","생각을 검토"]},{t:"비판단적·협력적 태도로 역기능적 신념을 재평가하게 한다",ac:["비판단적","역기능적 신념 재평가"]}]},{label:"구체적인 질문 예 2가지",min:2,pool:[{t:"논리적 검토: 그 믿음이 반드시 참이라는 논리적 근거는 무엇인가?",ac:["논리적 근거","논리적 논박"]},{t:"경험적 검토: 실제 경험이나 증거가 그 믿음을 뒷받침하는가?",ac:["경험적 근거","경험적 논박"]},{t:"대안 탐색: 다른 설명이나 더 타당한 생각은 없는가?",ac:["대안적 신념","다른 설명"]}]}], explain:"소크라테스식 대화는 치료자가 정답을 가르치는 방식이 아니라 질문을 통해 내담자가 자신의 생각을 검토하고 대안을 발견하게 하는 협력적 탐색이다. 특징과 함께 실제 질문 예시를 써야 하며, 논리적 근거·경험적 증거·대안적 설명을 묻는 질문이 대표적이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:7, origN:7, round:1, display:"7번", verified:true, q:"7. 만성 정신질환을 가지고 있는 환자의 치료 및 재활을 위한 가족성원의 올바른 태도와 피해야 할 태도를 각각 5가지 제시하시오. 10점(05, 20년 기출)\n(1) 올바른 태도-\n(2) 피해야 할 태도-", points:10, keypoints:[{label:"가족의 올바른 태도 5가지",min:5,pool:[{t:"환자의 재활과 독립적 기능 회복을 격려한다",ac:["재활을 격려","재활 격려"]},{t:"처방된 약물복용과 치료 참여를 지지한다",ac:["약 복용 격려","약물복용 지지"]},{t:"현재 기능에 맞는 현실적인 기대를 갖는다",ac:["기대치 낮추기","현실적 기대"]},{t:"필요한 서비스와 권리를 얻도록 환자의 입장을 지지한다",ac:["환자의 입장 대변","권리 옹호"]},{t:"차분하고 안정적인 가정 분위기를 유지한다",ac:["차분한 집안 분위기","안정적 가정 분위기"]}]},{label:"피해야 할 태도 5가지",min:5,pool:[{t:"환자에게 과잉개입·과보호한다",ac:["과잉 개입","과보호"]},{t:"단기간에 완전히 호전될 것이라고 비현실적으로 기대한다",ac:["금세 호전","빠른 호전 기대"]},{t:"지나친 비난·잔소리·적대적 태도를 보인다",ac:["지나친 잔소리","비난 적대"]},{t:"작은 호전과 노력을 당연시하거나 무시한다",ac:["작은 호전을 당연시","호전 무시"]},{t:"가족 내에서 따돌리거나 친구·사회적 교류를 억제한다",ac:["가족 내 따돌림","친구 교류 억제"]}]}], explain:"만성 정신질환의 재활에서 가족은 치료 참여와 기능 회복을 지지하되 과도하게 통제하거나 비현실적인 기대를 강요하지 않는 것이 중요하다. 안정적이고 비비판적인 환경, 현실적인 기대, 치료·약물복용 지지가 도움이 되며, 과잉개입·비난·사회적 고립은 피해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:8, origN:8, round:1, display:"8번", verified:true, q:"8. 심리검사의 올바른 해석을 위한 해석지침을 4가지 쓰시오. 4점", points:4, keypoints:[{label:"심리검사 해석지침 4가지",min:4,pool:[{t:"검사 해석의 기본 관점과 가설을 수립한다",ac:["기본관점 수립","기본 관점"]},{t:"규준·점수의 통계적 의미를 고려해 해석한다",ac:["통계적 해석","규준 해석"]},{t:"개인 간 차이와 개인 내 차이를 구분해 명료화한다",ac:["개인 간 차이","개인 내 차이"]},{t:"측정오차와 신뢰구간을 고려한다",ac:["측정오차","오차 고려"]}]}], explain:"심리검사 점수는 절대값처럼 단정해서 해석하면 안 된다. 해석의 관점과 가설을 세우고 규준과 통계적 의미를 확인하며, 타인과 비교한 개인 간 차이와 한 개인 내부의 강·약점 차이를 구분하고, 측정오차를 고려해 결론의 확실성 수준을 조절해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:9, origN:9, round:1, display:"9번", verified:true, q:"9. 반복적으로 또래친구들을 괴롭히며 교사에게 반항하는 아동의 문제를 호소하는 초등학교 3학년 담임선생님에게 자문을 하고자 한다. 해당 아동의 문제를 해결하는 데 도움을 줄 수 있는 조언을 4가지 쓰시오.\n4점(08년 기출)", points:4, keypoints:[{label:"교사에게 제안할 행동관리 방법 4가지",min:4,pool:[{t:"학급 규칙과 기대행동을 구체적으로 제시한다",ac:["학급 규칙 제시","규칙 제시"]},{t:"적절한 행동에 관심과 칭찬을 제공한다",ac:["관심과 칭찬","긍정적 강화"]},{t:"토큰강화·토큰경제를 활용한다",ac:["토큰강화","토큰 경제"]},{t:"필요할 때 타임아웃 등 일관된 결과를 적용한다",ac:["고립","타임아웃"]}]}], explain:"반항적·공격적 행동에 대한 자문은 문제행동만 처벌하기보다 기대행동을 명확히 하고 적절한 행동을 강화하는 방식이 중심이 된다. 규칙을 구체화하고 칭찬·토큰강화를 사용하며, 규칙 위반에는 타임아웃과 같은 예측 가능하고 일관된 결과를 적용할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:10, origN:10, round:1, display:"10번", verified:true, q:"10. 심리평가자의 역할과 관련하여 심리평가자의 ‘과학자로서의 자질’과 ‘예술가로서의 자질’에 대해 설명하시오. 6점(11년 기출)", points:6, keypoints:[{label:"과학자로서의 자질",min:1,pool:[{t:"표준화된 방법·전문지식·객관적 자료와 논리적 검증에 근거해 평가한다",ac:["객관적이고 타당한 방법","논리적 검증"]}]},{label:"예술가로서의 자질",min:1,pool:[{t:"임상경험과 맥락을 바탕으로 여러 자료를 통합해 개인에게 의미 있게 해석한다",ac:["평가경험과 치료경험","통찰력","자료 통합"]}]}], explain:"심리평가는 과학적 측정과 임상적 통합이 함께 필요하다. 과학자로서는 신뢰할 수 있는 검사와 객관적 근거를 사용하고, 예술가로서는 검사점수·면담·행동관찰·생활맥락을 임상경험과 통찰을 통해 한 사람의 사례로 통합한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:11, origN:11, round:1, display:"11번", verified:true, q:"11 인간중심 상담에서 로저스(Rogers)가 강조한 치료자의 특성을 3가지 쓰시오. 6점(08, 10, 17, 18년 기출)", points:6, keypoints:[{label:"로저스의 치료자 핵심조건 3가지",min:3,pool:[{t:"무조건적 긍정적 존중",ac:["무조건적 긍정적 존중","무조건적 수용"]},{t:"공감적 이해",ac:["공감적 이해","공감"]},{t:"일치성·진실성",ac:["일치성","진실성","진솔성"]}]}], explain:"인간중심 상담에서 치료적 관계의 핵심조건은 무조건적 긍정적 존중, 공감적 이해, 일치성(진실성)이다. 내담자를 조건 없이 존중하고 그의 내적 경험을 정확히 이해하려 하며, 치료자 자신도 가식 없이 진실하게 관계에 참여해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:12, origN:12, round:1, display:"12번", verified:true, q:"12. 관찰학습이 효과적으로 일어날 수 있는 조건을 4가지 기술하시오. 4점", points:4, keypoints:[{label:"관찰학습의 4과정",min:4,pool:[{t:"주의과정: 모델의 행동에 주의를 기울인다",ac:["주의과정","주의 집중"]},{t:"파지과정: 관찰한 정보를 기억에 유지한다",ac:["파지과정","정보의 유지","기억 유지"]},{t:"운동재생과정: 관찰한 행동을 실제로 재현한다",ac:["운동재생","행동 재현"]},{t:"동기과정: 행동을 수행할 동기와 강화가 있어야 한다",ac:["동기과정","동기화"]}]}], explain:"반두라의 관찰학습은 모델을 보는 것만으로 끝나지 않는다. 모델의 행동에 주의를 기울이고, 관찰 내용을 기억에 저장한 뒤, 실제 행동으로 재현할 수 있어야 하며, 그 행동을 실행할 동기나 기대되는 강화가 있어야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:13, origN:13, round:1, display:"13번", verified:true, q:"13 집단상담의 일반적인 치료적 요인을 5가지 기술하시오. 5점(09, 12, 13, 14, 17, 18년 기출)", points:5, keypoints:[{label:"집단상담 치료요인 5가지",min:5,pool:[{t:"이타심",ac:["이타심","이타주의"]},{t:"모방행동",ac:["모방행동","모델링"]},{t:"집단응집력",ac:["집단응집력","응집력"]},{t:"정화(카타르시스)",ac:["정화","카타르시스"]},{t:"보편성",ac:["보편성"]},{t:"희망의 고취",ac:["희망의 고취","희망 고취"]}]}], explain:"집단상담에서는 다른 성원을 돕는 경험에서 얻는 이타심, 다른 사람의 행동을 보고 배우는 모방행동, 소속감과 수용을 주는 집단응집력, 억눌린 감정을 표현하는 정화, 나만의 문제가 아님을 깨닫는 보편성, 변화 가능성을 보며 얻는 희망 등이 치료적 변화를 촉진한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:14, origN:14, round:1, display:"14번", verified:true, q:"14. 다음 보기의 사례를 읽고 물음에 답하시오. 7점(09년 기출) - 본래 문제는 DSM-4진단기준임.\n올해 10세로 초등학교 3학년인 A군은 부모나 또래친구들과의 사회적 관계에서 문제 증상을 나타내 보이고 있다. A군의 부모는 A군이 부모인 자신들을 회피하려는 모습을 보인다고 주장하면서, A군의 사회성에 문제가 있는 것은 아닌지 알아보고자 내원하였다. 면담 과정에서 A군의 부모가 A군이 어렸을 때부터 맞벌이를 하였고, 그로 인해 A군이 할머니에게서 양육되었다는 사실이 알려졌다. A군에 대한 검사 결과 반응성 애착장애의 진단이 내려졌다.\n(1) 반응성 애착장애의 2가지 양상을 기술하시오. -DSM4버전\n①\n(2) 양육의 병리성 여부를 판단하는 기준 3가지를 기술하시오.\n(1) 반응성 애착장애의 2가지 양상을 기술하시오. -DSM5버전", points:7, keypoints:[{label:"(1) DSM-IV의 두 양상",min:2,pool:[{t:"억제형: 발달수준에 맞는 사회적 상호작용을 시작하거나 반응하지 못하고 지나치게 억제된 양상",ac:["억제형","사회적 상호작용 실패"]},{t:"탈억제형: 낯선 사람에게도 무분별하게 친밀함을 보이는 양상",ac:["탈억제형","무분별한 사교성"]}]},{label:"(2) 병리적 양육·불충분한 돌봄의 기준 3가지",min:3,pool:[{t:"위안·자극·애정 등 기본적 정서욕구의 지속적 방치",ac:["정서적 욕구 방치","애정 위안 방치"]},{t:"기본적인 신체적 욕구의 지속적 방치",ac:["신체적 욕구 방치","신체적 방치"]},{t:"주양육자의 반복적 교체 등 안정적 애착 형성을 방해하는 환경",ac:["양육자 반복 교체","안정적 애착형성 방해"]}]},{label:"(3) DSM-5 RAD 핵심 양상",min:2,pool:[{t:"성인 양육자에 대해 일관되게 정서적으로 위축되어 위로를 거의 구하거나 받아들이지 않는다",ac:["위로를 구하지 않음","위로에 반응하지 않음","정서적으로 위축"]},{t:"사회·정서적 반응이 제한되고 긍정정서가 적거나 설명하기 어려운 부정정서를 보인다",ac:["사회 정서적 반응 제한","긍정정서 제한","설명하기 어려운 부정정서"]}]}], explain:"DSM-IV에서는 반응성 애착장애를 억제형과 탈억제형의 두 양상으로 기술했다. 그러나 DSM-5에서는 이 둘을 하나의 장애의 하위유형으로 두지 않고, 억제·위축 양상은 반응성 애착장애(RAD), 무분별한 친화 행동은 탈억제성 사회적 유대감 장애(DSED)라는 별도 진단으로 분리했다. 따라서 현대 기준을 설명할 때는 RAD의 위축된 애착행동과 지속적인 사회·정서적 장해를 중심으로 답하고, 과거의 '무분별한 사교성'을 DSM-5 RAD의 두 번째 양상으로 쓰면 안 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:["DSM-IV의 두 하위양상과 DSM-5의 RAD/DSED 분리를 명확히 구분"] },

{ level:2, y:2014, n:15, origN:15, round:1, display:"15번", verified:true, q:"15. 인지·정서·행동적 상담(REBT)의 ABCDE 모델에 기초하여 치료계획을 세우시오. 10점", points:10, keypoints:[{label:"REBT 치료계획의 핵심 단계",min:5,pool:[{t:"A(선행사건)와 C(정서·행동 결과)를 구체화한다",ac:["선행사건과 결과 확인","a와 c 확인"]},{t:"B에서 비합리적 신념을 찾아 합리적 신념과 구분한다",ac:["비합리적 신념 발견","합리적 비합리적 신념 구분"]},{t:"D에서 비합리적 신념을 논박한다",ac:["비합리적 신념 논박","논박"]},{t:"E에서 더 효과적이고 합리적인 새로운 신념을 형성한다",ac:["합리적 신념으로 변화","효과적 신념"]},{t:"새 신념에 따른 합리적 행동을 실제 생활에서 연습한다",ac:["합리적 행동 적용","행동 연습"]},{t:"새로운 사고·행동을 반복 연습하고 유지하도록 지지한다",ac:["반복학습","유지하도록 지지"]}]}], explain:"REBT에서는 사건(A)이 직접 정서·행동 결과(C)를 만드는 것이 아니라 사건을 해석하는 신념(B)이 중요한 매개라고 본다. 치료에서는 A와 C를 명료화하고 B의 비합리성을 찾아 D에서 논박한 뒤, E에서 더 합리적이고 효과적인 신념을 형성한다. 이후 새 신념에 맞는 행동을 실제 생활에서 연습하고 반복해 유지하도록 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:16, origN:16, round:1, display:"16번", verified:true, q:"16. 청소년 상담을 포함하여 일반적인 상담의 종결 과정에서 다루어야 할 사항을 5가지 기술하시오. 5점 (2020년 기출)", points:5, keypoints:[{label:"상담 종결에서 다룰 사항 5가지",min:5,pool:[{t:"상담과정과 초기 목표 달성 정도를 점검·평가한다",ac:["상담과정 점검","목표 달성 평가"]},{t:"앞으로 필요하면 다시 상담받을 수 있음을 안내한다",ac:["다시 상담할 수 있음","재상담 안내"]},{t:"종결과 이별에 대한 감정을 다룬다",ac:["이별감정 다루기","종결 감정"]},{t:"상담자에 대한 의존을 줄이고 자율적 대처를 강화한다",ac:["의존성 문제","자율성"]},{t:"추수상담·추후 점검 계획을 논의한다",ac:["추수상담","추후 점검"]}]}], explain:"종결은 상담을 단순히 끝내는 절차가 아니라 변화 내용을 정리하고 앞으로의 자립을 준비하는 단계다. 목표 달성을 평가하고 종결에 대한 감정을 다루며, 상담자 의존을 줄이고 스스로 대처할 수 있다는 감각을 강화한다. 재상담 가능성과 추수상담 계획도 함께 안내한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:17, origN:17, round:1, display:"17번", verified:true, q:"17. 다음 보기의 사례를 읽고 물음에 답하시오. 3점 (03, 05, 12, 18년 기출)\n“이건 정말 믿을 수가 없어요. 선생님, 지난번 상담을 받을 때 남편이 집에 일찍 들어오겠다고 약속했었잖아요? 그런데 정말로 남편이 제시간에 맞춰 집에 오더라고요. 그렇게 약속을 잘 지킬 줄 몰랐는데 정말 깜짝 놀랐다니까요.”\n보기에서 내담자의 말에 대한 상담자의 반영적 반응을 적절히 제시하시오.", points:3, keypoints:[{label:"감정 반영",min:1,pool:[{t:"남편이 실제로 약속을 지킨 것이 뜻밖이라 매우 놀랐다는 감정을 반영한다",ac:["뜻밖이라 놀랐","정말 지켜서 놀랐","무척 놀랐"]}]}], explain:"반영은 내담자의 말을 단순 반복하는 것이 아니라 그 말에 담긴 감정과 의미를 상담자가 다시 표현해 주는 기술이다. 이 사례에서는 남편이 약속을 실제로 지킨 일이 예상 밖이어서 내담자가 놀랐다는 감정을 짚어 주면 된다. 예: '남편이 정말 약속대로 일찍 들어오니 뜻밖이라 많이 놀라셨군요.'", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2014, n:18, origN:18, round:1, display:"18번", verified:true, q:"18 엘리스(Ellis)가 제시한 비합리적인 신념을 5가지 쓰시오. 5점(12, 14년)", points:5, keypoints:[{label:"대표적인 비합리적 신념 5가지",min:5,pool:[{t:"나는 중요한 모든 사람에게 사랑과 인정을 받아야 한다",ac:["모든 사람에게 사랑과 인정","사랑과 인정 받아야"]},{t:"나는 모든 면에서 유능하고 성취적이어야 가치가 있다",ac:["모든 면에서 유능","반드시 성취"]},{t:"일이 내가 원하는 대로 되지 않으면 끔찍하고 견딜 수 없다",ac:["원하는 대로 되지 않으면 끔찍","견딜 수 없다"]},{t:"어려움이나 책임에 맞서는 것보다 피하는 것이 더 쉽다",ac:["책임을 피하는 것이 쉽","난관을 피하는"]},{t:"나는 강한 타인에게 의존해야 하고 의지할 사람이 필요하다",ac:["타인에게 의지","강한 누군가 필요"]}]}], explain:"엘리스가 말한 비합리적 신념은 현실적 선호를 '반드시 그래야 한다'는 절대적 요구로 바꾸는 사고가 핵심이다. 타인의 인정, 완전한 유능성, 좌절에 대한 파국화, 책임 회피, 과도한 의존처럼 경직된 요구와 파국적 평가를 구체적으로 쓰면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점\nA씨는 올해 24세로 군 입대를 앞두고 병사용 진단서를 발급받기 위해 병사 진단용 검사에 의뢰되었다. MMPI 검사 결과 타당도척도에 대한 T점수가 L(38), F(112), K(36)으로 나타났다. 또한 임상척도에 대한 T점수에서 5번 Mf 척도를 제외한 대부분의 임상척도에서 높은 점수를 보였으며, 그 중 6번 Pa 척도, 7번Pt 척도, 8번 Sc 척도 점수에서 90 이상으로 다른 임상척도에 비해 높은 점수를 보였다. A씨는 자신이 평소 과대망상 증상을 보인다고 호소하였다.\n보기에서 A씨의 MMPI 검사 결과에 따라 유추 가능한 진단명과 함께 진단의 이유를 각각 기술하시오.\n(1) 진단명\n(2) 진단의 이유", points:6, keypoints:[{label:"검사 결과에서 의심할 수 있는 상태와 근거",min:2,pool:[{t:"꾀병 또는 의도적 증상 과장 가능성",ac:["malingering","의도적 증상 과장"]},{t:"F 척도의 극단적 상승과 낮은 L·K",ac:["F 112","F척도 극단적 상승"]},{t:"군입대 관련 외적 이득 가능성",ac:["군입대 회피","외적 이득","외적 동기"]}]}], explain:"이 프로파일은 비전형적 증상 보고나 의도적 과장을 의심하게 할 수 있고 군입대라는 외적 동기도 고려할 수 있다. 그러나 MMPI의 F 상승만으로 꾀병을 확정할 수는 없으므로 면담, 행동관찰, 다른 타당도 지표와 맥락을 함께 확인해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료는 꾀병을 확정적으로 제시함. 앱에서는 가능성 수준으로 완화."] },

{ level:2, y:2015, n:2, origN:2, round:1, display:"제1회 2번", verified:true, q:"MMPI 2개 척도에 대한 분석에서 4번과 9번 척도가 동시에 높을 때 나타나는 심리적 특징 4가지 기술하시오. 4점(06, 08, 11, 17년 기출)", points:4, keypoints:[{label:"4-9 상승쌍의 대표적 심리·행동 특성 4가지",min:4,pool:[{t:"충동적이고 행동화하기 쉽다",ac:["충동성","행동화"]},{t:"반항적·공격적 행동 경향",ac:["반항적","공격적"]},{t:"규범 위반·반사회적 행동 경향",ac:["규범 위반","반사회적 행동"]},{t:"자기중심적이고 책임감이 낮다",ac:["자기중심적","무책임"]},{t:"합리화 같은 외재화적 방어를 사용하기 쉽다",ac:["합리화"]}]}], explain:"MMPI 4(Pd)-9(Ma) 상승은 충동성, 자극추구, 행동화, 권위와 규범에 대한 저항 같은 외현화 특성을 시사할 수 있다. 코드유형은 진단명이 아니라 해석 가설이므로 반사회성이나 조증을 자동으로 진단해서는 안 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “양극성 장애 진단가능”은 코드유형만으로 확정할 수 없어 정답 포인트에서 제외."] },

{ level:2, y:2015, n:3, origN:3, round:1, display:"제1회 3번", verified:true, q:"벡(Beck)의 인지적 오류 6가지를 쓰고, 각각에 대해 설명 6점(07, 18년 기출)", points:6, keypoints:[{label:"Beck의 인지적 오류 6가지",min:6,pool:[{t:"임의적 추론",ac:["자의적 추론"]},{t:"과잉일반화",ac:["과도한 일반화"]},{t:"이분법적 사고",ac:["흑백논리","양극적 사고"]},{t:"재앙화",ac:["파국화"]},{t:"개인화",ac:["개인적 귀인"]},{t:"선택적 추상화",ac:["선택적 추출"]}]}], explain:"인지적 오류는 정보의 일부를 편향되게 처리해 부정적 결론을 강화하는 사고방식이다. 각 오류의 명칭과 핵심 정의를 짝지어 설명하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:4, origN:4, round:1, display:"제1회 4번", verified:true, q:"정신분석적 상담 과정에서 나타나는 전이와 역전이에 대해 설명하시오. 4점(08, 19년 기출)\n(1) 전이\n(2) 역전이", points:4, keypoints:[{label:"전이와 역전이의 의미 및 다루는 방법",min:4,pool:[{t:"전이: 과거 중요인물에 대한 감정·기대를 상담자에게 재현",ac:["전이"]},{t:"전이의 탐색과 통찰을 통해 현재 관계와 과거 관계의 연결을 이해",ac:["전이 해석","전이 탐색"]},{t:"역전이: 상담자의 개인적 갈등·감정이 내담자 관계에 개입",ac:["역전이"]},{t:"자기점검·교육분석·수퍼비전으로 역전이를 관리",ac:["교육분석","자기점검","수퍼비전"]}]}], explain:"전이는 내담자의 과거 관계 패턴이 상담관계에서 반복되는 현상이고, 역전이는 상담자의 개인적 반응이 상담관계에 개입하는 현상이다. 둘 모두 알아차리고 치료적으로 활용하되 상담자의 자기점검과 수퍼비전이 중요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:5, origN:5, round:1, display:"제1회 5번", verified:true, q:"MMPI의 일반적인 해석 과정은 다음과 같이 구분할 수 있다. 다음의 빈 칸에 제시된 2~7단계의 내용을 간략히 기술하시오(단, 타당도척도와 임상척도를 중심으로 기술할 것). 6점", points:6, keypoints:[{label:"MMPI 해석 2~7단계",min:6,pool:[{t:"척도별 점수와 상승 정도 확인",ac:["척도별 점수 확인"]},{t:"척도 간 연관성과 코드유형 검토",ac:["척도 간 연관성","코드유형"]},{t:"프로파일의 응집·분산 검토",ac:["응집","분산"]},{t:"낮은 임상척도도 함께 검토",ac:["낮은 척도"]},{t:"타당도·임상척도의 형태적 패턴 분석",ac:["형태적 분석"]},{t:"전체 프로파일을 통합적으로 해석",ac:["전체 프로파일"]}]}], explain:"MMPI 해석은 개별 척도를 따로 읽는 데서 끝나지 않고 타당도와 임상척도의 상대적 높이, 코드유형, 전체 형태를 단계적으로 통합하는 과정이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:6, origN:6, round:1, display:"제1회 6번", verified:true, q:"사회성숙도 검사에서 아동의 측정영역을 6가지 기술하시오. 6점", points:6, keypoints:[{label:"사회성숙도검사의 주요 측정영역 6가지",min:6,pool:[{t:"이동",ac:["이동 영역"]},{t:"자조",ac:["자조 영역"]},{t:"작업",ac:["작업 영역"]},{t:"의사소통",ac:["의사소통 영역"]},{t:"사회화",ac:["사회화 영역"]},{t:"자기관리",ac:["자기관리 영역"]}]}], explain:"사회성숙도검사는 일상생활에서의 독립성과 사회적 적응을 여러 영역으로 나누어 평가한다. 각 영역명과 그 영역이 의미하는 실제 기능을 함께 기술하면 안정적이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:7, origN:7, round:1, display:"제1회 7번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점(09, 11년 기출)\n인천광역시에 사는 A씨는 올해 28세로 고등학교를 중퇴한 이후 뚜렷한 사회활동을 하고 있지 않은 상태이다. 평소 잠자는 시간이 불규칙하며, 공상에 사로잡혀 기이한 생각을 하는 경우가 많다. 최근에는 자신이 신의 계시를 받아 세상을 구원할 수 있다고 믿고 있다. A씨의 말에 따르면 자신이“내가 너희를 구원하리라”라는 간판이 있는 곳에서 뛰어내리면, 자신과 세상이 구원된다는 것이다. A씨는 자신의 것를 방해하려는 악의 세력이 곳곳에 퍼져있다고 주장하며 특히 병원 직원들이 악을 추종하는 정보요원이므로 반드시 따돌려야 한다고 믿고 있다.\n(1) 보기에서 내담자 A씨의 증상 및 징후를 3가지 기술하시오.\n(2) A씨에게 가능한 진단명을 제시하시오.", points:5, keypoints:[{label:"사례에서 확인되는 증상 3가지",min:3,pool:[{t:"망상: 비현실적이고 확고한 잘못된 신념",ac:["망상","과대망상","피해망상"]},{t:"환각·환청: 외부자극 없이 지각경험을 함",ac:["환각","환청"]},{t:"와해된 사고·언어 또는 행동",ac:["와해된 언어","와해된 행동"]}]},{label:"가능한 진단",min:1,pool:[{t:"조현병",ac:["정신분열증","schizophrenia"]}]}], explain:"사례는 과대·피해망상, 비현실적 지각경험 가능성, 사고와 행동의 와해 등 정신병적 증상을 묻는다. 다만 실제 임상에서는 지속기간, 물질·의학적 원인, 기분삽화 여부를 함께 평가해 진단해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"내담자의 공포 대상에 대한 체계적 둔감법의 3단계 과정을 순서대로 쓰고 설명하시오. 6점(09, 10, 15, 18년 기출)", points:6, keypoints:[{label:"체계적 둔감법의 3단계",min:3,pool:[{t:"이완훈련",ac:["근육이완훈련","점진적 근육이완"]},{t:"불안위계목록 작성",ac:["불안위계 작성","불안위계"]},{t:"낮은 단계부터 점진적으로 노출하며 둔감화",ac:["단계적 노출","점진적 노출","둔감화"]}]}], explain:"체계적 둔감법은 먼저 이완반응을 훈련하고, 불안을 유발하는 상황을 위계화한 뒤, 낮은 수준부터 단계적으로 노출해 불안반응을 약화시키는 절차다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"MMPI 검사 결과 L척도와 K척도는 30이하이고, F척도는 70 이상으로 나타났다. 이 결과를 토대로 유추할 수 있는 환자의 상태를 2가지 기술하시오. 4점", points:4, keypoints:[{label:"낮은 L·K와 높은 F에서 고려할 수 있는 상태 2가지",min:2,pool:[{t:"심한 심리적 고통이나 기능저하를 솔직하게 호소하는 상태",ac:["심한 심리적 고통","도움 요청","distress"]},{t:"증상을 의도적으로 과장하거나 부정적으로 제시하는 가능성",ac:["증상 과장","부정 왜곡","fake bad"]}]}], explain:"낮은 L·K와 높은 F는 방어가 적고 심각한 고통을 보고하는 경우에도 나타날 수 있고, 의도적 과장이나 비전형적 응답에서도 나타날 수 있다. 단일 프로파일만으로 어느 쪽인지 확정하지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"시간-제한적 집단정신치료의 주요 특징을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"시간제한적 집단정신치료의 특징 3가지",min:3,pool:[{t:"집단 목적에 맞는 참여자 선정과 적절한 동질성 고려",ac:["참여자 선정","집단 동질성"]},{t:"현재의 대인관계 학습과 피드백에 초점",ac:["대인관계 학습","피드백"]},{t:"제한된 시간을 변화동기와 핵심과제 집중에 활용",ac:["시간 제한","시간제한"]}]}], explain:"시간제한적 집단치료는 제한된 회기 수 자체를 치료적 구조로 사용한다. 적합한 구성원을 선정하고, 현재의 대인관계 학습과 피드백에 집중하며, 시간 제한을 동기와 집중도를 높이는 데 활용한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:11, origN:11, round:1, display:"제1회 11번", verified:true, q:"내담자의 반응을 해석할 때의 주의사항 5가지 쓰시오. 5점(06, 08, 11, 18년 기출)", points:5, keypoints:[{label:"해석할 때의 주의사항 5가지",min:5,pool:[{t:"내담자가 받아들일 준비가 된 시점에 해석",ac:["준비가 되었을 때","수용 준비"]},{t:"초기에는 성급한 해석을 피하고 관계와 정서반영을 우선",ac:["성급한 해석 금지","초기 해석 자제"]},{t:"명료화와 직면을 거쳐 근거를 충분히 확보",ac:["명료화","직면"]},{t:"내담자의 성격·맥락과 해석의 영향을 고려",ac:["내담자 성격","맥락 고려"]},{t:"내담자가 스스로 의미를 발견하도록 돕는 방식으로 제시",ac:["스스로 해석","자기통찰"]}]}], explain:"해석은 상담자의 추측을 선언하는 것이 아니라 내담자가 이해하고 활용할 수 있는 시점과 수준에 맞춰 제시해야 한다. 초기에는 반영과 명료화를 우선하고, 충분한 근거가 있을 때 잠정적으로 제시한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"단회상담은 다른 일반적인 심리상담과 달리 극히 제한된 시간 내에 응급 상황을 처리해야 하는 경우가 많다. 이와 같은 상담에서 강조되는 원리 또는 기술을 7가지만 제시하시오. 7점 (11년 기출)", points:7, keypoints:[{label:"단회상담에서 강조되는 원리·기술 7가지",min:7,pool:[{t:"단회상담 적합성의 신속한 판단",ac:["단회 여부 결정"]},{t:"내담자가 원하는 것 파악",ac:["wants 파악","원하는 것 파악"]},{t:"구체적이고 현실적인 목표 설정",ac:["상담목표 설정"]},{t:"융통성과 단호함의 병행",ac:["융통성","단호함"]},{t:"변화의지와 동기 유지",ac:["동기 유지"]},{t:"필요한 경우 조언·지시를 적극적으로 사용",ac:["조언","지시"]},{t:"이론에 얽매이지 않는 통합적·범이론적 접근",ac:["범이론적","통합적 접근"]}]}], explain:"단회상담은 제한된 시간 안에 핵심 요구와 실행 가능한 목표를 신속하게 합의하는 것이 중요하다. 필요에 따라 보다 지시적이고 통합적인 개입을 사용할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"자폐 스펙트럼 장애의 진단기준 중 사회적 의사소통 및 사회적 상호작용상의 결함 기준을 2가지 쓰고, 자폐 스펙트럼 장애로 통합된 DSM-IV 분류기준상의 진단명 2가지를 쓰시오. 4점\n(1) 사회적 의사소통 및 사회적 상호작용상의 결함 기준(DSM-5 진단 기준)\n(2) 자폐 스펙트럼 장애로 통합된 DSM-IV 분류기준상의 진단명", points:4, keypoints:[{label:"ASD의 사회적 의사소통·상호작용 결함 2가지",min:2,pool:[{t:"사회적·정서적 상호성의 결함",ac:["사회정서적 상호성"]},{t:"사회적 상호작용을 위한 비언어적 의사소통의 결함",ac:["비언어적 의사소통"]},{t:"관계를 발달·유지·이해하는 데의 결함",ac:["관계 발달","관계 유지"]}]},{label:"DSM-IV에서 ASD로 통합된 진단 2가지",min:2,pool:[{t:"자폐성 장애",ac:["autistic disorder"]},{t:"아스퍼거 장애",ac:["asperger disorder"]},{t:"소아기 붕괴성 장애",ac:["childhood disintegrative disorder"]},{t:"달리 분류되지 않는 전반적 발달장애",ac:["PDD-NOS"]}]}], explain:"DSM-5의 자폐스펙트럼장애는 사회적 의사소통·상호작용의 지속적 결함과 제한적·반복적 행동을 핵심으로 한다. DSM-IV의 자폐성 장애, 아스퍼거 장애 등 여러 전반적 발달장애 진단이 하나의 스펙트럼 범주로 통합되었다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"놀이치료에서 놀이는 치료적 가치가 있다. 놀이의 치료적 가치를 3가지 기술하시오. 6점", points:6, keypoints:[{label:"놀이의 치료적 가치 3가지",min:3,pool:[{t:"저항을 낮추고 치료적 관계 형성을 돕는다",ac:["저항 극복","저항 감소"]},{t:"아동의 의사소통 매체가 된다",ac:["의사소통 매체","의사소통의 매개"]},{t:"불안과 긴장을 감소시킨다",ac:["불안감소","긴장이완"]},{t:"정서적 정화와 외상 표현을 돕는다",ac:["정화","카타르시스"]},{t:"환상·상상을 통해 대리적 욕구충족을 돕는다",ac:["대리적 욕구충족"]}]}], explain:"아동에게 놀이는 언어를 대신하는 자연스러운 표현수단이다. 놀이를 통해 관계를 형성하고, 불안과 저항을 낮추며, 감정을 표현·정화하고, 상징적으로 욕구와 갈등을 다룰 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"로샤 검사 결과를 엑스너(Exner) 방식으로 채점하고자 한다. 엑스너(Exner) 종합체계 방식의 주요 채점 항목을 5가지만 기술하시오. 5점(15년 기출)", points:5, keypoints:[{label:"Exner 종합체계의 주요 채점항목 5가지",min:5,pool:[{t:"반응영역(Location)",ac:["반응영역","location"]},{t:"발달질(Developmental Quality)",ac:["발달질","DQ"]},{t:"결정인(Determinants)",ac:["결정인"]},{t:"형태질(Form Quality)",ac:["형태질","FQ"]},{t:"내용(Content)",ac:["반응내용","내용"]},{t:"평범반응(Popular)",ac:["평범반응","popular"]},{t:"조직화 활동(Z)",ac:["조직화 활동","Z점수"]},{t:"특수점수(Special Scores)",ac:["특수점수"]},{t:"쌍반응(Pair)",ac:["쌍반응"]}]}], explain:"Exner 종합체계에서는 반응이 어디를 사용했는지, 어떤 잉크반점 특성이 반응을 결정했는지, 형태 적합성, 내용, 조직화와 특수한 사고·언어 특징 등을 체계적으로 기호화한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"재활치료의 주요 개념으로서 병리, 손상, 장애, 핸디캡을 각각 설명하시오. 4점(10, 13, 18, 19년 기출)", points:4, keypoints:[{label:"재활 관련 4개 개념",min:4,pool:[{t:"병리: 질병과 병리과정 자체",ac:["병리","pathology"]},{t:"손상: 신체·생리·심리 구조나 기능의 이상·손실",ac:["손상","impairment"]},{t:"장애: 손상으로 인한 활동수행 능력의 제한",ac:["장애","disability"]},{t:"핸디캡: 역할수행과 사회참여에서의 불이익",ac:["핸디캡","handicap","사회적 불이익"]}]}], explain:"전통적 재활모델은 질병의 병리적 과정에서 기능의 손상이 생기고, 이것이 활동 제한과 사회적 역할의 불이익으로 이어질 수 있다고 구분했다. 현대 용어에서는 활동과 참여의 맥락을 더 강조한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"MMPI 검사 결과 ‘척도 1Hs’가 상승한 경우 내담자의 성향이나 상태를 3가지 기술하시오. 3점", points:3, keypoints:[{label:"MMPI 1(Hs) 상승 시 흔한 특징 3가지",min:3,pool:[{t:"신체증상과 건강문제에 과도하게 몰두",ac:["신체증상 집착","건강 염려"]},{t:"심리적 갈등을 신체적 호소로 표현하기 쉽다",ac:["신체화"]},{t:"불평이 많고 자기중심적·의존적인 대인양상이 나타날 수 있다",ac:["불평","의존적"]},{t:"심리적 설명이나 치료에 저항적일 수 있다",ac:["치료 저항","심리적 설명 거부"]}]}], explain:"척도 1(Hs)은 건강염려와 신체적 호소를 중심으로 해석한다. 상승만으로 특정 질환을 진단하지 않고 다른 임상척도와 실제 의학적 상태를 함께 고려해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"만성 정신질환자를 위한 정신사회재활의 일반적인 목표를 3가지 쓰시오. 3점", points:3, keypoints:[{label:"정신사회재활의 일반적 목표 3가지",min:3,pool:[{t:"증상과 재발을 관리하며 안정된 상태를 유지",ac:["증상 관리","재발 예방"]},{t:"대인관계·일상생활·직업 등 독립생활 기술 향상",ac:["독립생활 기술","사회기술"]},{t:"지역사회 기능과 삶의 질 향상",ac:["삶의 질","지역사회 적응"]}]}], explain:"정신사회재활은 증상 제거만을 목표로 하지 않는다. 개인이 지역사회에서 기능하고 관계를 맺으며 보다 독립적이고 만족스러운 삶을 살 수 있도록 기술과 지지체계를 강화한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:19, origN:19, round:1, display:"제1회 19번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점\n김대리는 업무능력이 뛰어나고 남보다 승진도 빠르다. 그러던 중 어느 날 사소한 실수를 저지르게 되었다. 상사와 동료들이 모두 괜찮다고 하였으나, 정작 김 대리 본인만은 자신이 실수를 저질렀다는 사실을 용납하기 어려웠다. 김대리는 “약간의 실수라도 저지른다면, 나의 회사생활은 끝이다.”라고 생각하고 있었던 것이다. 김대리는 이와 같은 심리적인 어려움으로 인해 이직까지 고려하고 있다.\n보기에 지시된 김 대리의 사례를 REBT의 ABCDE 치료모델에 맞추어 설명하시오.", points:6, keypoints:[{label:"REBT ABCDE 적용",min:5,pool:[{t:"A 선행사건: 업무상 사소한 실수",ac:["선행사건","A"]},{t:"B 비합리적 신념: 실수하면 회사생활이 끝난다는 절대적 믿음",ac:["비합리적 신념","B"]},{t:"C 결과: 불안·우울·회피 또는 이직 고려",ac:["정서적 결과","행동적 결과","C"]},{t:"D 논박: 그 믿음의 논리성·현실성·유용성을 검토",ac:["논박","D"]},{t:"E 효과: 실수와 자기 가치·직업 전체를 동일시하지 않는 합리적 신념",ac:["효과적 신념","새로운 신념","E"]}]}], explain:"REBT에서는 사건 A 자체보다 사건에 대한 비합리적 신념 B가 정서·행동 결과 C를 만든다고 본다. 상담에서는 그 신념을 D에서 논박하고 보다 현실적이고 유연한 신념 E를 형성하도록 돕는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:20, origN:20, round:1, display:"제1회 20번", verified:true, q:"단기상담에 적합한 내담자의 특성 5가지를 기술하시오. 5점 (18년 기출)", points:5, keypoints:[{label:"단기상담에 비교적 적합한 특성 5가지",min:5,pool:[{t:"문제가 비교적 국한되고 심각한 만성병리가 두드러지지 않는다",ac:["문제가 심각하지 않음","국한된 문제"]},{t:"구체적인 주호소와 목표가 있다",ac:["구체적 목표","명확한 주호소"]},{t:"변화동기와 심리적 자원이 있다",ac:["변화동기","심리적 자원"]},{t:"사회적 지지체계가 있다",ac:["사회적 지지"]},{t:"성격구조가 비교적 안정적이고 심한 성격병리가 두드러지지 않는다",ac:["성격장애 없음","성격 안정"]},{t:"상실·발달과업 등 최근의 적응문제가 중심이다",ac:["상실","발달상의 문제"]}]}], explain:"단기상담은 문제와 목표가 비교적 명확하고, 변화동기와 자원이 있으며, 심각한 만성적 성격병리가 두드러지지 않는 내담자에게 적용하기 쉽다. 실제 적합성은 위험도와 기능수준까지 함께 판단한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:21, origN:1, round:3, display:"제3회 1번", verified:true, q:"신경심리평가에서 일반적으로 다루어야 하는 주요 평가영역을 6가지 쓰시오. 6점", points:6, keypoints:[{label:"신경심리평가의 주요 영역 6가지",min:6,pool:[{t:"언어기능",ac:["언어"]},{t:"지적 기능",ac:["지능"]},{t:"시공간·구성 능력",ac:["시공간"]},{t:"집행기능",ac:["실행기능","전두엽 기능"]},{t:"주의력·처리속도",ac:["주의력","처리속도"]},{t:"기억·학습",ac:["기억","학습"]},{t:"정서·성격 및 행동",ac:["정서","성격","행동"]}]}], explain:"신경심리평가는 단일 검사보다 여러 인지영역을 함께 평가해 기능의 강점과 약점을 파악한다. 언어, 시공간, 기억, 주의, 처리속도, 집행기능과 함께 정서·성격 요인도 해석에 포함할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:22, origN:2, round:3, display:"제3회 2번", verified:true, q:"행동수정에서 자기-통제 프로그램의 일반적인 5단계를 쓰시오. 5점", points:5, keypoints:[{label:"자기통제 프로그램의 5단계",min:5,pool:[{t:"문제행동을 구체적으로 정의",ac:["문제 구체화"]},{t:"변화에 대한 서약·목표 설정",ac:["변화 서약"]},{t:"기초자료를 수집하고 자기관찰",ac:["자료수집","자기관찰"]},{t:"자기통제 프로그램을 설계하고 실행",ac:["프로그램 설계","프로그램 실행"]},{t:"변화를 유지하고 재발을 예방",ac:["유지","재발 예방"]}]}], explain:"자기통제 프로그램은 막연한 의지보다 표적행동의 정의와 측정, 구체적 계획, 실행과 유지의 순서로 구성된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:23, origN:3, round:3, display:"제3회 3번", verified:true, q:"웩슬러(Wechsler)가 정의한 지능의 개념을 쓰고, 유동성 지능과 결정성 지능의 특징을 각각 2가지 기술하시오. 6점(04, 10, 19년 기출)", points:6, keypoints:[{label:"Wechsler의 지능 정의",min:1,pool:[{t:"목적적으로 행동하고 합리적으로 사고하며 환경을 효과적으로 다루는 개인의 전체적 능력",ac:["합목적적 행동","합리적 사고","환경을 다루는 전체적 능력"]}]},{label:"유동성 지능 특징 2가지",min:2,pool:[{t:"새로운 문제를 해결하는 추론 능력으로 학습된 지식 의존이 상대적으로 적다",ac:["새로운 문제 해결","추론능력"]},{t:"성인기 이후 연령 증가와 함께 감소하는 경향이 있다",ac:["연령 증가와 감소","청년기 이후 감소"]}]},{label:"결정성 지능 특징 2가지",min:2,pool:[{t:"교육·문화·경험을 통해 축적된 지식과 기술",ac:["학습경험","문화적 경험","축적된 지식"]},{t:"연령과 경험에 따라 비교적 유지되거나 증가할 수 있다",ac:["연령에 따라 유지","경험에 따라 증가"]}]}], explain:"Wechsler는 지능을 여러 능력의 단순 합이 아니라 목적적으로 행동하고 합리적으로 사고하며 환경을 효과적으로 다루는 전체적 능력으로 보았다. 유동성 지능은 새로운 문제해결과 추론에, 결정성 지능은 학습된 지식과 경험에 더 크게 의존한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:24, origN:4, round:3, display:"제3회 4번", verified:true, q:"심리상담의 과정에서 내담자가 침묵을 지키는 이유 3가지를 기술하시오. 6점(08, 10, 12, 19년 기출)", points:6, keypoints:[{label:"내담자가 침묵하는 가능한 이유 3가지",min:3,pool:[{t:"상담관계나 자기노출에 대한 불안·두려움",ac:["불안","두려움"]},{t:"상담자에 대한 적대감·저항",ac:["적대감","저항"]},{t:"내용을 생각하고 정리하거나 감정을 음미하는 중",ac:["생각 정리","음미"]},{t:"강한 감정표현 뒤 피로하거나 회복하는 중",ac:["감정표현 후 회복","피로"]},{t:"상담자의 반응이나 해석을 기다림",ac:["상담자 반응 기대","해석 기대"]},{t:"무슨 말을 해야 할지 몰라 침묵",ac:["할 말을 모름"]}]}], explain:"침묵은 저항만을 의미하지 않는다. 불안, 감정처리, 사고정리, 관계에 대한 시험, 상담자의 반응을 기다리는 과정 등 다양한 기능을 가질 수 있으므로 맥락을 탐색해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:25, origN:5, round:3, display:"제3회 5번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 4점 (05, 09년 기출)\n“저는 지난 밤 너무도 기이한 꿈을 꾸었어요. 벌써 제대한 지 2년이 넘었는데, 군대 취사병으로 있을 때로 돌아갔죠. 저는 저녁 메뉴로 돼지를 잡아야 하는 상황이었는데요. 평소 살아 있는 동물을 죽이는 것을 무척이나 싫어했음에도 고참의 지시에 따를 수밖에 없었죠. 그런데 그 돼지가 어찌나 힘이 세고 튼튼한 놈인지 칼로 놈의 목을 몇 차례 찔렀지만 마치 저를 비웃듯 계속 몸부림을 치더라고요. 이러다가는 안 되겠다 싶어 온 힘을 주어 그 놈의 목을 힘껏 비틀어서는 놈의 목 한가운데를 최대한 깊숙이 찔러 넣었죠. 그러자 돼지가 몸부림을 그치고 조용히 고개를 돌렸는데요. 그 돼지가 바로 형이었던 거예요. 너무도 황당하고 두려워서 잠에서 깨어났는데요. 등에서 식은땀이 줄줄 흐르더라고요.”\n보기의 내담자가 이야기한 꿈의 내용을 듣고 상담자가 제시해야 할 적절한 반응을 반영, 명료화, 직면, 해석의 상담기법으로 표현하시오.\n(1) 반영\n(2) 명료화\n(3) 직면\n(4) 해석", points:4, keypoints:[{label:"상담기법별 적절한 반응의 핵심",min:4,pool:[{t:"반영: 내담자의 정서와 경험을 되돌려 준다",ac:["감정 반영","정서 반영"]},{t:"명료화: 불분명한 의미를 확인하고 구체화한다",ac:["명료화","구체화"]},{t:"직면: 내담자의 말·감정·행동 사이의 불일치를 조심스럽게 제시한다",ac:["직면","불일치"]},{t:"해석: 꿈과 현재·과거의 의미를 잠정적 가설로 연결한다",ac:["해석","잠정적 해석"]}]}], explain:"이 문항은 꿈의 의미를 정답 하나로 확정하는 문제가 아니라 네 상담기법의 기능에 맞게 반응을 구성하는 문제다. 특히 해석과 직면은 “형을 미워한다”처럼 단정하기보다 탐색 가능한 가설로 제시하는 것이 적절하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료 예시는 꿈의 의미를 다소 단정적으로 제시하여, 앱 해설에서는 잠정적 표현을 권장."] },

{ level:2, y:2015, n:26, origN:6, round:3, display:"제3회 6번", verified:true, q:"일반적으로 가족치료를 권하게 되는 경우를 2가지 쓰시오. 2점 (20년 기출)", points:2, keypoints:[{label:"가족치료를 고려할 수 있는 경우 2가지",min:2,pool:[{t:"증상이나 문제가 역기능적 가족 상호작용과 밀접하게 관련",ac:["역기능적 가족관계","가족 상호작용"]},{t:"주호소나 치료목표가 가족관계의 변화와 직접 관련",ac:["가족관계 변화","가족 간 관계"]}]}], explain:"개인의 증상이 가족체계의 상호작용과 밀접하거나, 내담자가 원하는 변화 자체가 가족관계에 있을 때 가족치료를 우선적으로 고려할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:27, origN:7, round:3, display:"제3회 7번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 5점(20년 기출)\nA군은 임상심리학 전공 대학원생으로, ○○상담센터에서 실습을 하고 있다. A군은 자신이 개발한 새로운 치료기법을 상담에 적용해 보려던 차에, 마침 평소 자신이 호감을 가지고 있던 한 여학생이 상담센터를 찾아와 상담을 신청한 사실을 알게 되었다. A군은 그 여학생과의 상담을 자신이 맡겠다고 제안하였다.\n(1) 윤리적 타당성 여부:\n(2) 이유\n전문가로서 태도\n② 상담관계", points:5, keypoints:[{label:"윤리적 판단",min:1,pool:[{t:"현재 조건에서는 상담을 맡지 않는 것이 타당하다",ac:["상담 불가","상담을 맡지 않음"]}]},{label:"윤리적 이유 2가지",min:2,pool:[{t:"수련생이 검증되지 않은 새 기법을 적용하려는 데 필요한 역량·감독이 부족할 수 있다",ac:["전문적 능력 부족","역량 부족","수퍼비전 필요"]},{t:"개인적 호감이 있는 내담자와의 이중관계·이해상충 위험",ac:["이중관계","이해상충","개인적 호감"]}]}], explain:"윤리적 핵심은 수련생의 역량범위와 이중관계 위험이다. 새로운 기법은 적절한 근거와 수퍼비전 아래 사용해야 하고, 개인적 호감이 치료판단에 영향을 줄 수 있는 관계는 피해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:28, origN:8, round:3, display:"제3회 8번", verified:true, q:"행동치료에서 치료자들은 내담자의 행동을 간접 측정하기보다는 직접 측정하는 것을 선호한다. 이와 같이 행동을 직접 측정하는 경우 일반적으로 포함시키는 특성 6가지를 쓰시오. 6점", points:6, keypoints:[{label:"직접 행동측정에서 기록할 수 있는 특성 6가지",min:6,pool:[{t:"빈도",ac:["빈도"]},{t:"지속시간",ac:["지속기간"]},{t:"강도",ac:["강도"]},{t:"잠재기간",ac:["반응 잠복기","latency"]},{t:"행동의 형태·질",ac:["행동 형태","형태","질"]},{t:"자극통제 또는 행동이 발생하는 선행조건",ac:["자극통제","선행자극"]}]}], explain:"직접관찰에서는 행동이 얼마나 자주, 얼마나 오래, 얼마나 강하게 나타나는지와 자극 후 반응까지의 시간, 행동 형태, 어떤 선행조건에서 발생하는지를 객관적으로 기록한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:29, origN:9, round:3, display:"제3회 9번", verified:true, q:"K-WISC-IV의 척도별 구성 중 언어이해, 지각추론, 처리속도에 각각 포함되는 핵심 소검사 항목을 모두 쓰시오. 6점", points:6, keypoints:[{label:"K-WISC-IV 언어이해 핵심 소검사",min:3,pool:[{t:"공통성",ac:["공통성"]},{t:"어휘",ac:["어휘"]},{t:"이해",ac:["이해"]}]},{label:"지각추론 핵심 소검사",min:3,pool:[{t:"토막짜기",ac:["토막짜기"]},{t:"행렬추리",ac:["행렬추리"]},{t:"공통그림찾기",ac:["공통그림찾기","그림개념"]}]},{label:"처리속도 핵심 소검사",min:2,pool:[{t:"동형찾기",ac:["동형찾기"]},{t:"기호쓰기",ac:["기호쓰기"]}]}], explain:"K-WISC-IV는 언어이해, 지각추론, 작업기억, 처리속도의 네 지표를 사용한다. 문항이 요구하는 세 지표에서는 언어이해 3개, 지각추론 3개, 처리속도 2개의 핵심 소검사를 정확히 구분해 쓰면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:30, origN:10, round:3, display:"제3회 10번", verified:true, q:"아동 로샤 검사에서 기호화하는 항목을 6가지만 쓰시오. 6점(15년 기출)", points:6, keypoints:[{label:"아동 Rorschach 기호화 항목 6가지",min:6,pool:[{t:"반응영역",ac:["반응영역"]},{t:"발달질",ac:["발달질"]},{t:"결정인",ac:["결정인"]},{t:"형태질",ac:["형태질"]},{t:"반응내용",ac:["내용"]},{t:"평범반응",ac:["평범반응"]},{t:"조직화 활동",ac:["조직화"]},{t:"특수점수",ac:["특수점수"]},{t:"쌍반응",ac:["쌍반응"]}]}], explain:"Rorschach 기호화는 반응의 위치, 발달수준, 결정인, 형태적합도, 내용, 평범반응, 조직화와 특수한 반응 특징 등을 일정한 규칙으로 부호화하는 과정이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:31, origN:11, round:3, display:"제3회 11번", verified:true, q:"집단상담의 제한점을 3가지 쓰시오. 3점", points:3, keypoints:[{label:"집단상담의 제한점 3가지",min:3,pool:[{t:"구성원 모두에 대한 비밀보장을 완전히 통제하기 어렵다",ac:["비밀보장 한계"]},{t:"개인에게 제공되는 시간과 관심이 제한될 수 있다",ac:["개인에 대한 관심 제한"]},{t:"집단압력이나 동조가 개인의 선택을 방해할 수 있다",ac:["집단압력","동조압력"]},{t:"집단에서의 변화가 일시적 혼란이나 부작용을 낳을 수 있다",ac:["변화의 부작용"]},{t:"지도자의 역량 부족이 집단 전체에 영향을 줄 수 있다",ac:["지도자 전문성 부족"]}]}], explain:"집단상담은 상호작용과 보편성이라는 장점이 있지만, 비밀보장의 통제, 개인별 집중도, 집단압력과 지도자의 역량 같은 구조적 제한이 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:32, origN:12, round:3, display:"제3회 12번", verified:true, q:"심리평가에서 심리검사를 시행하는 주요 목적을 5가지 쓰시오. 5점\n*임상적진단과 심리평가를 위한 목적을 묻는 질문으로서 일반적인 심리검사의 목적을 묻는 질문과 다름", points:5, keypoints:[{label:"임상적 심리평가에서 검사를 시행하는 목적 5가지",min:5,pool:[{t:"겉으로 드러나지 않은 문제나 증상을 파악",ac:["잠재된 문제 파악","숨은 문제"]},{t:"증상의 심각도와 기능수준을 평가",ac:["증상 심각도","기능수준"]},{t:"감별진단에 필요한 정보를 제공",ac:["감별진단","변별진단"]},{t:"인지·기억·주의 등 특정 기능영역을 평가",ac:["기능평가","특수 영역 평가"]},{t:"성격·정서·대인관계 특성을 평가",ac:["성격 평가","정서 평가"]}]}], explain:"임상적 심리평가에서 심리검사는 진단명만 붙이는 도구가 아니라 문제의 성격과 심각도, 기능의 강점·약점, 감별진단과 치료계획에 필요한 정보를 구조화하는 수단이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:33, origN:13, round:3, display:"제3회 13번", verified:true, q:"MMPI-2에서 ?척도가 상승하는 경우를 5가지 쓰시오. 5점(11년 기출)", points:5, keypoints:[{label:"MMPI-2 ?(Cannot Say)가 증가하는 가능한 이유 5가지",min:5,pool:[{t:"문항 의미를 이해하지 못하거나 읽기 어려움",ac:["문항 이해 곤란","독해 곤란"]},{t:"정확한 응답에 과도하게 집착해 결정을 못함",ac:["강박적 망설임","결정 곤란"]},{t:"부주의로 문항을 빠뜨림",ac:["부주의","문항 누락"]},{t:"자기노출을 꺼리는 방어적 태도",ac:["방어적 태도","자기노출 거부"]},{t:"검사에 비협조적이거나 동기가 낮음",ac:["비협조","낮은 검사동기"]},{t:"심한 불안·혼란 등으로 응답을 지속하기 어려움",ac:["심한 불안","혼란"]}]}], explain:"MMPI-2의 ?(CNS)는 응답하지 않은 문항 수를 뜻한다. 많이 증가하면 누락 이유를 확인해야 하며, 독해 문제, 우유부단, 부주의, 방어성, 비협조, 심한 정서적 혼란 등이 가능한 원인이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:34, origN:14, round:3, display:"제3회 14번", verified:true, q:"다음은 20대 남성의 다면적 인성검사(MMPI-2) 결과이다. 이 결과를 타당도척도와 임상척도의 코드 유형(Code Type)에 근거하여 각각 설명하시오. 6점\n타당도 프로파일 : VRIN(46), TRIN(50), F(70), FB(52), FP(50), L(45), K(37), S(40)\n임상 프로파일 : Hs(57), D(76), Hy(64), Pd(66), Mf(48), Pa(65), Pt(74), Sc(56), Ma(49), Si(61)\n(1) 타당도 프로파일 분석\n(2) 임상 프로파일 분석", points:6, keypoints:[{label:"타당도 프로파일 해석",min:2,pool:[{t:"VRIN·TRIN이 정상범위여서 응답 일관성의 큰 문제는 두드러지지 않는다",ac:["VRIN 정상","TRIN 정상","응답 일관성"]},{t:"낮은 L·K와 상대적으로 높은 F는 방어가 적고 현재 고통을 호소하는 양상을 시사할 수 있다",ac:["낮은 L K","F 상승","도움 요청"]}]},{label:"임상 프로파일 2-7 해석",min:3,pool:[{t:"2-7 또는 7-2 코드유형",ac:["2-7","7-2"]},{t:"우울과 불안·걱정·긴장이 함께 두드러질 수 있다",ac:["우울과 불안","불안이 수반된 우울"]},{t:"완벽주의·반추·자기비판 경향이 나타날 수 있다",ac:["완벽주의","반추","자기비판"]},{t:"대인관계에서 수동적·의존적이거나 위축될 수 있다",ac:["수동적","의존적","위축"]}]}], explain:"프로파일은 먼저 응답의 일관성과 방어성 등 타당도를 확인한 뒤 임상척도를 해석한다. 이 사례에서는 2(D)와 7(Pt)의 동반 상승이 핵심이며 우울, 불안, 긴장, 반추와 완벽주의적 성향을 가설로 세울 수 있다. 치료예후는 코드유형만으로 단정하지 않는다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “치료 예후가 좋음”은 코드유형만으로 일반화하기 어려워 정답 포인트에서 제외."] },

{ level:2, y:2015, n:35, origN:15, round:3, display:"제3회 15번", verified:true, q:"불안장애의 행동치료기법으로서 체계적 둔감법의 3단계 과정을 순서대로 쓰고 설명하시오. 6점(09, 10, 15, 18년 기출)", points:6, keypoints:[{label:"체계적 둔감법의 3단계",min:3,pool:[{t:"이완훈련",ac:["근육이완훈련","점진적 근육이완"]},{t:"불안위계목록 작성",ac:["불안위계"]},{t:"낮은 단계부터 점진적으로 노출·둔감화",ac:["단계적 노출","점진적 노출","둔감화"]}]}], explain:"체계적 둔감법은 이완을 학습한 뒤 불안위계를 만들고 낮은 수준의 자극부터 점차 노출하며 불안을 감소시키는 고전적 행동치료 절차다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:36, origN:16, round:3, display:"제3회 16번", verified:true, q:"상담장면에서 ‘생산적인 경청’을 하는 상담자가 보이는 구체적인 태도를 5가지 쓰시오. 5점(06년기출)", points:5, keypoints:[{label:"생산적 경청 태도 5가지",min:5,pool:[{t:"내담자가 충분히 말할 시간을 준다",ac:["충분한 말할 시간"]},{t:"문제를 회피하지 않고 함께 다룬다",ac:["문제 회피하지 않음"]},{t:"성급한 충고를 삼간다",ac:["즉각적 충고 삼감","성급한 충고 금지"]},{t:"필요한 질문을 적절히 한다",ac:["필요한 질문"]},{t:"말과 비언어적 신호에 주의를 기울인다",ac:["주의 집중","주의 기울이기"]},{t:"고개 끄덕임 등 최소촉진반응을 사용한다",ac:["고개 끄덕임","최소촉진반응"]},{t:"개방적이고 편안한 자세와 적절한 눈맞춤을 유지한다",ac:["개방적 자세","눈맞춤","SOLER"]}]}], explain:"생산적 경청은 조용히 듣기만 하는 것이 아니라 충분한 말할 공간을 주고, 비언어적 관심과 최소촉진반응을 사용하며, 필요한 때에는 명료한 질문을 하는 적극적 태도다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:37, origN:17, round:3, display:"제3회 17번", verified:true, q:"다음 보기의 사례를 읽고 물음에 답하시오. 6점\n올해 30세인 A씨는 지난 1년 전부터 주위 사람들을 비롯한 누군가가 자신을 감시하고 있고, 자신이 평소 하는 말이 언론을 통해 보도되고 있다며 몹시 불안해하고 있다. 또한 알아들을 수 없는 말들을 혼자 중얼거리는가 하면, 종종 문을 걸어 잠근 채 다른 사람들과 만나는 것을 거부하곤 하였다.\n위의 사례에서 A씨는 조현병(Schizophrenia)의 증상들을 나타내 보이고 있다. 조현병의 양성증상과 음성증상의 의미를 각각 설명하고, 위의 사례에서 두 증상에 해당되는 내용을 각각 구분하여 쓰시오.\n(1) 양성증상:\n사례\n(2) 음성증상:\n사례", points:6, keypoints:[{label:"양성증상의 의미와 사례",min:2,pool:[{t:"양성증상: 정상기능에 추가되거나 왜곡된 정신병적 경험",ac:["양성증상"]},{t:"사례의 망상 또는 와해된 언어·행동",ac:["망상","언론에 보도","와해된 언어","혼잣말"]}]},{label:"음성증상의 의미와 사례",min:2,pool:[{t:"음성증상: 정상적인 정서·동기·언어·사회기능의 감소",ac:["음성증상"]},{t:"사례의 사회적 위축·대인관계 회피",ac:["사회적 위축","사람들과 만남 거부"]}]}], explain:"조현병의 양성증상은 정상기능에 더해진 왜곡된 경험이고, 음성증상은 정서·의욕·사회기능 등의 감소다. 사례에서 언론에 보도된다는 믿음은 망상에, 사람을 피하고 고립하는 행동은 사회적 위축에 해당할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:38, origN:18, round:3, display:"제3회 18번", verified:true, q:"다음 보기는 심리치료의 일반적인 수행단계를 나타내고 있다. A에서 D까지 빈칸에 들어갈 내용을 각각 쓰시오. 4점\n( A ) ⇒ 문제 및 상황 평가 ⇒ ( B ) ⇒ 치료 실시 ⇒ ( C ) ⇒ 치료 종결 ⇒ ( D )", points:4, keypoints:[{label:"심리치료의 수행단계 A~D",min:4,pool:[{t:"A 초기자문·초기접촉",ac:["초기자문","초기 접촉"]},{t:"B 치료목표 설정",ac:["치료목표 설정"]},{t:"C 치료평가",ac:["치료평가"]},{t:"D 추적회기·추후관리",ac:["추적회기","추후관리"]}]}], explain:"일반적 치료과정은 초기 접촉과 평가, 목표 설정, 치료 실시, 효과 평가, 종결, 추후 점검의 흐름으로 이해할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:39, origN:19, round:3, display:"제3회 19번", verified:true, q:"병원의 정신과나 정신보건센터에서 환자를 평가하기 위해 면담할 때 일반적으로 유의해서 보아야 하는 사항을 2가지 쓰고 설명하시오. 6점", points:6, keypoints:[{label:"정신과 면담에서 확인할 사항 2가지",min:2,pool:[{t:"현재의 심리·정신상태와 주호소, 의뢰사유, 생활환경 등 현재문제 정보",ac:["현재 문제","주호소","의뢰사유","생활환경"]},{t:"개인·가족·사회·발달사와 과거 병력 등 발달사적 정보",ac:["발달사","가족력","과거력","개인력"]}]}], explain:"정신과 면담에서는 현재의 증상과 기능수준만 아니라 개인의 발달사, 가족·사회적 맥락과 과거 병력을 함께 수집해야 현재 문제를 정확히 이해할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2015, n:40, origN:20, round:3, display:"제3회 20번", verified:true, q:"다음 보기의 신경심리검사들이 평가하는 인지기능 영역을 쓰시오. 2점(20년 기출)\n- Contrasting Program\n- Go-No-Go Test\n- Alternating Square & Triangle\n- Luria Loop\n- Controlled Oral Word Association Test(COWAT)\n- Fist-Edge-Palm\n- Alternating Hand Movement\n- Korean-Color Word Stroop Test(K-CWST)", points:2, keypoints:[{label:"제시된 검사들이 주로 평가하는 기능",min:1,pool:[{t:"전두엽 집행기능",ac:["집행기능","실행기능","전두엽 관리기능"]}]}], explain:"Go/No-Go, Stroop, 언어유창성(COWAT), Luria 계열의 운동연속과제 등은 억제, 전환, 규칙유지, 생성능력 같은 전두엽 집행기능을 평가하는 데 사용된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"집단 구성 시 동질적인 집단이 가지는 장점을 3가지 쓰시오. 6점", points:6, keypoints:[{label:"동질집단의 장점 3가지",min:3,pool:[{t:"공통경험으로 보편성과 공감이 촉진된다",ac:["보편성","공감 촉진"]},{t:"상호 지지가 빠르게 형성된다",ac:["상호 지지","즉각적 지지"]},{t:"갈등이 비교적 적고 응집력·소속감이 발달하기 쉽다",ac:["응집력","소속감"]},{t:"출석과 참여의 안정성이 높아질 수 있다",ac:["높은 출석률"]}]}], explain:"동질집단은 비슷한 문제나 특성을 공유하므로 공감과 보편성을 경험하기 쉽고, 초기 응집력과 지지가 빠르게 형성될 수 있다. 다만 동질성이 항상 우월한 것은 아니며 집단 목적에 맞게 구성해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:2, origN:2, round:1, display:"제1회 2번", verified:true, q:"집단치료 시 동료성원에게 다른 집단성원들의 초점이 집중되어 있는 상황에서, 집단지도자가 집단성원들의 관심을 유지하면서 집단성원들이 동료성원에게 도움을 줄 수 있도록 사용하는 기법을 2가지 쓰시오. 6점", points:6, keypoints:[{label:"집단성원의 관심을 유지하며 동료를 돕게 하는 기법 2가지",min:2,pool:[{t:"다른 집단성원에게 작업 중인 성원에게 질문하게 한다",ac:["질문 유도","질문 요청"]},{t:"다른 성원이 작업 중인 성원의 역할을 해보게 한다",ac:["역할연기","역할 바꾸기"]}]}], explain:"집단지도자는 한 사람에게 초점이 모일 때도 나머지 성원을 관찰자로만 두지 않고 질문이나 역할연기를 통해 작업에 참여시키고 상호학습을 촉진할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:3, origN:3, round:1, display:"제1회 3번", verified:true, q:"임상심리사의 윤리원칙으로서 유능성의 의미를 설명하고, 이를 위반하는 이유를 3가지 쓰시오. 5점\n(11, 19년 기출)\n(1) 유능성의 의미\n(2) 유능성의 원칙을 위반하는 이유", points:5, keypoints:[{label:"유능성의 의미",min:2,pool:[{t:"자신의 전문적 강점·한계와 역량범위를 자각한다",ac:["역량범위","전문적 한계"]},{t:"지속적 교육·수련으로 전문성을 유지한다",ac:["계속교육","지속적 수련"]}]},{label:"유능성 위반 위험요인 3가지",min:3,pool:[{t:"개인적 심리문제가 전문적 판단에 영향을 미침",ac:["개인적 심리문제"]},{t:"과도한 업무와 소진으로 수행능력이 저하됨",ac:["소진","과도한 업무"]},{t:"필요한 교육·수련 없이 다룰 수 있다고 과신함",ac:["교육수련 부족","과신"]},{t:"새로운 지식과 수련이 필요 없다고 여김",ac:["교만","학습 거부"]}]}], explain:"유능성은 자신이 교육·수련받은 범위 안에서 서비스를 제공하고 한계를 자각하며 지속적으로 역량을 갱신하는 윤리원칙이다. 개인문제나 소진, 과신은 전문적 판단을 훼손할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:4, origN:4, round:1, display:"제1회 4번", verified:true, q:"정신장애의 취약성-스트레스 모델에 대해 설명하시오. 5점", points:5, keypoints:[{label:"취약성-스트레스 모델의 핵심",min:3,pool:[{t:"취약성은 장애 발생 가능성을 높이는 개인의 생물학적·심리적 소인",ac:["취약성","소인"]},{t:"스트레스는 심리적 부담을 주는 환경적 사건이나 요구",ac:["스트레스","환경적 사건"]},{t:"정신장애는 취약성과 스트레스의 상호작용으로 발생 가능성이 달라진다",ac:["상호작용","취약성 스트레스 상호작용"]}]}], explain:"취약성-스트레스 모델은 정신장애를 개인의 소인이나 환경 스트레스 하나만으로 설명하지 않고 두 요인의 상호작용으로 이해한다. 같은 스트레스라도 취약성 수준과 대처자원에 따라 결과가 달라질 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:5, origN:5, round:1, display:"제1회 5번", verified:true, q:"다음은 상담 초기에 흔히 볼 수 있는 대화이다. 보기의 내용을 읽고 질문에 답하시오. 5점(03, 06년 기출)\n내담자: 선생님, 저는 솔직히 확신이 서지 않습니다. 상담 받고 나면 과연 좋아질까요?\n상담자: 그렇게 말씀하시니 다행이군요. 솔직하게 이야기한다는 것 자체가 쉽지 않거든요.\n내담자: 오해는 마세요. 선생님을 믿지 못해서가 아니에요. 단지 상담을 받아도 나아지지 않는다면 어떻게\n해야할지 불안해서요.\n상담자:\n보기에서 내담자는 상담의 효과에 대한 의문과 회의를 표명하였다. 이와 같은 경우 상담자는 어떻게 반응해야 하며, 그러한 반응의 근거는 무엇인지 설명하시오.\n(1) 상담자의 반응\n(2) 반응의 근거", points:5, keypoints:[{label:"상담자의 적절한 반응 요소",min:4,pool:[{t:"상담 효과에 대한 불안과 회의를 공감·반영한다",ac:["불안 반영","공감"]},{t:"솔직하게 표현한 점을 인정하고 격려한다",ac:["솔직함 격려","긍정적 측면 격려"]},{t:"비현실적 보장은 피하면서 변화 가능성과 희망을 제시한다",ac:["희망 고취","현실적 희망"]},{t:"함께 문제를 살펴보겠다는 지지와 협력관계를 제시한다",ac:["지지","협력"]}]},{label:"반응의 근거",min:2,pool:[{t:"초기 상담에서는 불안과 양가감정이 흔하다",ac:["초기 불안","양가감정"]},{t:"공감과 진실성은 라포와 치료적 동맹 형성에 도움된다",ac:["라포","치료적 동맹"]}]}], explain:"상담초기의 회의에는 “반드시 좋아진다”는 보장보다 불안을 인정하고, 솔직한 표현을 강화하며, 상담을 함께 평가해 나가겠다는 현실적인 희망과 협력적 태도를 제시하는 것이 적절하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:6, origN:6, round:1, display:"제1회 6번", verified:true, q:"상담의 초기단계에서 반드시 이루어져야 하는 내용을 3가지 쓰시오. 3점(13년 기출)", points:3, keypoints:[{label:"상담 초기의 핵심 과업 3가지",min:3,pool:[{t:"라포와 치료적 관계 형성",ac:["라포","치료적 관계"]},{t:"문제평가와 사례개념화",ac:["사례개념화","문제평가"]},{t:"상담 구조화와 역할·규칙 합의",ac:["상담 구조화","구조화"]},{t:"상담 목표 설정",ac:["목표 설정","상담목표"]}]}], explain:"초기단계에서는 안전한 관계를 만들고 문제를 평가·개념화하며, 상담의 역할과 절차를 구조화하고 현실적인 목표를 합의해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:7, origN:7, round:1, display:"제1회 7번", verified:true, q:"내담자가 상담을 끝낼 준비가 되었는지를 판단할 수 있는 방법을 3가지 쓰시오. 3점", points:3, keypoints:[{label:"종결 준비 판단 기준 3가지",min:3,pool:[{t:"상담목표의 달성 정도",ac:["목표 달성"]},{t:"주호소와 초기 증상·기능의 긍정적 변화",ac:["증상 감소","긍정적 발전"]},{t:"내담자가 상담 없이도 변화와 대처를 유지할 능력이 있는지",ac:["자기유지","대처능력"]},{t:"상담관계에서 얻을 수 있는 주요 이득을 충분히 얻었는지",ac:["상담관계 도움"]},{t:"초기 상황과 스트레스 요인이 변화했는지",ac:["초기상황 변화"]}]}], explain:"종결은 단순히 회기 수가 끝났다는 의미가 아니라 목표 달성, 증상과 기능의 변화, 내담자의 자기대처 능력과 재발관리 가능성을 함께 확인해 결정한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:8, origN:8, round:1, display:"제1회 8번", verified:true, q:"MMPI-2에서 이상으로 간주되는 점수와 그 이유에 대해 설명하시오. 5점\n(1) MMPI-2에서 이상으로 간주되는 점수\n(2) 이유\n-", points:5, keypoints:[{label:"MMPI-2에서 임상적으로 높은 점수",min:1,pool:[{t:"일반적으로 T점수 65 이상을 임상적으로 의미 있는 상승으로 본다",ac:["T 65 이상","65T 이상"]}]},{label:"이유",min:1,pool:[{t:"MMPI-2는 임상척도에 균일 T점수를 사용해 동일 T점수가 유사한 백분위 의미를 갖도록 했고 T=65가 약 92백분위에 해당한다",ac:["균일 T점수","92백분위","uniform T"]}]}], explain:"MMPI-2의 기본 임상척도에서는 보통 T=65 이상을 임상적으로 의미 있는 상승으로 본다. 균일 T점수 체계를 통해 척도 간 백분위 의미를 비교하기 쉬워졌으며, T=65는 약 92백분위 수준이다. 낮은 점수는 척도에 따라 해석 가치가 제한적일 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “원 MMPI 규준 절차 문제로 약 5점 상승되어 65=70” 설명은 지나치게 단순화되어 균일 T점수와 백분위 기준 중심으로 수정."] },

{ level:2, y:2016, n:9, origN:9, round:1, display:"제1회 9번", verified:true, q:"MMPI-2에서 재구성 임상척도를 개발하게 된 이유를 설명하시오. 5점", points:5, keypoints:[{label:"재구성 임상척도(RC) 개발 이유",min:3,pool:[{t:"기존 임상척도의 높은 상호상관과 공통된 고통·비사기 저하 요인을 분리하려고",ac:["척도 간 상관","공통요인","demoralization"]},{t:"기존 임상척도의 이질성과 해석 모호성을 줄이려고",ac:["이질성","해석 모호성"]},{t:"구성개념의 수렴·변별타당도와 해석의 명료성을 높이려고",ac:["변별타당도","수렴타당도","해석 명료성"]}]}], explain:"RC척도는 기존 임상척도에 넓게 퍼져 있던 공통 고통 요인을 분리하고 각 척도가 보다 뚜렷한 핵심 구성개념을 나타내도록 개발되었다. 목적은 척도 간 중복을 줄이고 변별력과 해석 명료성을 높이는 것이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:10, origN:10, round:1, display:"제1회 10번", verified:true, q:"로샤 검사(Rorschach Test)나 다면적 인성검사(MMPI)와 같은 진단적 심리검사는 그 결과가 일치하지 않을 수 있다. 그 이유에 대해 간략히 설명하시오. 5점(08, 10, 16년 기출)", points:5, keypoints:[{label:"검사 결과가 일치하지 않을 수 있는 이유",min:3,pool:[{t:"서로 다른 검사는 성격과 심리기능의 다른 측면·수준을 측정한다",ac:["다른 측면 측정","상이한 수준"]},{t:"검사방법과 반응형식이 달라 방법효과가 발생한다",ac:["측정방법 차이","방법효과"]},{t:"상황·동기·방어·검사태도 등 상태요인의 영향을 다르게 받는다",ac:["검사태도","상황요인"]},{t:"성격과 행동 자체가 복합적이고 맥락에 따라 달라진다",ac:["성격의 복합성","개인차"]}]}], explain:"Rorschach와 MMPI는 동일한 심리현상을 같은 방식으로 측정하지 않는다. 자극의 구조화 정도, 반응양식, 검사태도와 상황의 영향이 다르므로 결과 차이는 반드시 오류를 의미하지 않으며 통합해 해석해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:11, origN:11, round:1, display:"제1회 11번", verified:true, q:"초기면담 과정에 포함되어야 할 내담자에 대한 행동관찰의 요소 5가지를 쓰시오. 5점 03, 06, 13, 19년 기출)", points:5, keypoints:[{label:"초기면담 행동관찰 요소 5가지",min:5,pool:[{t:"말의 양·속도·내용과 표현방식",ac:["말과 표현","언어표현"]},{t:"신체동작과 운동행동",ac:["신체동작"]},{t:"면담에 대한 태도와 협조성",ac:["면담 태도","협조성"]},{t:"용모·외모·위생과 복장",ac:["용모","외모"]},{t:"정서와 정동의 표현",ac:["정서적 반응","정동"]},{t:"사고의 논리성·이해력",ac:["사고력","이해력"]},{t:"언어적·비언어적 의사소통 능력",ac:["의사소통능력"]}]}], explain:"초기면담의 행동관찰은 외모와 태도뿐 아니라 언어, 운동행동, 정서·정동, 사고과정과 의사소통의 질을 함께 기록한다. 이는 자기보고 정보와 함께 정신상태를 이해하는 자료가 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:12, origN:12, round:1, display:"제1회 12번", verified:true, q:"인지치료에서는 내담자의 자동적 사고를 수정하기 위해 소크라테스식 질문법을 사용한다. 소크라테스식 질문법을 사용할 때의 유의사항을 6가지 쓰시오. 6점(13년 기출)", points:6, keypoints:[{label:"소크라테스식 질문의 유의사항 6가지",min:6,pool:[{t:"변화 가능성을 발견하도록 돕는 질문",ac:["변화가능성"]},{t:"새로운 정보와 통찰을 얻을 수 있는 질문",ac:["새로운 통찰","성과 있는 질문"]},{t:"내담자가 능동적으로 사고·학습하도록 하는 질문",ac:["학습과정 참여","능동적 사고"]},{t:"내담자의 수준과 현재 문제에 맞는 질문",ac:["도움되는 수준","수준에 맞는 질문"]},{t:"상담자가 정한 결론으로 유도하지 않는 질문",ac:["유도질문 금지","결론 유도 금지"]},{t:"가능하면 열린 질문을 사용하고 불필요한 선다형 질문을 피함",ac:["열린 질문","선다형 질문 지양"]}]}], explain:"소크라테스식 질문은 정답을 가르치는 방식이 아니라 내담자가 증거를 검토하고 다른 관점을 스스로 발견하도록 돕는 협력적 탐구다. 따라서 유도적이거나 시험하는 질문을 피해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:13, origN:13, round:1, display:"제1회 13번", verified:true, q:"K-WAIS-IV의 4가지 주요 지수를 쓰고, 각각에 대해 설명하시오. 8점", points:8, keypoints:[{label:"K-WAIS-IV의 4개 주요 지수",min:4,pool:[{t:"언어이해지수(VCI): 언어적 추론·개념형성·축적지식",ac:["VCI","언어이해"]},{t:"지각추론지수(PRI): 비언어적·시공간적 추론과 유동추론",ac:["PRI","지각추론"]},{t:"작업기억지수(WMI): 청각적 주의집중과 정보의 일시적 유지·조작",ac:["WMI","작업기억"]},{t:"처리속도지수(PSI): 단순 시각정보를 빠르고 정확하게 탐색·기호화하는 능력",ac:["PSI","처리속도"]}]}], explain:"K-WAIS-IV는 언어이해, 지각추론, 작업기억, 처리속도의 네 지표로 주요 인지기능을 요약한다. 각 지표는 서로 다른 핵심 소검사 조합에서 산출되며 FSIQ와 함께 해석한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:14, origN:14, round:1, display:"제1회 14번", verified:true, q:"주의력결핍 과잉행동장애(ADHD)의 치료방법 중 행동치료의 기법을 3가지 쓰고 간략히 설명하시오.\n6점(09년 기출)", points:6, keypoints:[{label:"ADHD 행동치료 기법 3가지",min:3,pool:[{t:"타임아웃: 강화가 제공되는 상황에서 짧게 분리",ac:["타임아웃"]},{t:"토큰경제: 적응행동에 토큰을 제공해 교환 가능한 강화물로 사용",ac:["토큰경제"]},{t:"반응대가: 문제행동 후 이미 획득한 강화물을 제거",ac:["반응대가"]},{t:"과잉교정: 문제행동으로 생긴 결과를 복구하고 적절행동을 반복연습",ac:["과잉교정"]},{t:"행동계약: 표적행동과 결과·강화를 명시적으로 합의",ac:["행동계약","조건부계약"]}]}], explain:"ADHD의 행동치료에서는 바람직한 행동을 일관되게 강화하고 문제행동의 결과를 명확히 하는 기법을 사용한다. 기법명뿐 아니라 어떤 행동 뒤에 어떤 결과를 제공하는지 설명하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:15, origN:15, round:1, display:"제1회 15번", verified:true, q:"점진적 근육이완훈련의 시행 과정을 순서대로 쓰시오. 5점", points:5, keypoints:[{label:"점진적 근육이완의 기본 순서",min:4,pool:[{t:"특정 근육군에 주의를 두고 긴장시킨다",ac:["근육 긴장"]},{t:"몇 초간 긴장을 유지하며 감각을 알아차린다",ac:["긴장 유지"]},{t:"힘을 풀어 이완시키고 긴장과 이완의 차이를 느낀다",ac:["근육 이완","긴장 이완 비교"]},{t:"여러 근육군을 순차적으로 반복한다",ac:["근육군 반복"]},{t:"호흡을 천천히 하며 전신의 이완상태를 유지한다",ac:["천천히 호흡","전신 이완"]}]}], explain:"점진적 근육이완은 근육을 의도적으로 긴장시킨 뒤 힘을 풀어 두 상태의 감각 차이를 학습하는 절차다. 여러 근육군을 순차적으로 시행하면서 호흡을 안정시키고 전신 이완을 강화한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:16, origN:16, round:1, display:"제1회 16번", verified:true, q:"불안장애에 대한 행동치료의 근거와 그 구체적인 치료기법을 예를 들어 설명하시오. 3점(13년 기출)\n(1) 행동치료의 근거\n(2) 구체적인 치료기법", points:3, keypoints:[{label:"불안장애 행동치료의 근거",min:2,pool:[{t:"공포와 회피는 조건형성과 학습으로 획득·유지될 수 있다",ac:["조건형성","학습된 공포"]},{t:"안전한 상황에서 반복적으로 직면하면 새로운 안전학습과 공포 감소가 일어난다",ac:["노출","안전학습","소거"]}]},{label:"구체적 치료기법 예",min:1,pool:[{t:"체계적 둔감법·점진적 노출: 불안위계에 따라 단계적으로 직면",ac:["체계적 둔감법","점진적 노출"]},{t:"홍수법: 높은 강도의 공포자극에 충분한 시간 동안 회피 없이 직접 노출",ac:["홍수법","flooding"]}]}], explain:"행동치료는 회피가 공포를 유지한다는 학습원리에 근거해 안전하게 공포자극을 직면하도록 한다. 체계적 둔감법은 단계적 노출을, 홍수법은 상대적으로 강한 자극에 회피 없이 지속적으로 노출하는 방법을 뜻한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “홍수법=반복적인 설득·격려로 엘리베이터를 타게 함”은 홍수법의 핵심인 직접·지속적 고강도 노출을 설명하지 못해 수정."] },

{ level:2, y:2016, n:17, origN:17, round:1, display:"제1회 17번", verified:true, q:"틱(Tic) 장애를 평가하는 척도를 2가지 쓰시오. 4점", points:4, keypoints:[{label:"틱 장애 평가척도 2가지",min:2,pool:[{t:"예일 틱 증상 평가척도(YGTSS)",ac:["YGTSS","Yale Global Tic Severity Scale"]},{t:"Tourette Syndrome Global Scale(TSGS)",ac:["TSGS","뚜렛증후군 증상 평가척도"]}]}], explain:"틱 장애 평가는 운동틱과 음성틱의 수, 빈도, 강도, 복잡성, 방해 정도와 기능손상을 구조화해 평가하는 척도를 사용할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:18, origN:18, round:1, display:"제1회 18번", verified:true, q:"현 병력(History of Present Illness)을 기술하는 데 있어서 포함되어야 할 사항을 5가지 쓰시오.\n5점(12, 19년 기출)", points:5, keypoints:[{label:"현병력에 포함할 내용 5가지",min:5,pool:[{t:"증상의 시작 시기와 경과",ac:["발생 시기","경과"]},{t:"증상이 시작된 상황과 촉발요인",ac:["발생 상황","촉발요인"]},{t:"주요 증상의 양상·빈도·강도와 변화",ac:["증상 양상","빈도","강도"]},{t:"이전 치료경력과 효과·대응노력",ac:["치료 경력","대응 노력"]},{t:"현재 증상에 대한 내담자의 인식과 정서적 반응",ac:["현재 심리상태","병식"]}]}], explain:"현병력은 현재 문제의 시작부터 지금까지의 시간적 경과를 재구성하는 부분이다. 발병 시점, 촉발상황, 증상양상, 치료와 대처, 현재의 인식과 기능상태를 포함한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:19, origN:19, round:1, display:"제1회 19번", verified:true, q:"재활모형은 ‘손상, 장애, 핸디캡’의 3단계로 구분할 수 있다. 그 중 ‘장애’의 정의를 쓰고, 그 개입방법에 대해 예를 들어 설명하시오. 5점 (12년 기출)\n(1) 의미\n(2) 개입방법의 예\nA씨는 교통사고를 당하여 한쪽 다리를 절단하는 수술을 받게 되었다.", points:5, keypoints:[{label:"장애의 정의",min:1,pool:[{t:"손상으로 인해 일상적 활동이나 행동수행 능력이 제한된 상태",ac:["장애","disability","활동 제한"]}]},{label:"장애 수준의 개입 예",min:1,pool:[{t:"재활훈련·보조기기·기술훈련 등으로 개인의 활동수행 능력을 높인다",ac:["재활훈련","보조기기","기능훈련"]}]}], explain:"전통적 재활모형에서 장애는 손상 때문에 일상활동 수행능력이 제한된 상태를 뜻한다. 개입은 기능훈련, 보조도구, 환경조정 등을 통해 실제 활동능력을 높이는 데 초점을 둘 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2016, n:20, origN:20, round:1, display:"제1회 20번", verified:true, q:"심리치료자가 내담자에 대해 비밀보장을 할 수 없는 경우를 5가지 쓰시오. 5점(11년 기출)", points:5, keypoints:[{label:"비밀보장의 예외가 될 수 있는 상황 5가지",min:5,pool:[{t:"내담자나 타인에 대한 심각하고 임박한 위해 위험이 있을 때",ac:["자해 위험","타해 위험","생명 위협"]},{t:"아동·노인·취약대상 학대나 방임에 대해 법적 신고의무가 있을 때",ac:["아동학대","학대 신고"]},{t:"법원명령 등 법률상 정보제공 의무가 있을 때",ac:["법원명령","법적 요구"]},{t:"내담자가 적법하게 정보공개에 동의한 때",ac:["정보공개 동의","내담자 동의"]},{t:"감염병 등 특정 상황에서 법률이 별도의 신고·통지 의무를 정한 때",ac:["법정 감염병 신고","법률상 신고"]}]}], explain:"비밀보장은 핵심 윤리원칙이지만 절대적이지 않다. 심각한 위해 예방, 학대 신고, 법원명령 등 법적·윤리적 예외가 있을 수 있으며 실제 공개 범위는 해당 법률과 기관 규정에 따라 최소한으로 결정해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 “치명적 감염병이면 비밀보장 불가”는 지나치게 포괄적이어서 “법률상 신고·통지 의무가 있는 경우”로 한정."] },

{ level:2, y:2016, n:21, origN:1, round:3, display:"제3회 1번", verified:true, q:"WAIS-IV의 과정점수에 포함되는 점수를 5가지 쓰시오. 5점", points:5, keypoints:[{label:"WAIS-IV 숫자 소검사 관련 과정점수 5가지",min:5,pool:[{t:"숫자 바로 따라하기(DSF)",ac:["DSF","Digit Span Forward"]},{t:"숫자 거꾸로 따라하기(DSB)",ac:["DSB","Digit Span Backward"]},{t:"숫자 순서대로 따라하기(DSS)",ac:["DSS","Digit Span Sequencing"]},{t:"최장 숫자 바로 따라하기(LDSF)",ac:["LDSF","Longest Digit Span Forward"]},{t:"최장 숫자 거꾸로 따라하기(LDSB)",ac:["LDSB","Longest Digit Span Backward"]},{t:"최장 숫자 순서대로 따라하기(LDSS)",ac:["LDSS","Longest Digit Span Sequence"]}]}], explain:"WAIS-IV의 숫자 소검사에서는 바로·거꾸로·순서대로 따라하기의 수행과 각 조건의 최장 숫자폭을 과정수준에서 살펴볼 수 있다. 문항이 5가지를 요구하므로 제시된 과정점수 중 5가지를 정확히 쓰면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },
