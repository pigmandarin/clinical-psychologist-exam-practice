{ level:2, y:2019, n:27, origN:8, round:3, display:"제3회 8번", verified:true, q:"공포증 환자를 대상으로 체계적 둔감법을 실시하고자 한다. 체계적 둔감법의 원리 및 시행순서를 쓰시오. 5점\n(1) 원리\n(2) 시행순서(3단계)", points:5, keypoints:[{label:"체계적 둔감법 원리",min:1,pool:[{t:"불안과 양립하기 어려운 이완반응을 조건화하는 상호억제 원리를 활용한다",ac:["상호억제","reciprocal inhibition"]}]},{label:"시행순서 3단계",min:3,pool:[{t:"이완훈련을 실시한다",ac:["이완훈련"]},{t:"불안자극을 낮은 수준부터 높은 수준까지 위계화한다",ac:["불안위계"]},{t:"이완상태에서 위계의 낮은 항목부터 점진적으로 노출한다",ac:["점진적 노출","둔감화"]}]}], explain:"체계적 둔감법은 이완반응과 점진적 노출을 결합해 불안반응을 약화시키는 고전적 행동치료기법이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:28, origN:9, round:3, display:"제3회 9번", verified:true, q:"정신분석적 상담 과정에서 나타나는 전이와 역전이에 대해 설명하시오. 4점(08, 15년 기출)\n(1) 전이\n(2) 역전이", points:4, keypoints:[{label:"전이",min:2,pool:[{t:"내담자가 과거 중요한 대상과의 감정·기대·관계패턴을 상담자에게 반복하는 현상",ac:["전이"]},{t:"상담관계에서 반복되는 패턴을 탐색해 과거와 현재의 연결을 이해한다",ac:["관계패턴 탐색"]}]},{label:"역전이",min:2,pool:[{t:"상담자가 내담자에게 느끼는 감정·반응 중 상담자 자신의 갈등과 내담자 유발반응이 포함된 현상",ac:["역전이"]},{t:"자기점검·수퍼비전·교육분석 등을 통해 치료를 방해하지 않도록 다룬다",ac:["수퍼비전","자기점검"]}]}], explain:"전이는 내담자의 과거 관계패턴이 상담자와의 관계에서 재현되는 것이고, 역전이는 상담자의 정서적 반응을 뜻한다. 역전이는 단순한 “상담자의 투사”보다 넓은 개념으로 자기점검과 수퍼비전이 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 역전이를 “상담자의 투사”로만 정의한 표현을 확장."] },

{ level:2, y:2019, n:29, origN:10, round:3, display:"제3회 10번", verified:true, q:"인간중심 상담에서 로저스(Rogers)가 강조한 상담자(치료자)의 자세를 3가지 쓰시오. 6점 (08, 10, 14, 17, 18년 기출)", points:6, keypoints:[{label:"Rogers 치료자 자세 3가지",min:3,pool:[{t:"무조건적 긍정적 존중",ac:["무조건적 긍정적 존중"]},{t:"공감적 이해",ac:["공감적 이해"]},{t:"일치성·진실성",ac:["일치성","진실성"]}]}], explain:"인간중심상담의 핵심 치료자 태도는 무조건적 긍정적 존중, 공감적 이해, 일치성이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:30, origN:11, round:3, display:"제3회 11번", verified:true, q:"가족을 하나의 유기체로 보는 벡바와 벡바(Becvar &Becvar)의 가족치료의 기본전제를 3가지 기술하시오. 6점", points:6, keypoints:[{label:"가족치료 기본전제 3가지",min:3,pool:[{t:"개인의 문제를 고립된 원인보다 가족의 현재 상호작용과 관계맥락에서 이해한다",ac:["상호작용","관계맥락"]},{t:"선형적 원인보다 순환적 상호영향과 패턴에 주목한다",ac:["순환적 인과","상호영향"]},{t:"가족은 상호의존적인 하나의 체계이며 한 구성원의 변화가 다른 구성원과 체계에 영향을 준다",ac:["상호의존","체계"]},{t:"관찰자와 관찰대상도 상호작용하므로 치료자 역시 체계에 영향을 준다",ac:["관찰자","치료자 영향"]}]}], explain:"체계적 가족치료는 “누가 원인인가”보다 가족구성원 간 상호작용과 순환적 패턴을 본다. 가족은 상호의존적 체계이며 치료자도 관찰과 개입을 통해 그 체계에 영향을 준다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:31, origN:12, round:3, display:"제3회 12번", verified:true, q:"웩슬러(Wechsler)가 정의한 지능의 개념을 쓰고, 유동성 지능과 결정성 지능의 특징을 각각 2가지씩 기술하시오. 6점(04, 10, 15년 기출)", points:6, keypoints:[{label:"Wechsler 지능 정의",min:1,pool:[{t:"목적에 맞게 행동하고 합리적으로 사고하며 환경에 효과적으로 대처하는 개인의 종합적·전체적 능력",ac:["합목적적 행동","합리적 사고","환경 대처"]}]},{label:"유동성 지능 특징 2가지",min:2,pool:[{t:"새로운 문제를 기존 학습에 덜 의존해 추론하고 해결하는 능력",ac:["새로운 문제","추론"]},{t:"성인기 이후 연령과 신경학적 변화의 영향을 비교적 더 받는다",ac:["연령 영향","감소"]}]},{label:"결정성 지능 특징 2가지",min:2,pool:[{t:"교육·문화·경험을 통해 축적된 지식과 언어능력에 의존한다",ac:["경험","교육","지식"]},{t:"성인기에도 비교적 잘 유지되거나 오랫동안 증가할 수 있다",ac:["유지","증가"]}]}], explain:"Wechsler의 지능 정의는 목적행동, 합리적 사고, 환경대처를 포괄한다. 유동성 지능은 새로운 문제해결·추론에, 결정성 지능은 축적된 지식과 경험에 더 의존한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “유동성=유전적·선천적, 학습 영향 거의 없음”이라는 단순화를 수정."] },

{ level:2, y:2019, n:32, origN:13, round:3, display:"제3회 13번", verified:false, q:"웩슬러 지능검사에서 병전 지능 추정을 위해 사용되는 소검사를 3가지 쓰고, 이를 사용하는 이유를 설명하시오. 6점\n(1) 소검사:\n(2) 이유", points:6, keypoints:[{label:"병전지능 추정에 쓰이는 자료",min:3,pool:[{t:"어휘(Vocabulary) 같은 비교적 보존되는 언어성 소검사",ac:["어휘"]},{t:"상식(Information) 같은 축적된 지식 소검사",ac:["상식"]},{t:"행렬추리·빠진곳찾기/퍼즐 등 판본과 추정공식에서 사용되는 비언어 소검사",ac:["행렬추리","빠진곳찾기","퍼즐"]}]},{label:"사용 이유",min:2,pool:[{t:"일부 결정성 능력과 특정 소검사는 신경학적 손상 후에도 상대적으로 보존될 수 있다",ac:["상대적 보존"]},{t:"인구통계 정보와 결합한 회귀식으로 손상 전 지적수준을 통계적으로 추정할 수 있다",ac:["회귀식","인구통계"]}]}], explain:"시험 대비: 구자료에서는 상식·어휘·토막짜기 같은 소검사를 병전지능 추정에 사용한다고 제시하는 경우가 있다.\\n\\n실제 이해: 병전지능 추정에 쓰는 소검사는 판본과 공식에 따라 다르다. 특정 세 소검사를 시대와 판본을 초월한 고정 정답으로 보는 것은 부정확하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료-현대 연구 충돌. 토막짜기는 대표적인 병전 추정 소검사로 고정하기 어려워 verified 보류."] },

{ level:2, y:2019, n:33, origN:14, round:3, display:"제3회 14번", verified:true, q:"MMPI-2에서 과장된 보고를 탐지하는 척도를 3가지 쓰고, 각각에 대해 설명하시오. 6점", points:6, keypoints:[{label:"과장보고 탐지 척도 3가지",min:3,pool:[{t:"F: 일반 규준집단에서 드문 문항응답을 측정하며 심한 고통·비전형적 반응·과장 등 여러 원인으로 상승할 수 있다",ac:["F척도","비전형 척도"]},{t:"F(B): 검사 후반부에서 드문 반응을 측정해 후반부 비전형 반응이나 태도변화를 확인한다",ac:["FB","F(B)"]},{t:"F(p): 정신과 환자에서도 드문 반응을 측정해 의도적 과장 가능성 판단에 추가정보를 준다",ac:["Fp","F(p)"]}]}], explain:"F, F(B), F(p)는 과장된 보고 가능성을 평가할 때 함께 고려되는 비전형 반응척도다. 단일 T점수만으로 꾀병이나 의도적 과장을 확정하지 않고 VRIN/TRIN, 임상상태, 다른 타당도지표와 통합한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료의 F=100, Fp=100 등의 단일 절단점으로 의도적 과장을 확정하는 설명은 삭제."] },

{ level:2, y:2019, n:34, origN:15, round:3, display:"제3회 15번", verified:true, q:"MMPI 프로파일 해석과 관련하여 긍정왜곡(Faking-good)과 부정왜곡(Faking-bad)의 의미와 척도 양상을 설명하시오. 4점\n(1) 긍정왜곡 -\nMMPI\nMMPI-2\n(2) 부정왜곡 -\nMMPI\nMMPI-2", points:4, keypoints:[{label:"긍정왜곡 의미와 양상",min:2,pool:[{t:"자신의 문제·결점을 부정하거나 최소화해 지나치게 좋게 보이려는 반응양식",ac:["긍정왜곡","faking-good"]},{t:"L·K·S 등 방어성 척도가 상승하고 F 및 일부 임상척도가 낮게 나타날 수 있다",ac:["L K S 상승","F 낮음"]}]},{label:"부정왜곡 의미와 양상",min:2,pool:[{t:"증상이나 문제를 실제보다 심하게 보고해 더 나쁘게 보이려는 반응양식",ac:["부정왜곡","faking-bad"]},{t:"F·F(B)·F(p) 등 비전형 반응척도가 상승할 수 있으나 무선반응·심한 정신병리와 감별해야 한다",ac:["F 상승","Fp 상승"]}]}], explain:"긍정왜곡과 부정왜곡은 각각 문제를 최소화하거나 과장하는 반응경향을 뜻한다. 특정 임상척도 조합이나 고정 T점수만으로 의도를 판정하지 않고 전체 타당도척도와 상황을 함께 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 고정 절단점과 6-7-8 상승을 부정왜곡 필수양상처럼 제시한 부분을 제거."] },

{ level:2, y:2019, n:35, origN:16, round:3, display:"제3회 16번", verified:true, q:"현 병력(History of Present Illness)을 기술하는 데 있어서 포함되어야 할 사항을 5가지 쓰시오. 5점(12, 16년 기출)", points:5, keypoints:[{label:"현 병력에 포함할 사항 5가지",min:5,pool:[{t:"현재 증상이 언제 어떻게 시작되었는지 발병시점과 경과",ac:["발병 시점","경과"]},{t:"증상 시작 전후의 유발·악화·완화 요인",ac:["유발요인","악화요인"]},{t:"현재 도움을 요청하게 된 직접적 계기",ac:["내원 계기","면담 계기"]},{t:"증상 시작 당시 생활환경과 스트레스 상황",ac:["생활환경","스트레스"]},{t:"증상이 일상·직업·학업·관계에 미친 기능적 영향",ac:["기능 손상"]},{t:"과거 치료·약물·검사와 현재까지의 변화",ac:["치료 경과","약물"]}]}], explain:"현 병력은 현재 문제의 시작과 시간적 경과, 촉발·악화·완화 요인, 기능손상, 치료경험과 내원계기를 시간순으로 기술하는 것이 핵심이다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:36, origN:17, round:3, display:"제3회 17번", verified:true, q:"임상적 면접의 서면보고서에 포함되어야 할 내용을 5가지 쓰시오. 5점(08년 기출)", points:5, keypoints:[{label:"임상면접 서면보고서 5가지",min:5,pool:[{t:"신상·인구학적 정보",ac:["신상정보"]},{t:"주호소와 의뢰이유",ac:["주호소","의뢰이유"]},{t:"현 병력과 증상 경과",ac:["현 병력"]},{t:"과거 정신과·의학적 병력과 치료력",ac:["과거병력"]},{t:"개인·발달·교육·직업·관계력과 병전기능",ac:["병전성격","생활사"]},{t:"가족력과 가족관계",ac:["가족력"]},{t:"정신상태·행동관찰과 임상적 인상·계획",ac:["행동관찰","임상적 인상"]}]}], explain:"임상면접 보고서는 기본정보, 주호소와 현 병력, 과거력과 생활사, 가족력, 정신상태·행동관찰, 임상적 인상과 권고를 구조적으로 담는다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:37, origN:18, round:3, display:"제3회 18번", verified:true, q:"내담자를 면접 평가할 때 사용하는 행동평가 방법을 3가지 쓰고, 각각에 대해 설명하시오.\n6점(08, 11년 기출)", points:6, keypoints:[{label:"행동평가 방법 3가지",min:3,pool:[{t:"자연관찰: 일상적 환경에서 행동을 직접 관찰·기록한다",ac:["자연관찰"]},{t:"유사·구조화 관찰: 통제된 상황을 만들어 목표행동을 관찰한다",ac:["유사관찰","구조화 관찰"]},{t:"참여관찰: 관찰자가 상황에 참여하면서 행동을 관찰·기록한다",ac:["참여관찰"]},{t:"자기관찰: 내담자가 자신의 행동·상황·감정을 직접 기록한다",ac:["자기관찰","자기모니터링"]}]}], explain:"행동평가는 어디서 누가 관찰하느냐에 따라 자연관찰, 구조화 관찰, 참여관찰, 자기관찰 등으로 나눌 수 있다. 문항에서는 그중 세 가지와 핵심 특징을 설명하면 된다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2019, n:38, origN:19, round:3, display:"제3회 19번", verified:true, q:"재활치료의 주요 개념으로서 병리, 손상, 장애, 핸디캡을 각각 설명하시오. 4점(15년 기출)", points:4, keypoints:[{label:"재활치료 개념 4가지",min:4,pool:[{t:"병리(Pathology): 질병이나 손상의 원인이 되는 병적 과정·상태",ac:["병리","pathology"]},{t:"손상(Impairment): 심리·생리·해부학적 구조나 기능의 손실·이상",ac:["손상","impairment"]},{t:"장애(Disability): 손상으로 정상적 활동 수행능력이 제한된 상태",ac:["장애","disability"]},{t:"핸디캡(Handicap): 손상·장애로 사회적 역할 수행에서 불이익이 발생한 상태",ac:["핸디캡","handicap","사회적 불이익"]}]}], explain:"재활모형은 질병의 병리적 과정, 개인의 기능 손상, 활동 제한, 사회적 역할의 불이익을 서로 다른 수준으로 구분해 이해한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"프로차스카의 행동변화 6단계를 쓰시오.", points:6, keypoints:[{label:"행동변화 6단계",min:6,pool:[{t:"계획 전 단계(전숙고 단계)",ac:["계획 전 단계","전숙고 단계","precontemplation"]},{t:"계획 단계(숙고 단계)",ac:["계획 단계","숙고 단계","contemplation"]},{t:"준비 단계",ac:["준비 단계","preparation"]},{t:"행동 단계",ac:["행동 단계","action"]},{t:"유지 단계",ac:["유지 단계","maintenance"]},{t:"종결 단계",ac:["종결 단계","termination"]}]}], explain:"변화단계모형은 변화 의도가 거의 없는 단계에서 숙고와 준비, 실제 행동, 유지, 종결로 진행한다. 재발은 어느 단계에서도 나타날 수 있어 실제 임상에서는 순환적으로 이해한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:13, origN:13, round:1, display:"제1회 13번", verified:false, q:"웩슬러 지능검사에서 언어성 지능이 동작성보다 높고 특정 소검사 점수 차이가 나타난 환자의 유형을 쓰시오.", points:3, keypoints:[{label:"해석 원칙",min:1,pool:[{t:"VIQ-PIQ 및 소검사 점수차만으로 뇌손상을 진단할 수 없으며 신경심리검사·병력 등 추가평가가 필요하다",ac:["추가평가","뇌손상 진단 불가"]}]}], explain:"시험 대비: 원자료의 정답은 ‘뇌손상장애’이다. 기출 재현을 목적으로 공부할 때는 원답을 알아둘 필요가 있다.\\n\\n실제 이해: VIQ-PIQ 차이와 일부 소검사 패턴만으로 뇌손상을 진단할 수 없다. 병력, 신경학적 소견, 영상·신경심리검사 등을 함께 평가해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료-내용 충돌: 원자료는 뇌손상장애로 단정하나 지능검사 패턴만으로 진단하기 어렵다."] },

{ level:2, y:2020, n:31, origN:11, round:2, display:"제2회 11번", verified:true, q:"사회공포증 치료법 효과 연구 사례에서 연구절차상 문제점 4가지와 대안을 제시하시오.", points:6, keypoints:[{label:"연구설계 문제 4가지",min:4,pool:[{t:"명확한 선정·진단기준이 없어 표본의 동질성과 대표성이 불명확하다",ac:["선정기준","진단기준"]},{t:"통제·비교집단이 없어 자연회복·기대효과 등을 배제하기 어렵다",ac:["통제집단","비교집단"]},{t:"자기평정 한 가지에만 의존해 측정방법 편향이 크다",ac:["자기평정","다방법 평가"]},{t:"표본이 작고 추수평가가 없어 일반화와 유지효과 판단이 어렵다",ac:["표본 크기","추수평가"]}]}], explain:"치료효과를 주장하려면 진단과 선정기준, 적절한 비교조건, 신뢰로운 다방법 결과측정, 충분한 표본과 추수평가가 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:51, origN:11, round:3, display:"제3회 11번", verified:true, q:"심리평가 보고서에서 심리검사 결과와 생활사적 정보를 통합하는 이유를 기술하시오.", points:5, keypoints:[{label:"통합의 이유",min:3,pool:[{t:"검사점수의 의미를 개인의 발달·환경·병력 맥락에서 이해하기 위해",ac:["개인 맥락","발달사","생활사"]},{t:"서로 다른 자료원 간 일치·불일치를 검토해 해석오류를 줄이기 위해",ac:["자료원","해석오류"]},{t:"진단·사례개념화·권고의 타당성과 임상적 유용성을 높이기 위해",ac:["사례개념화","권고","타당성"]}]}], explain:"원자료처럼 심리검사를 단순한 “주관적 정보”, 생활사를 “객관적 정보”로 나누는 것은 부정확하다. 두 자료 모두 측정과 보고의 한계가 있으므로 다방법·다정보원 통합이 중요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료의 “심리검사=주관적, 생활사=객관적” 이분법 수정."] },

{ level:2, y:2020, n:52, origN:12, round:3, display:"제3회 12번", verified:true, q:"K-WAIS의 기본지식(Information) 소검사가 측정하는 측면 5가지를 쓰시오.", points:5, keypoints:[{label:"기본지식 측정 측면 5가지",min:5,pool:[{t:"습득된 일반지식의 범위",ac:["일반지식","일상지식"]},{t:"교육·문화적 학습경험",ac:["교육경험","학습경험"]},{t:"장기기억에서 지식을 인출하는 능력",ac:["장기기억","지식 인출"]},{t:"언어적 이해와 표현에 필요한 지식기반",ac:["언어적 지식","언어이해"]},{t:"환경과 지적 관심을 통해 축적된 정보",ac:["지적 관심","축적된 정보"]}]}], explain:"기본지식 소검사는 선천적 능력 자체라기보다 교육·문화·경험을 통해 습득한 일반지식과 장기기억에서의 인출을 주로 반영한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:53, origN:13, round:3, display:"제3회 13번", verified:true, q:"MMPI에서 L과 K가 70T 이상으로 매우 방어적일 때 임상심리사가 취할 수 있는 방법을 2가지로 설명하시오.", points:5, keypoints:[{label:"대처 2가지",min:2,pool:[{t:"프로파일의 타당성이 심각하게 훼손되면 임상척도 해석을 보류하고 재검사·추가자료를 고려한다",ac:["해석 보류","재검사"]},{t:"해석 가능한 수준이면 방어성을 명시하고 제한적·잠정적으로 해석하며 다른 자료와 통합한다",ac:["잠정적 해석","방어성 고려"]}]}], explain:"타당도 문제가 심하면 프로파일을 억지로 해석하지 않는다. 필요한 경우 방어성을 고려한 제한적 해석과 면담·관찰·다른 검사자료를 함께 사용한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:54, origN:14, round:3, display:"제3회 14번", verified:true, q:"MMPI에서 L46, F110, K46이고 대부분의 임상척도가 높은 프로파일을 보일 수 있는 유형 3가지를 쓰시오.", points:6, keypoints:[{label:"가능한 유형·상황 3가지",min:3,pool:[{t:"심각한 실제 정신병리나 급성 고통이 있는 경우",ac:["심각한 정신병리","급성 고통"]},{t:"증상을 과장하거나 도움을 강하게 요청하는 반응양식이 있는 경우",ac:["증상 과장","도움 요청"]},{t:"무선·비일관 반응 또는 검사에 대한 저항이 있는 경우",ac:["무선반응","비일관 반응","검사 저항"]}]}], explain:"F=110과 광범위한 임상척도 상승은 여러 원인이 가능하다. 심각한 고통, 과장된 보고, 비일관 반응 등을 감별하며 VRIN/TRIN, Fp, 면담과 행동관찰을 함께 본다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:55, origN:15, round:3, display:"제3회 15번", verified:true, q:"로샤 특수점수에서 특수내용의 종류 3가지와 각각을 설명하시오.", points:6, keypoints:[{label:"특수내용 3가지",min:3,pool:[{t:"추상적 내용(AB): 정서·감각·상징적 추상개념을 포함하는 반응",ac:["추상적 내용","AB"]},{t:"공격적 운동(AG): 대상 사이에 명백한 공격적 운동·상호작용이 있는 반응",ac:["공격적 운동","AG"]},{t:"협조적 운동(COP): 둘 이상의 대상이 협력적·우호적으로 상호작용하는 반응",ac:["협조적 운동","COP"]}]}], explain:"AB, AG, COP는 로샤 반응의 특수한 내용과 상호작용 특성을 부호화하는 점수다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:56, origN:16, round:3, display:"제3회 16번", verified:false, q:"HTP에서 그림의 크기와 위치가 나타내는 의미를 2가지씩 제시하시오.", points:8, keypoints:[{label:"전통적 HTP 해석 예",min:4,pool:[{t:"매우 큰 그림: 자기확대·과시 또는 공격성 가설",ac:["큰 그림","자기확대"]},{t:"매우 작은 그림: 위축·불안·낮은 자존감 가설",ac:["작은 그림","위축"]},{t:"높은 위치: 높은 포부·공상적 경향 가설",ac:["높은 위치","포부"]},{t:"낮은 위치: 불안정감·현실지향 또는 위축 가설",ac:["낮은 위치","불안정감"]}]}], explain:"시험 대비: 전통적 HTP 해석에서는 큰 그림/작은 그림, 높은 위치/낮은 위치에 각각 자기확대·위축, 포부·불안정감 등의 의미를 연결해 답한다.\\n\\n실제 이해: 그림의 크기나 위치 하나만으로 성격특성을 확정할 수 없다. 이런 연결은 전통적 투사검사 해석가설이며 다른 평가자료와 함께 제한적으로 사용해야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 내용타당성 보류: HTP의 단일 그래픽 지표를 특정 성격특성과 직접 연결하는 해석은 경험적 근거가 제한적. 시험 관행 답안으로만 보존."] },

{ level:2, y:2020, n:57, origN:17, round:3, display:"제3회 17번", verified:false, q:"50대 여성의 K-WAIS 소검사 결과를 토대로 정신과적 진단 2가지, 감별사항 4가지, 숫자외우기·산수 및 동작성 저하를 설명하시오.", points:8, keypoints:[{label:"안전한 해석",min:3,pool:[{t:"주의집중·작업기억 및 처리효율 저하 가능성을 탐색한다",ac:["주의집중","작업기억"]},{t:"우울·불안·스트레스가 수행저하에 영향을 줄 수 있다",ac:["우울","불안","스트레스"]},{t:"신경학적·정신과적 진단은 면담·병력·추가검사로 감별한다",ac:["추가검사","감별진단"]}]}], explain:"시험 대비: 원자료는 K-WAIS 프로파일을 토대로 주요우울장애·범불안장애 등의 진단가설과 감별사항을 기술하도록 요구한다.\\n\\n실제 이해: K-WAIS만으로 우울·불안장애를 진단하지 않는다. 주의·작업기억 저하는 스트레스와 정서상태를 포함한 다양한 요인의 영향을 받을 수 있어 면담과 추가검사가 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:["⚠ 원자료-내용 충돌: K-WAIS 점수만으로 주요우울장애·범불안장애 등의 진단을 결정할 수 없음."] },

{ level:2, y:2020, n:58, origN:18, round:3, display:"제3회 18번", verified:true, q:"심리평가자의 과학자로서의 자질과 예술가로서의 자질을 설명하시오.", points:6, keypoints:[{label:"두 자질",min:2,pool:[{t:"과학자적 자질: 표준화된 방법, 객관적 자료, 검증 가능한 근거로 평가한다",ac:["과학자","객관적","표준화"]},{t:"예술가적 자질: 임상경험과 맥락적 통찰을 활용해 자료를 의미 있게 통합한다",ac:["예술가","임상경험","통찰"]}]}], explain:"좋은 심리평가는 표준화·근거에 기반한 과학성과 개인의 맥락을 이해하고 여러 자료를 통합하는 임상적 판단을 함께 요구한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:59, origN:19, round:3, display:"제3회 19번", verified:true, q:"조현병의 양성증상을 보이는 환자에게 임상심리사가 수행할 수 있는 대처방법 3가지를 기술하시오.", points:6, keypoints:[{label:"양성증상 대처 3가지",min:3,pool:[{t:"망상과 논쟁하거나 동조하지 않고 정서와 안전을 확인한다",ac:["망상 논쟁하지 않기","망상 동조하지 않기"]},{t:"환각·환청의 내용, 고통 정도, 명령성 여부와 행동통제 가능성을 평가한다",ac:["환청 내용","명령성","행동통제"]},{t:"와해된 행동의 위험성을 평가하고 짧고 명료하게 구조화하며 필요 시 치료팀과 안전조치를 시행한다",ac:["위험성 평가","구조화","안전조치"]}]}], explain:"양성증상에 대해서는 경험을 조롱하거나 강화하지 않고, 위험성과 고통을 평가하면서 차분하고 명료하게 대응한다. 명령환청·자타해 위험은 즉시 안전계획과 치료팀 협력이 필요하다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

{ level:2, y:2020, n:60, origN:20, round:3, display:"제3회 20번", verified:true, q:"일반적으로 가족치료를 권하게 되는 경우를 2가지 쓰시오.", points:2, keypoints:[{label:"가족치료 권고 상황 2가지",min:2,pool:[{t:"개인의 증상이 가족의 상호작용·관계패턴과 밀접하게 연관되어 있는 경우",ac:["가족 상호작용","역기능적 가족관계"]},{t:"주된 호소와 치료목표가 가족관계·의사소통의 변화에 있는 경우",ac:["가족관계 변화","의사소통"]}]}], explain:"증상을 개인 내부 문제로만 보기보다 가족의 상호작용이 문제의 발생·유지와 관련되거나, 치료목표가 가족관계 변화에 있을 때 가족치료가 적절할 수 있다.", source:"임상심리사 2급 실기 기출자료", review_notes:["원자료에서 20번이 16번 뒤에 삽입되어 있었으나 실제 순서상 제3회 20번으로 복원."] },

{ level:2, y:2021, n:1, origN:1, round:1, display:"제1회 1번", verified:true, q:"상담자가 내담자와의 관계에서 알고 있어야 할 윤리문제의 기본원칙을 쓰고 행동지침 5가지를 기술하시오.", points:7, keypoints:[{label:"기본원칙",min:1,pool:[{t:"내담자의 인간적 가치·권리와 존엄을 존중하고 보호한다",ac:["권리와 존엄","인간적 가치"]}]},{label:"행동지침 5가지",min:5,pool:[{t:"개인적 욕구가 내담자에게 미치는 영향을 자각한다",ac:["개인적 욕구 자각"]},{t:"자신의 욕구충족을 위해 내담자를 이용하지 않는다",ac:["내담자 이용 금지"]},{t:"부적절한 다중·성적·금전적 관계를 피한다",ac:["다중관계","이중관계"]},{t:"자신의 태도와 가치관의 영향을 점검한다",ac:["가치관 영향","태도 영향"]},{t:"비밀보장과 그 한계를 준수한다",ac:["비밀보장"]}]}], explain:"상담자는 내담자의 존엄과 권리를 우선하며 자신의 욕구와 가치가 관계를 왜곡하지 않도록 점검하고 전문적 경계와 비밀보장을 지켜야 한다.", source:"임상심리사 2급 실기 기출자료", review_notes:[] },

const STORE_KEY="clin_practical_v2";
let ALL=(window.QUESTIONS||[]).slice();
let REC={};            // id -> {score,status,answer,coverage,feedback,mode}

const APP_STORAGE = {
  async get(key){
    try{
      if(window.storage && typeof window.storage.get === "function"){
        return await window.storage.get(key);
      }
    }catch(e){}
    try{
      const value = localStorage.getItem(key);
      return value === null ? null : {value};
    }catch(e){
      return null;
    }
  },
  async set(key, value){
    try{
      if(window.storage && typeof window.storage.set === "function"){
        return await window.storage.set(key, value);
      }
    }catch(e){}
    try{
      localStorage.setItem(key, value);
      return true;
    }catch(e){
      return false;
    }
  },
  async remove(key){
    try{
      if(window.storage && typeof window.storage.delete === "function"){
        return await window.storage.delete(key);
      }
      if(window.storage && typeof window.storage.remove === "function"){
        return await window.storage.remove(key);
      }
    }catch(e){}
    try{
      localStorage.removeItem(key);
      return true;
    }catch(e){
      return false;
    }
  }
};

let curLevel=1, curYear=null, curId=null, wrongOnly=false, grading=false;

const qid=(q)=>(q.level||1)+"-"+q.y+"-"+q.n;   // 급수 포함(1·2급 연도/번호 충돌 방지)
const $=(s)=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};

async function loadState(){
  try{const r=await APP_STORAGE.get(STORE_KEY); if(r&&r.value) REC=JSON.parse(r.value);}catch(e){REC={};}
}
async function saveState(){ try{await APP_STORAGE.set(STORE_KEY,JSON.stringify(REC));}catch(e){} }
ALL.sort((a,b)=> (a.level||1)-(b.level||1) || b.y-a.y || a.n-b.n);

function levels(){ return [...new Set(ALL.map(q=>q.level||1))].sort((a,b)=>a-b); }
function LVL(){ return ALL.filter(q=>(q.level||1)===curLevel); }
function years(){ return [...new Set(LVL().map(q=>q.y))].sort((a,b)=>b-a); }
function inYear(y){ if(y==="freq") return freqList(); return LVL().filter(q=>q.y===y).sort((a,b)=>a.n-b.n); }

/* ---------- 빈출(반복 출제) 군집: 채점 keypoints 구조로 동일 문항 묶기(급수별) ---------- */
let _freqCache=null, _freqLevel=null;
function kpsig(q){
  const toks=[];
  (q.keypoints||[]).forEach(k=>{
    if(typeof k==="string"){ toks.push(k.replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,12)); }
    else if(k&&k.pool){ k.pool.forEach(p=>toks.push(((p&&(p.t||(p.all&&p.all.join("")))||p||"")).toString().replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,8))); }
    else if(k&&k.all){ toks.push(k.all.join("").replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,12)); }
    else if(k&&k.label){ toks.push(k.label.replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,8)); }
  });
  return toks.sort().join("|");
}
function buildFreq(){
  const g={};
  LVL().forEach(q=>{ const k=kpsig(q); if(!k) return; (g[k]=g[k]||[]).push(q); });
  const map={}, groups=Object.values(g);
  groups.forEach(a=>{ const ys=a.map(x=>x.y).sort((x,y)=>y-x); a.forEach(x=>map[qid(x)]={count:a.length,years:ys}); });
  const reps=groups.filter(a=>a.length>=2)
    .map(a=>a.slice().sort((x,y)=>y.y-x.y)[0])   // 대표 = 가장 최근 연도 인스턴스
    .sort((r1,r2)=> (map[qid(r2)].count-map[qid(r1)].count) || (r2.y-r1.y) || (r1.n-r2.n));
  _freqCache={map,reps}; _freqLevel=curLevel;
  return _freqCache;
}
function freqInfo(q){ if(!_freqCache||_freqLevel!==curLevel) buildFreq(); return _freqCache.map[qid(q)]; }
function freqList(){ if(!_freqCache||_freqLevel!==curLevel) buildFreq(); return _freqCache.reps; }
function statusOf(id){ const r=REC[id]; if(!r||r.status==null) return null;
  if(r.score>=80) return "good"; if(r.score>=40) return "part"; return "miss"; }

/* ---------- render ---------- */
function renderYears(){
  const box=$("#years"); box.innerHTML="";
  const ys=years();
  // ★ 빈출순 모드 탭
  const fb=el("button","year freq"+(curYear==="freq"?" active":""),"★ 빈출순");
  fb.title="반복 출제된 주제를 빈도순으로 · 중복 제거";
  fb.onclick=()=>{ curYear="freq"; const f=freqList(); curId=f[0]?qid(f[0]):null; wrongOnly=false; $("#filterWrong").classList.remove("on"); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
  box.appendChild(fb);
  // show known exam years 2010-2025; those without data are disabled
  const full=[]; for(let y=2025;y>=2010;y--) full.push(y);
  full.forEach(y=>{
    const has=ys.includes(y);
    const b=el("button","year"+(y===curYear?" active":""),y+"년");
    if(!has){b.dataset.empty="1"; b.title="추가 예정";}
    else b.onclick=()=>{curYear=y; curId=inYear(y)[0]&&qid(inYear(y)[0]); wrongOnly=false; $("#filterWrong").classList.remove("on"); renderAll();};
    box.appendChild(b);
  });
}
function renderStats(){
  const qs=inYear(curYear);
  const done=qs.filter(q=>REC[qid(q)]&&REC[qid(q)].status!=null);
  const scored=done.map(q=>REC[qid(q)].score).filter(s=>typeof s==="number");
  const avg=scored.length?Math.round(scored.reduce((a,b)=>a+b,0)/scored.length):0;
  const good=done.filter(q=>REC[qid(q)].score>=80).length;
  const box=$("#stats"); box.innerHTML="";
  const totLbl=(curYear==="freq")?"빈출 주제":"전체 문항";
  const cells=[[totLbl,qs.length,""],["푼 문항",done.length,"accent"],["평균 점수",avg,scored.length?"accent":""],["80점↑",good,""]];
  cells.forEach(([s,b,cls])=>{const d=el("div","stat");d.append(el("b",cls,String(b)),el("span",null,s));box.appendChild(d);});
  renderExam();
}
function renderExam(){
  const box=$("#exam"); if(!box) return;
  const qs=inYear(curYear);
  if(!qs.length){ box.innerHTML=""; return; }
  const defPts=100/qs.length;
  let earned=0, gradedPts=0, gradedN=0;
  qs.forEach(q=>{ const r=REC[qid(q)]; if(r&&typeof r.score==="number"&&r.status!=null){
    const p=q.points||defPts; earned+=r.score/100*p; gradedPts+=p; gradedN++; } });
  if(!gradedN){ box.innerHTML=""; return; }
  const proj=Math.round(earned/gradedPts*100), pass=proj>=60;
  const freqMode=(curYear==="freq");
  const headLbl=freqMode?"빈출 세트 점수":"모의 총점";
  const subLbl=freqMode
    ? `환산 ${proj}점 · 채점한 빈출 주제의 부분점수 가중평균 · 균등 배점 가정`
    : `환산 ${proj}점 / 합격선 60점 · 채점한 문항의 부분점수 가중평균 · 균등 배점 가정(실제 배점 비공개)`;
  box.innerHTML=`<div class="exambar">
    <div class="ex-head"><b>${headLbl} <span class="muted">채점 ${gradedN}/${qs.length}${freqMode?'주제':'문항'}</span></b>
      <span class="pill ${pass?'p-pass':'p-fail'}">${pass?'합격 예측':'합격선 미달'} · ${proj}점</span></div>
    <div class="track"><div class="fill" style="width:${Math.min(100,proj)}%;background:${pass?'var(--good)':'var(--miss)'}"></div><div class="passline" title="합격선 60점"></div></div>
    <div class="ex-sub">${subLbl}</div>
  </div>`;
}
function renderGrid(){
  const g=$("#grid"); g.innerHTML="";
  let qs=inYear(curYear);
  if(wrongOnly) qs=qs.filter(q=>{const s=statusOf(qid(q));return s==="miss"||s==="part";});
  if(!qs.length){ g.appendChild(el("span","lbl", wrongOnly?"틀린/부분 문항이 없습니다":"문항 없음")); return; }
  const freqMode=(curYear==="freq");
  qs.forEach((q,i)=>{
    const id=qid(q), st=statusOf(id);
    const label=freqMode?String(i+1):String(q.n);
    const b=el("button","qbtn"+(id===curId?" cur":"")+(st?" st-"+st:""),label);
    if(freqMode){const fi=freqInfo(q); if(fi){b.title=fi.count+"회 출제 · "+fi.years.join("·"); if(fi.count>=4)b.classList.add("hot");}}
    if(st) b.appendChild(el("i","dot"));
    b.onclick=()=>{curId=id; renderStage(); renderGrid();};
    g.appendChild(b);
  });
}
function curQ(){ return ALL.find(q=>qid(q)===curId); }

function renderStage(){
  const stage=$("#stage"); stage.innerHTML="";
  const q=curQ();
  if(!q){ stage.appendChild(el("div","empty","<b>이 연도의 문항이 없습니다</b>다른 연도를 선택하세요.")); return; }
  const id=qid(q); const rec=REC[id]||{};
  const card=el("div","card");

  const meta=el("div","qmeta");
  const fi=(curYear==="freq")?freqInfo(q):null;
  meta.appendChild(el("span","qnum", fi?("빈출 · 원 출제 "+q.y+"년 "+(q.display||("제"+q.n+"번"))):("문제 "+(q.display||q.n))));
  if(fi) meta.appendChild(el("span","qtag hot","★ "+fi.count+"회 출제"));
  if(q.verified) meta.appendChild(el("span","qtag","검수 완료"));
  card.appendChild(meta);
  if(fi) card.appendChild(el("div","freqyears","출제 연도 · "+fi.years.map(y=>y+"년").join(" / ")));
  card.appendChild(el("div","qtext",escapeHtml(q.q)));
  if(q.keypoints){
    const pools=q.keypoints.filter(k=>k&&k.pool);
    const hint=pools.length?("요구 "+pools.map(k=>k.min).join("+")+"가지"):("핵심 채점항목 "+q.keypoints.length+"개");
    card.appendChild(el("div","qhint",hint));
  }

  const ta=el("textarea","answer"); ta.id="ans"; ta.setAttribute("aria-label","답안 입력"); ta.placeholder="여기에 답안을 서술하세요…";
  ta.value=rec.answer||"";
  card.appendChild(ta);

  const note=el("div","note"); note.id="note"; card.appendChild(note);

  const act=el("div","actions");
  const offBtn=el("button","btn primary","자동 채점");
  offBtn.onclick=()=>{
    const a=$("#ans").value.trim(); const nt=$("#note"); nt.classList.remove("show");
    if(!a){ nt.textContent="답안을 먼저 작성해 주세요."; nt.classList.add("show"); return; }
    const rec=localGrade(q,a); REC[qid(q)]=rec; saveState(); paintResult(q,rec); renderGrid(); renderStats();
  };
  const modelBtn=el("button","btn ghost","모범답안 대조"); modelBtn.onclick=()=>revealModel(q);
  act.append(offBtn,modelBtn);
  const lr=el("div","nav-lr");
  const prev=el("button","btn ghost","← 이전"); prev.onclick=()=>step(-1);
  const next=el("button","btn ghost","다음 →"); next.onclick=()=>step(1);
  lr.append(prev,next); act.appendChild(lr);
  card.appendChild(act);

  const res=el("div","result"); res.id="result"; card.appendChild(res);
  const model=el("div","model"); model.id="model"; model.style.display="none"; card.appendChild(model);

  stage.appendChild(card);

  // restore previous result view
  if(rec.mode==="offline"&&(rec.items||rec.coverage)) paintResult(q,rec);
  if(rec.mode==="self"&&rec.revealed) revealModel(q,true);
}

function step(d){
  let qs=inYear(curYear);
  if(wrongOnly) qs=qs.filter(q=>{const s=statusOf(qid(q));return s==="miss"||s==="part";});
  const idx=qs.findIndex(q=>qid(q)===curId);
  const ni=idx+d; if(ni<0||ni>=qs.length) return;
  curId=qid(qs[ni]); renderStage(); renderGrid(); window.scrollTo({top:0,behavior:"smooth"});
}
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* ---------- 오프라인 자동 채점 (키워드 커버리지) ---------- */
const STOP=new Set("및 등 또는 이거나 이고 그 수 것 데 때 시 중 경우 대한 위한 통해 대해 하는 되는 있는 없는 함 임 됨 여부 분석 확인 또한 그리고 하지 못하 위해".split(" "));
const SYN={ // 핵심항목에 이 문자열이 포함되면, 답안에 아래 동의어가 있어도 정답 인정
 "자동적 사고":["자동사고","automaticthought"],
 "역기능적 인지도식":["인지도식","스키마","schema","핵심신념","코어빌리프"],
 "인지적 오류":["인지오류","인지왜곡"],
 "무조건적 긍정적 존중":["무조건적수용","긍정적존중","무조건적존중"],
 "일치성":["진솔성","진실성","진정성","genuineness","congruence"],
 "공감적 이해":["공감","empathy"],
 "재귀인":["귀인재구성","재귀인하기","재귀인","reattribution"],
 "증상처방":["역설","역설적개입","증상처방하기"],
 "재구조화":["재명명","reframing","리프레이밍"],
 "무선반응":["무선적반응","무작위반응","random"],
 "자폐스펙트럼장애":["자폐증","자폐","autism","asd"],
 "쌍둥이":["분신","트윈십","twinship"],
 "기본지식":["상식","일반상식","information"],
 "빠진 곳 찾기":["빠진곳찾기","picturecompletion"],
 "차례 맞추기":["차례맞추기","순서화","picturearrangement"],
 "토막짜기":["토막 짜기","블록디자인","blockdesign"],
 "행렬추론":["행렬 추론","매트릭스","matrixreasoning"],
 "공통그림찾기":["공통 그림 찾기","pictureconcepts"]
};
const strip=s=>(s||"").toLowerCase().replace(/[\s\u00b7,.\/()（）\[\]{}"'`~!?;:_—\-]/g,"");
const _tcache={};
function termsFor(kp){
  if(_tcache[kp]) return _tcache[kp];
  const out=new Set();
  (kp.match(/[（(]([^）)]+)[）)]/g)||[]).forEach(seg=>{
    seg.replace(/[（()）]/g,"").split(/[\/,·]/).forEach(x=>{const t=strip(x);if(t)out.add(t);});
  });
  const core=kp.replace(/\[[^\]]*\]/g," ").replace(/[（(][^）)]*[）)]/g," ");
  core.split(/[·\/]|—|,|、/).forEach(seg=>{
    const full=strip(seg); if(full.length>=3) out.add(full);
    seg.split(/\s+/).forEach(w=>{
      w=w.replace(/[을를이가은는의에서로으로과와도만에]$/,"");
      const c=strip(w);
      if(c.length>=2 && !STOP.has(w) && !STOP.has(c)) out.add(c);
    });
  });
  for(const key in SYN){ if(strip(kp).includes(strip(key))) SYN[key].forEach(s=>out.add(strip(s))); }
  const terms=[...out].filter(t=>t.length>=2 && !/^\d+$/.test(t));
  _tcache[kp]=terms; return terms;
}
function kpLabel(kp){return typeof kp==="string"?kp:(kp.label||"");}
function kpTermsets(kp){ // 필수요소별 term 배열 (단일 항목은 요소 1개)
  if(typeof kp==="string") return [termsFor(kp)];
  const parts=(kp.all&&kp.all.length)?kp.all:[kp.label];
  return parts.map(p=>termsFor(p));
}
function poolLabel(it){return typeof it==="string"?it:(it.t||it.label||"");}
function matchPool(it,A,inQ){ // 개수형 항목의 개별 요소 매칭(문자열, {t,ac}, 또는 {t,all})
  const t=poolLabel(it);
  if(it&&typeof it==="object"&&it.all){        // 복합 요소: 하위식이 모두 있어야 인정
    return it.all.every(part=>{ const f=strip(part); return f.length>=2 && !(inQ&&inQ(f)) && A.includes(f); });
  }
  const ac=(it&&typeof it==="object"&&it.ac)?it.ac:[];
  let forms=[strip(t)].concat(ac.map(strip)).concat((SYN[t]||[]).map(strip));
  if(inQ) forms=forms.filter(f=> !inQ(f));   // 문제 지문에 이미 나온 용어는 제외
  return forms.some(f=>f.length>=2 && A.includes(f));
}
function hasExplanation(ans){ // 설명형 문항에서 '나열'이 아닌 '설명'이 있는지 대략 판정
  const t=ans||"";
  if(/(때문|이란|라는|하는 것|을 측정|를 측정|능력|의미|이다|한다|된다|되어|—|:|means|즉|위해|통해)/.test(t)) return true;
  return (t.match(/[가-힣]/g)||[]).length>=60;
}
function localGrade(q,ans){
  const A=strip(ans), kps=q.keypoints||[], rubric=q.rubric||{};
  const Aq=strip(q.q||"");
  const inQ=f=> f.length>=2 && Aq.includes(f);   // 문제 지문에 이미 등장한 용어(되풀이 방지)
  // df는 개념/복합 항목에만 적용(개수형은 pool로 별도 매칭)
  const df={};
  kps.forEach(kp=>{ if(kp&&kp.pool) return;
    const u=new Set(); kpTermsets(kp).forEach(s=>s.forEach(t=>u.add(t))); u.forEach(t=>df[t]=(df[t]||0)+1); });

  const items=[];
  kps.forEach(kp=>{
    if(kp && kp.pool){                                   // ── 개수형(N개 중 min개)
      const min=kp.min||1;
      const hits=kp.pool.filter(it=>matchPool(it,A,inQ)).map(poolLabel);
      const c=hits.length, covered=c>=min, frac=Math.max(0,Math.min(1,c/min));
      items.push({label:kpLabel(kp),covered,frac,w:1,note:`${c}/${min}${hits.length?" · "+hits.join(", "):""}`});
    } else {                                             // ── 개념형/복합형
      const ok=kpTermsets(kp).every(set=>{
        const allowed=set.filter(t=> !inQ(t));           // 지문 용어는 매칭에서 제외
        const pref=allowed.filter(t=> df[t]===1 || t.length>=6); // 변별어 우선
        const pool=pref.length?pref:allowed;
        return pool.length ? pool.some(t=>A.includes(t)) : false;
      });
      items.push({label:kpLabel(kp),covered:ok,frac:ok?1:0,w:1,note:""});
    }
  });
  if(rubric.requireExplanation){                          // ── 설명 필요(합성 항목, 가중치 낮게)
    const ok=hasExplanation(ans);
    items.push({label:"각 항목에 대한 설명 포함",covered:ok,frac:ok?1:0,w:0.4,note:ok?"":"나열만 있고 설명이 부족해 보임",soft:true});
  }

  const tot=items.length||1;
  const wsum=items.reduce((s,i)=>s+(i.w||1),0)||1;
  const score=Math.round(100*items.reduce((s,i)=>s+i.frac*(i.w||1),0)/wsum);
  const verdict=score>=80?"정답":score>=40?"부분정답":"오답";

  const cautions=[];
  (rubric.cautions||[]).forEach(cn=>{ const forms=[strip(cn.term)].concat((cn.alt||[]).map(strip));
    if(forms.some(f=>f.length>=2 && A.includes(f))) cautions.push(cn.note||(cn.term+" 확인 필요")); });

  const missed=items.filter(i=>!i.covered).map(i=>i.label);
  let fb=`채점항목 ${tot}개 중 ${items.filter(i=>i.covered).length}개 충족.`;
  if(missed.length) fb+=`\n미충족: ${missed.join("  ·  ")}`;
  fb+=`\n※ 규칙 기반 채점입니다. 개수·핵심어는 확인하지만 ‘설명의 정확성·범주 분류’는 판정하지 못하니, 애매하면 ‘모범답안 대조’로 확인하세요.`;
  return {mode:"offline",answer:ans,status:"graded",score,verdict,items,cautions,coverage:items.map(i=>i.covered),feedback:fb,tip:""};
}

function paintResult(q,rec){
  const res=$("#result"); if(!res) return;
  const sc=rec.score, col= sc>=80?"var(--good)": sc>=40?"var(--ochre)":"var(--miss)";
  const items=rec.items||(q.keypoints||[]).map((k,i)=>({label:kpLabel(k),covered:(rec.coverage||[])[i]===true,frac:(rec.coverage||[])[i]?1:0,note:""}));
  let covHtml="";
  if(items.length){
    covHtml='<div class="cov-title">채점항목 커버리지</div><div class="cov">'+
      items.map(it=>{
        const cls=it.covered?'hit':(it.frac>0?'part':'no'), mk=it.covered?'✓':(it.frac>0?'△':'—');
        return `<div class="cov-item ${cls}"><span class="mk">${mk}</span><span class="tx">${escapeHtml(it.label)}${it.note?` <em class="note-sm">${escapeHtml(it.note)}</em>`:''}</span></div>`;
      }).join("")+'</div>';
  }
  let cauHtml="";
  if(rec.cautions&&rec.cautions.length){
    cauHtml='<div class="cautions">'+rec.cautions.map(c=>`<div class="caution-item">⚠ ${escapeHtml(c)}</div>`).join("")+'</div>';
  }
  const label = rec.mode==="offline"?"규칙 기반 자동 채점":"자가 채점";
  res.innerHTML=
    `<div class="scorewrap">
       <div class="score-ring" style="--p:${sc};--sc:${col}"><i style="--sc:${col}">${sc}</i></div>
       <div class="verdict"><b style="color:${col}">${escapeHtml(rec.verdict||'')}</b><span>${label} · 100점 만점 · 참고용</span></div>
     </div>
     ${covHtml}
     ${cauHtml}
     ${rec.feedback?`<div class="feedback">${escapeHtml(rec.feedback)}${rec.tip?'\n\n▸ 보완: '+escapeHtml(rec.tip):''}</div>`:''}`;
  res.classList.add("show");
}

/* ---------- self-grade ---------- */
function revealModel(q,silent){
  const box=$("#model"); if(!box) return;
  box.style.display="block";
  const kp=(q.keypoints||[]).map((k,i)=>{
    let s=`${i+1}. ${kpLabel(k)}`;
    if(k&&k.pool) s+="\n   "+k.pool.map(poolLabel).map(p=>`· ${p}`).join("\n   ");
    return s;
  }).join("\n");
  box.innerHTML=`<h4>정답 · 채점 핵심</h4><pre>${escapeHtml(kp)}</pre>
    ${q.explain?`<h4 style="margin-top:16px">${q.verified===false?'시험 답안 · 실제 이해':'해설'}</h4><pre>${escapeHtml(q.explain)}</pre>`:''}
    ${q.verified===false && q.review_notes && q.review_notes.length?`<h4 style="margin-top:16px">검수 메모</h4><pre>${escapeHtml(q.review_notes.join('\n'))}</pre>`:''}
    <div class="selfscore">
      <button class="btn sb-good" data-s="100">맞았어요</button>
      <button class="btn sb-part" data-s="60">부분 정답</button>
      <button class="btn sb-miss" data-s="0">틀렸어요</button>
    </div>`;
  const rec=REC[qid(q)]||{};
  box.querySelectorAll(".selfscore .btn").forEach(b=>{
    if(rec.mode==="self"&&String(rec.score)===b.dataset.s) b.classList.add("sel");
    b.onclick=async()=>{
      const ans=$("#ans")?$("#ans").value:"";
      REC[qid(q)]={mode:"self",revealed:true,answer:ans,status:"self",score:+b.dataset.s,
        verdict:b.dataset.s==="100"?"정답":b.dataset.s==="60"?"부분정답":"오답"};
      await saveState();
      box.querySelectorAll(".selfscore .btn").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); renderGrid(); renderStats();
    };
  });
  if(!silent && REC[qid(q)]&&REC[qid(q)].mode!=="self"){ /* keep ai result visible too */ }
}

/* ---------- toolbar ---------- */
$("#filterWrong").onclick=function(){ wrongOnly=!wrongOnly; this.classList.toggle("on",wrongOnly);
  const qs=inYear(curYear).filter(q=>{const s=statusOf(qid(q));return s==="miss"||s==="part";});
  if(wrongOnly&&qs.length) curId=qid(qs[0]); renderGrid(); renderStage(); };
$("#resetBtn").onclick=async function(){
  if(!confirm("현재까지의 답안·채점 기록을 모두 지울까요?")) return;
  REC={}; await saveState(); renderAll(); };

function renderLevels(){
  const box=$("#levels"); if(!box) return; box.innerHTML="";
  const names={1:"1급",2:"2급"};
  levels().forEach(lv=>{
    const b=el("button","lvbtn"+(lv===curLevel?" active":""), names[lv]||("Lv"+lv));
    b.onclick=()=>{ if(lv===curLevel) return; curLevel=lv; _freqCache=null;
      const ys=years(); curYear=ys[0]||null; const f=inYear(curYear); curId=f[0]?qid(f[0]):null;
      wrongOnly=false; const fw=$("#filterWrong"); if(fw) fw.classList.remove("on");
      renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    box.appendChild(b);
  });
}
function renderAll(){ renderLevels(); renderYears(); renderStats(); renderGrid(); renderStage(); }

(async function init(){
  await loadState();
  curLevel=levels()[0]||1;
  const ys=years();
  curYear=ys[0]||2025;
  const first=inYear(curYear)[0]; curId=first?qid(first):null;
  renderAll();
})();
